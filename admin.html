<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>下貨點收｜管理後台</title>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;
  background:var(--paper);
  color:var(--ink);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:25px 18px 60px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid var(--ink);
  padding-bottom:15px;
  margin-bottom:25px;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header span{
  color:var(--muted);
  font-size:13px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:20px;
  overflow:hidden;
}

.card-title{
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  font-size:16px;
  font-weight:700;
}

.card-body{
  padding:18px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:10px 15px;
  font-size:14px;
}

.btn.primary{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

.btn.green{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.btn.red{
  background:var(--warn);
  border-color:var(--warn);
  color:#fff;
}

input[type=text]{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:15px;
  font-family:inherit;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:11px 10px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

th{
  background:#faf9f5;
  color:var(--muted);
  font-size:12px;
}

.status{
  margin:10px 0;
  padding:10px 12px;
  border-radius:8px;
  background:#faf9f5;
  color:var(--muted);
  font-size:13px;
}

.status.ok{
  background:var(--accent-dim);
  color:var(--accent);
}

.status.err{
  background:#f4e2dd;
  color:var(--warn);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  background:#eee;
}

.badge.on{
  background:var(--accent-dim);
  color:var(--accent);
}

.badge.off{
  background:#eee;
  color:#888;
}

.fixed{
  display:flex;
  align-items:center;
  gap:6px;
}

.fixed input{
  width:18px;
  height:18px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.add-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-bottom:15px;
}

.report{
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
  margin-bottom:10px;
  background:#fff;
}

.report-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.report-date{
  font-weight:700;
}

.report-info{
  font-size:13px;
  line-height:1.8;
  color:#555;
}

.photos{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.photos a{
  display:block;
}

.photos img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid var(--line);
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.loading{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

@media(max-width:700px){

  .wrap{
    padding:18px 12px 40px;
  }

  th:nth-child(1),
  td:nth-child(1){
    display:none;
  }

  .card-body{
    padding:12px;
  }

}

</style>

</head>

<body>

<div class="wrap">

  <div class="header">

    <h1>下貨點收管理後台</h1>

    <span id="loginStatus">
      管理員
    </span>

  </div>


  <!-- ==========================
       系統狀態
  =========================== -->

  <div
    id="status"
    class="status"
  >
    系統載入中…
  </div>


  <!-- ==========================
       大車管理
  =========================== -->

  <div class="card">

    <div class="card-title">
      大車管理
    </div>

    <div class="card-body">

      <div class="add-row">

        <input
          type="text"
          id="newTruck"
          placeholder="輸入大車名稱，例如：1號大車"
        >

        <button
          class="btn primary"
          onclick="addTruck()"
        >
          新增大車
        </button>

      </div>


      <div id="truckTable">
        <div class="loading">
          載入中…
        </div>
      </div>

    </div>

  </div>


  <!-- ==========================
       下貨人員
  =========================== -->

  <div class="card">

    <div class="card-title">
      下貨人員管理
    </div>

    <div class="card-body">

      <div class="add-row">

        <input
          type="text"
          id="newStaff"
          placeholder="輸入下貨人員姓名"
        >

        <button
          class="btn primary"
          onclick="addStaff()"
        >
          新增人員
        </button>

      </div>


      <div id="staffTable">
        <div class="loading">
          載入中…
        </div>
      </div>

    </div>

  </div>


  <!-- ==========================
       回報紀錄
  =========================== -->

  <div class="card">

    <div class="card-title">
      下貨回報紀錄
    </div>

    <div class="card-body">

      <div class="toolbar">

        <button
          class="btn primary"
          onclick="loadReports()"
        >
          重新整理
        </button>

      </div>

      <div id="reports">

        <div class="loading">
          載入中…
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =================================================
   後端網址
================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycby8oksNTRuZEty3SpTCFYi2-QLdmLAVnQql9GxdKazFrg9DBLBTmTjfjFAifrj0gkBH/exec";


/* =================================================
   管理資料
================================================= */

let systemData = null;


/* =================================================
   狀態
================================================= */

function setStatus(message,type=""){

  const el =
    document.getElementById("status");

  el.textContent =
    message;

  el.className =
    "status " + type;

}


/* =================================================
   取得資料
================================================= */

async function loadData(){

  try{

    setStatus(
      "正在讀取系統資料…"
    );

    const response =
      await fetch(
        BACKEND_URL +
        "?t=" +
        Date.now()
      );

    const result =
      await response.json();

    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "讀取失敗"
      );

    }

    systemData =
      result.data;

    renderTrucks();

    renderStaff();

    setStatus(
      "✓ 系統資料已更新",
      "ok"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "無法連接後端：" +
      error.message,
      "err"
    );

  }

}


/* =================================================
   大車
================================================= */

function renderTrucks(){

  const container =
    document.getElementById(
      "truckTable"
    );

  const trucks =
    systemData &&
    systemData.trucks
      ? systemData.trucks
      : [];

  if(
    trucks.length === 0
  ){

    container.innerHTML =
      `
      <div class="empty">
        目前沒有啟用中的大車
      </div>
      `;

    return;

  }


  let html = `
    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>大車名稱</th>

          <th>固定置頂</th>

          <th>狀態</th>

          <th>操作</th>

        </tr>

      </thead>

      <tbody>
  `;


  trucks.forEach(
    truck => {

      html += `

        <tr>

          <td>
            ${escapeHtml(truck.id)}
          </td>

          <td>
            ${escapeHtml(truck.name)}
          </td>

          <td>

            <label class="fixed">

              <input
                type="checkbox"
                ${truck.fixed ? "checked" : ""}
                onchange="
                  toggleFixed(
                    '${escapeAttr(truck.id)}',
                    this.checked
                  )
                "
              >

              固定置頂

            </label>

          </td>

          <td>

            <span class="badge on">
              啟用
            </span>

          </td>

          <td>

            <div class="actions">

              <button
                class="btn red"
                onclick="
                  disableTruck(
                    '${escapeAttr(truck.id)}'
                  )
                "
              >
                停用
              </button>

            </div>

          </td>

        </tr>

      `;

    }
  );


  html += `
      </tbody>
    </table>
  `;


  container.innerHTML =
    html;

}


/* =================================================
   下貨人員
================================================= */

function renderStaff(){

  const container =
    document.getElementById(
      "staffTable"
    );

  const staff =
    systemData &&
    systemData.staff
      ? systemData.staff
      : [];

  if(
    staff.length === 0
  ){

    container.innerHTML =
      `
      <div class="empty">
        目前沒有啟用中的下貨人員
      </div>
      `;

    return;

  }


  let html = `

    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>姓名</th>

          <th>狀態</th>

          <th>操作</th>

        </tr>

      </thead>

      <tbody>

  `;


  staff.forEach(
    person => {

      html += `

        <tr>

          <td>
            ${escapeHtml(person.id)}
          </td>

          <td>
            ${escapeHtml(person.name)}
          </td>

          <td>

            <span class="badge on">
              啟用
            </span>

          </td>

          <td>

            <button
              class="btn red"
              onclick="
                disableStaff(
                  '${escapeAttr(person.id)}'
                )
              "
            >
              停用
            </button>

          </td>

        </tr>

      `;

    }
  );


  html += `
      </tbody>
    </table>
  `;


  container.innerHTML =
    html;

}


/* =================================================
   新增大車
================================================= */

async function addTruck(){

  const input =
    document.getElementById(
      "newTruck"
    );

  const name =
    input.value.trim();

  if(!name){

    alert(
      "請輸入大車名稱"
    );

    return;

  }


  try{

    await apiPost({
      action:"addTruck",
      name:name
    });

    input.value = "";

    await loadData();

  }catch(error){

    alert(
      "新增失敗：" +
      error.message
    );

  }

}


/* =================================================
   新增下貨人員
================================================= */

async function addStaff(){

  const input =
    document.getElementById(
      "newStaff"
    );

  const name =
    input.value.trim();

  if(!name){

    alert(
      "請輸入姓名"
    );

    return;

  }


  try{

    await apiPost({
      action:"addStaff",
      name:name
    });

    input.value = "";

    await loadData();

  }catch(error){

    alert(
      "新增失敗：" +
      error.message
    );

  }

}


/* =================================================
   固定大車
================================================= */

async function toggleFixed(
  id,
  fixed
){

  try{

    await apiPost({

      action:
        "setTruckFixed",

      id:
        id,

      fixed:
        fixed

    });

    await loadData();

  }catch(error){

    alert(
      "修改失敗：" +
      error.message
    );

    await loadData();

  }

}


/* =================================================
   停用大車
================================================= */

async function disableTruck(id){

  if(
    !confirm(
      "確定要停用這台大車嗎？"
    )
  ){

    return;

  }


  try{

    await apiPost({

      action:
        "disableTruck",

      id:
        id

    });

    await loadData();

  }catch(error){

    alert(
      "停用失敗：" +
      error.message
    );

  }

}


/* =================================================
   停用人員
================================================= */

async function disableStaff(id){

  if(
    !confirm(
      "確定要停用這位下貨人員嗎？"
    )
  ){

    return;

  }


  try{

    await apiPost({

      action:
        "disableStaff",

      id:
        id

    });

    await loadData();

  }catch(error){

    alert(
      "停用失敗：" +
      error.message
    );

  }

}


/* =================================================
   POST
================================================= */

async function apiPost(data){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)

      }
    );


  const text =
    await response.text();


  try{

    const result =
      JSON.parse(text);

    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "操作失敗"
      );

    }

    return result;

  }catch(error){

    throw new Error(
      "後端沒有回傳正確資料"
    );

  }

}


/* =================================================
   回報紀錄
================================================= */

async function loadReports(){

  const container =
    document.getElementById(
      "reports"
    );


  container.innerHTML =
    `
    <div class="loading">
      回報紀錄載入中…
    </div>
    `;


  try{

    const response =
      await fetch(
        BACKEND_URL +
        "?action=reports&t=" +
        Date.now()
      );


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "讀取失敗"
      );

    }


    const reports =
      result.data &&
      result.data.reports
        ? result.data.reports
        : [];


    if(
      reports.length === 0
    ){

      container.innerHTML =
        `
        <div class="empty">
          目前沒有回報紀錄
        </div>
        `;

      return;

    }


    container.innerHTML =
      "";


    reports.forEach(
      report => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "report";


        let photoHtml =
          "";


        if(
          Array.isArray(
            report.photos
          )
        ){

          photoHtml =
            `
            <div class="photos">
              ${
                report.photos.map(
                  url => `
                    <a
                      href="${escapeAttr(url)}"
                      target="_blank"
                    >
                      <img
                        src="${escapeAttr(url)}"
                        loading="lazy"
                      >
                    </a>
                  `
                ).join("")
              }
            </div>
            `;

        }


        div.innerHTML = `

          <div class="report-head">

            <div class="report-date">
              ${escapeHtml(report.date || "")}
              ${escapeHtml(report.time || "")}
            </div>

            <strong>
              ${escapeHtml(report.employee || "")}
            </strong>

          </div>

          <div class="report-info">

            <div>
              <b>大車：</b>
              ${escapeHtml(report.trucks || "")}
            </div>

            <div>
              <b>下貨人員：</b>
              ${escapeHtml(report.staff || "")}
            </div>

            <div>
              <b>件數：</b>
              ${escapeHtml(report.qtyStatus || "")}
            </div>

            <div>
              <b>備註：</b>
              ${escapeHtml(report.note || "")}
            </div>

          </div>

          ${photoHtml}

        `;


        container.appendChild(
          div
        );

      }
    );


  }catch(error){

    console.error(error);

    container.innerHTML =
      `
      <div class="status err">
        回報紀錄載入失敗：
        ${escapeHtml(error.message)}
      </div>
      `;

  }

}


/* =================================================
   防止 HTML 注入
================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =================================================
   啟動
================================================= */

async function init(){

  await loadData();

  await loadReports();

}


init();

</script>

</body>

</html>
