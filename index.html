<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;

  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

body.uploading{
  overflow:hidden;
}

button,
textarea{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 110px;
}


/* =================================================
   頂部
================================================= */

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:22px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  margin:0;
  font-size:19px;
}

.who{
  display:block;
  margin-top:5px;
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--muted);
  font-size:12px;
}

.top-actions{
  display:flex;
  gap:6px;
}

.top-btn{
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:var(--ink);
  font-size:12px;
}


/* =================================================
   語言
================================================= */

.language-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--paper);
}

.language-screen.show{
  display:flex;
}

.language-box{
  width:100%;
  max-width:380px;
  text-align:center;
}

.language-box h2{
  margin:0 0 8px;
}

.language-box p{
  color:var(--muted);
}

.language-options{
  display:grid;
  gap:10px;
}

.language-option{
  padding:16px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:700;
}


/* =================================================
   表單
================================================= */

fieldset{
  margin:0 0 22px;
  padding:0;
  border:none;
}

legend{
  margin-bottom:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
}


/* =================================================
   大車
================================================= */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  position:relative;
  width:100%;
  padding:14px 42px 14px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  font-size:16px;
}

.truck-arrow{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  pointer-events:none;
  transition:.2s;
}

.truck-arrow svg{
  width:100%;
  height:100%;
}

.truck-select-wrap.open .truck-arrow{
  transform:
    translateY(-50%)
    rotate(180deg);
}

.truck-dropdown{
  position:absolute;
  z-index:50;
  display:none;
  left:0;
  right:0;
  margin-top:6px;
  overflow:hidden;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border-bottom:1px solid #eee;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f1efe8;
}

.truck-option.used .truck-name{
  color:#99968a;
}

.used-staff{
  margin-left:auto;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding:3px 7px;
  border-radius:20px;
  background:#e7e4dc;
  color:#747166;
  font-size:11px;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--line);
}

.truck-dropdown-footer button{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}

.truck-dropdown-footer .primary{
  border-color:var(--ink);
  background:var(--ink);
  color:#fff;
}


/* =================================================
   人員
================================================= */

.staff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.staff-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 10px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:var(--accent-dim);
  color:var(--accent);
  font-size:12px;
}


/* =================================================
   件數
================================================= */

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;
  padding:14px 0;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font-weight:700;
}

.seg button[data-v="ok"].active{
  border-color:var(--accent);
  background:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  border-color:var(--warn);
  background:var(--warn);
  color:#fff;
}


/* =================================================
   照片
================================================= */

.photo-upload{
  position:relative;
  padding:18px;
  border:1.5px dashed var(--line);
  border-radius:12px;
  background:#fff;
  color:#8a8879;
  text-align:center;
}

.photo-upload .icon{
  display:block;
  margin-bottom:6px;
  font-size:30px;
}

.photo-upload input{
  position:absolute;
  inset:0;
  opacity:0;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.thumb{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:8px;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.thumb .rm{
  position:absolute;
  top:3px;
  right:3px;
  width:24px;
  height:24px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
}

.hint{
  margin-top:6px;
  color:#99968a;
  font-size:12px;
}

textarea{
  width:100%;
  min-height:80px;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:16px;
}


/* =================================================
   進度
================================================= */

.upload-progress-screen{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:12vh 22px 22px;
  background:rgba(28,31,26,.52);
  backdrop-filter:blur(4px);
}

.upload-progress-screen.open{
  display:flex;
}

.upload-progress-box{
  width:100%;
  max-width:360px;
  padding:22px 20px;
  border-radius:16px;
  background:#fff;
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}

.upload-progress-stage{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-bottom:12px;
}

.upload-progress-stage span{
  padding:4px 9px;
  border-radius:999px;
  background:#f0eee6;
  color:#a3a091;
  font-size:10px;
  font-weight:700;
}

.upload-progress-stage span.active{
  background:var(--accent);
  color:#fff;
}

.upload-progress-stage span.done{
  background:var(--accent-dim);
  color:var(--accent);
}

.upload-progress-title{
  font-weight:800;
  text-align:center;
}

.upload-progress-count{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.upload-progress-track{
  height:10px;
  margin-top:17px;
  overflow:hidden;
  border-radius:999px;
  background:#e8e5dc;
}

.upload-progress-fill{
  width:0;
  height:100%;
  border-radius:999px;
  background:var(--accent);
  transition:width .25s;
}

.upload-progress-text{
  margin-top:11px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}


/* =================================================
   回報紀錄
================================================= */

.history-screen{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  overflow-y:auto;
  background:var(--paper);
}

.history-screen.open{
  display:block;
}

.history-wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 40px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.history-header h2{
  margin:0;
}

.history-close{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
}

.history-loading,
.history-empty{
  padding:30px 0;
  color:var(--muted);
  text-align:center;
}

.history-day{
  border-bottom:1px solid var(--line);
}

.history-day-head{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  padding:14px 0;
}

.history-toggle{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0;
  border:none;
  background:transparent;
  color:var(--ink);
  text-align:left;
}

.history-arrow{
  width:22px;
  transition:.2s;
}

.history-day.open .history-arrow{
  transform:rotate(90deg);
}

.history-date{
  font-size:17px;
  font-weight:800;
}

.history-photo-all{
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:11px;
}

.history-day-body{
  display:none;
  padding-bottom:14px;
}

.history-day.open .history-day-body{
  display:block;
}

.day-loading{
  padding:18px;
  color:var(--muted);
  text-align:center;
}


/* =================================================
   卡片
================================================= */

.report-card{
  margin-top:9px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.report-main{
  display:flex;
  align-items:center;
  gap:8px;
}

.report-truck{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:20px;
  font-weight:900;
}

.report-staff{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#555;
  font-size:13px;
}

.report-status{
  margin-left:auto;
  flex-shrink:0;
  font-size:12px;
  font-weight:800;
}

.report-status.ok{
  color:var(--accent);
}

.report-status.bad{
  color:var(--warn);
}

.report-time{
  margin-top:6px;
  color:#99968a;
  font-size:11px;
}

.report-note{
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  background:#f7f5ef;
  font-size:12px;
}


/* =================================================
   四格縮圖
   無框、填滿
================================================= */

.report-photos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.report-photo{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:7px;
}

.report-photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.report-footer{
  display:flex;
  align-items:center;
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid #eee;
}

.report-employee{
  color:#8a8879;
  font-size:11px;
}

.report-delete{
  margin-left:auto;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--warn);
  font-size:11px;
}


/* =================================================
   當日全部照片
   三格
================================================= */

.all-photo-screen{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  overflow-y:auto;
  background:rgba(20,20,18,.97);
}

.all-photo-screen.open{
  display:block;
}

.all-photo-wrap{
  max-width:600px;
  margin:0 auto;
  padding:16px 14px 40px;
}

.all-photo-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
  color:#fff;
}

.all-photo-close{
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
  background:rgba(255,255,255,.08);
  color:#fff;
}

.all-photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.all-photo-item{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:7px;
}

.all-photo-item img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}


/* =================================================
   放大
================================================= */

.lightbox{
  position:fixed;
  inset:0;
  z-index:600;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.94);
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

.lightbox-close{
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:50%;
  background:rgba(255,255,255,.1);
  color:#fff;
}


/* =================================================
   送出
================================================= */

.submit-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:
    12px 18px
    calc(
      12px +
      env(safe-area-inset-bottom)
    );
  border-top:1px solid var(--line);
  background:var(--paper);
}

.submit-bar .inner{
  max-width:480px;
  margin:0 auto;
}

.submit{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

.submit:disabled{
  background:#aaa79a;
}

.status{
  min-height:16px;
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;
  color:var(--muted);
  text-align:center;
}

</style>

</head>


<body>


<div
  class="language-screen"
  id="languageScreen"
>

  <div class="language-box">

    <h2>選擇語言</h2>

    <p>Choose your language</p>

    <div class="language-options">

      <button
        class="language-option"
        data-lang="zh"
      >
        中文
      </button>

      <button
        class="language-option"
        data-lang="vi"
      >
        Tiếng Việt
      </button>

    </div>

  </div>

</div>


<div class="wrap">

  <div class="brand">

    <div class="brand-left">

      <h1 data-i18n="title">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>

    <div class="top-actions">

      <button
        class="top-btn"
        id="historyBtn"
      >
        📋 回報紀錄
      </button>

      <button
        class="top-btn"
        id="languageBtn"
      >
        中文
      </button>

    </div>

  </div>


  <fieldset>

    <legend data-i18n="truck">
      大車
    </legend>

    <div
      class="truck-select-wrap"
      id="truckSelectWrap"
    >

      <button
        class="truck-select-button"
        id="truckSelectButton"
      >

        <span id="truckSelectText">
          大車載入中…
        </span>

        <span class="truck-arrow">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline
              points="6 9 12 15 18 9"
            />
          </svg>

        </span>

      </button>


      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >

          <div class="loading">
            大車資料載入中…
          </div>

        </div>

        <div class="truck-dropdown-footer">

          <button
            id="truckClearBtn"
            data-i18n="clear"
          >
            清除
          </button>

          <button
            class="primary"
            id="truckDoneBtn"
            data-i18n="done"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>


  <fieldset>

    <legend data-i18n="staff">
      下貨人員
    </legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >

      <div class="loading">
        下貨人員資料載入中…
      </div>

    </div>

    <div
      class="line-match-hint"
      id="lineMatchHint"
      style="display:none;"
    ></div>

  </fieldset>


  <fieldset>

    <legend data-i18n="qty">
      件數是否正確
    </legend>

    <div
      class="seg"
      id="qtySeg"
    >

      <button
        data-v="ok"
        class="active"
        data-i18n="qtyOk"
      >
        ✓ 件數正確
      </button>

      <button
        data-v="bad"
        data-i18n="qtyBad"
      >
        ✗ 有多有少
      </button>

    </div>

  </fieldset>


  <fieldset>

    <legend data-i18n="photo">
      照片
    </legend>

    <div class="photo-upload">

      <span class="icon">
        📷
      </span>

      <span data-i18n="uploadPhoto">
        點此上傳照片（可一次選多張）
      </span>

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        multiple
      >

    </div>

    <div
      class="photo-grid"
      id="photoGrid"
    ></div>

    <div
      class="hint"
      data-i18n="photoHint"
    >
      至少上傳1張
    </div>

  </fieldset>


  <fieldset>

    <legend data-i18n="note">
      備註（選填）
    </legend>

    <textarea
      id="note"
      data-i18n-placeholder="notePlaceholder"
      placeholder="有多有少的原因、異常說明等"
    ></textarea>

  </fieldset>

</div>


<div class="submit-bar">

  <div class="inner">

    <button
      class="submit"
      id="submitBtn"
      data-i18n="submit"
    >
      送出回報
    </button>

    <div
      class="status"
      id="statusMsg"
    ></div>

  </div>

</div>


<div
  class="upload-progress-screen"
  id="uploadProgressScreen"
>

  <div class="upload-progress-box">

    <div
      class="upload-progress-stage"
      id="uploadProgressStage"
    >

      <span data-stage="process">
        處理
      </span>

      <span data-stage="compress">
        壓縮
      </span>

      <span data-stage="upload">
        上傳
      </span>

    </div>

    <div
      class="upload-progress-title"
      id="uploadProgressTitle"
    ></div>

    <div
      class="upload-progress-count"
      id="uploadProgressCount"
    ></div>

    <div class="upload-progress-track">

      <div
        class="upload-progress-fill"
        id="uploadProgressFill"
      ></div>

    </div>

    <div
      class="upload-progress-text"
      id="uploadProgressText"
    ></div>

  </div>

</div>


<div
  class="history-screen"
  id="historyScreen"

/* =================================================
   GET
================================================= */

async function getBackend(
  type,
  extra
){

  const params =
    new URLSearchParams();


  params.set(
    "type",
    type
  );


  params.set(
    "t",
    Date.now()
  );


  if (
    extra
  ) {

    Object.keys(
      extra
    ).forEach(
      function(key){

        params.set(
          key,
          extra[key]
        );

      }
    );

  }


  const response =
    await fetch(
      BACKEND_URL +
      "?" +
      params.toString(),
      {

        method:
          "GET",

        cache:
          "no-store"

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  } catch (error) {

    throw new Error(
      "後端沒有回傳正確 JSON"
    );

  }


  if (
    !result.success
  ) {

    throw new Error(
      result.error ||
      "後端執行失敗"
    );

  }


  return result;

}


/* =================================================
   POST
================================================= */

async function postBackend(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:
          "POST",

        headers:{

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  } catch (error) {

    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if (
    !result.success
  ) {

    throw new Error(
      result.error ||
      "Apps Script 執行失敗"
    );

  }


  return result;

}

/* =================================================
   大車排序
================================================= */

function sortedTrucks(){

  return truckData

    .map(
      function(
        truck,
        index
      ){

        return {

          truck:
            truck,

          originalIndex:
            index

        };

      }
    )

    .sort(
      function(a,b){

        const fixedA =
          a.truck.fixed ===
          true;


        const fixedB =
          b.truck.fixed ===
          true;


        /*
         * D 欄固定置頂最高優先。
         */

        if (
          fixedA !==
          fixedB
        ) {

          return fixedA
            ? -1
            : 1;

        }


        if (
          fixedA &&
          fixedB
        ) {

          return (
            a.originalIndex -
            b.originalIndex
          );

        }


        const usedA =
          Boolean(
            truckLastUsed[
              a.truck.name
            ]
          );


        const usedB =
          Boolean(
            truckLastUsed[
              b.truck.name
            ]
          );


        /*
         * 非固定車：
         * 今天用過排最後。
         */

        if (
          usedA !==
          usedB
        ) {

          return usedA
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )

    .map(
      function(item){

        return item.truck;

      }
    );

}


/* =================================================
   大車顯示
================================================= */

function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  list.innerHTML =
    "";


  sortedTrucks()
    .forEach(
      function(truck){

        const usage =
          truckLastUsed[
            truck.name
          ] ||
          null;


        const isUsed =
          Boolean(
            usage
          );


        const label =
          document.createElement(
            "label"
          );


        label.className =
          "truck-option" +
          (
            isUsed
              ? " used"
              : ""
          );


        const checkbox =
          document.createElement(
            "input"
          );


        checkbox.type =
          "checkbox";


        checkbox.value =
          truck.name;


        checkbox.checked =
          selectedTrucks.has(
            truck.name
          );


        checkbox.addEventListener(
          "change",
          function(){

            if (
              checkbox.checked
            ) {

              selectedTrucks.add(
                truck.name
              );

            } else {

              selectedTrucks.delete(
                truck.name
              );

            }


            updateTruckButtonText();

          }
        );


        const name =
          document.createElement(
            "span"
          );


        name.className =
          "truck-name";


        name.textContent =
          truck.name;


        label.appendChild(
          checkbox
        );


        label.appendChild(
          name
        );


        if (
          isUsed &&
          usage.staff
        ) {

          const staff =
            document.createElement(
              "span"
            );


          staff.className =
            "used-staff";


          staff.textContent =
            usage.staff;


          label.appendChild(
            staff
          );

        }


        list.appendChild(
          label
        );

      }
    );


  updateTruckButtonText();

}


function updateTruckButtonText(){

  const names =
    Array.from(
      selectedTrucks

  const el =
    document.getElementById(
      "truckSelectText"

  if (
    names.length === 0

    el.textContent =
      "請選擇大車…";

  } else if (
    names.length === 1

    el.textContent =

  } else {

    el.textContent =
      "已選 " +
      names.length +
      " 台：" +
      names.join(
        "、"

  }

}

function autoMatchLineStaff(){

  const current =
    String(
      userName
    )
      .trim()
      .toLowerCase();


  const matched =
    staffData.find(
      function(staff){

        return (
          String(
            staff.lineName ||
            ""
          )
            .trim()
            .toLowerCase() ===
          current
        );

      }
    );


  if (!matched) {

    return;

  }


  const input =
    [
      ...
      document.querySelectorAll(
        "#staffGrid input"
      )
    ].find(
      function(item){

        return (
          item.value ===
          matched.name
        );

      }
    );


  if (!input) {

    return;

  }


  input.checked =
    true;


  const item =
    input.closest(
      ".staff-item"
    );


  if (
    item
  ) {

    item.classList.add(
      "selected"
    );

  }


  const hint =
    document.getElementById(
      "lineMatchHint"
    );


  hint.style.display =
    "block";


  hint.textContent =
    t(
      "lineMatch"
    )
      .replace(
        "{user}",
        userName
      )
      .replace(
        "{staff}",
        matched.name
      );

}

function readFileAsDataURL(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          resolve(
            event.target.result
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


function compressDataURL(
  rawData,
  maxW,
  quality
){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();


      img.onload =
        function(){

          const scale =
            Math.min(
              1,
              maxW /
              img.width
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            Math.round(
              img.width *
              scale
            );


          canvas.height =
            Math.round(
              img.height *
              scale
            );


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


      img.onerror =
        reject;


      img.src =
        rawData;

    }
  );

}

function setProgressStage(
  stage
){

  const stages =
    [
      "process",
      "compress",
      "upload"
    ];


  const activeIndex =
    stages.indexOf(
      stage
    );


  document
    .querySelectorAll(
      "#uploadProgressStage span"
    )
    .forEach(
      function(el){

        const index =
          stages.indexOf(
            el.dataset.stage
          );


        el.classList.remove(
          "active",
          "done"
        );


        if (
          index <
          activeIndex
        ) {

          el.classList.add(
            "done"
          );

        } else if (
          index ===
          activeIndex
        ) {

          el.classList.add(
            "active"
          );

        }

      }
    );

}


function updateProgress(
  title,
  percent,
  text,
  count
){

  document
    .getElementById(
      "uploadProgressTitle"
    )
    .textContent =
    title || "";


  document
    .getElementById(
      "uploadProgressFill"
    )
    .style.width =
    Math.min(
      100,
      Math.max(
        0,
        percent
      )
    ) +
    "%";


  document
    .getElementById(
      "uploadProgressText"
    )
    .textContent =
    text || "";


  document
    .getElementById(
      "uploadProgressCount"
    )
    .textContent =
    count || "";

}


document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const files =
        [
          ...
          event.target.files
        ].filter(
          function(file){

            return file.type.startsWith(
              "image/"
            );

          }
        );


      if (
        files.length === 0
      ) {

        return;

      }


      showProgress();


      try {

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          setProgressStage(
            "process"
          );


          updateProgress(
            t(
              "processingPhoto"
            ),
            (
              i /
              files.length
            ) *
            40,
            t(
              "processingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            files.length
          );


          const raw =
            await readFileAsDataURL(
              files[i]
            );


          setProgressStage(
            "compress"
          );


          updateProgress(
            t(
              "compressingPhoto"
            ),
            40 +
            (
              i /
              files.length
            ) *
            55,
            t(
              "compressingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            files.length
          );


          const compressed =
            await compressDataURL(
              raw,
              1200,
              0.72
            );


          photos.push(
            compressed
          );

        }


        renderPhotoGrid();


        hideProgress();


      } catch (error) {

        console.error(
          error
        );


        hideProgress();

      }


      event.target.value =
        "";

    }
  );

        "×";


      remove.addEventListener(
        "click",
        function(){

          if (
            isSubmitting
          ) {

            return;

          }


          photos.splice(
            index,
            1
          );


          renderPhotoGrid();

        }
      );


      div.appendChild(
        img
      );


      div.appendChild(
        remove
      );


      grid.appendChild(
        div
      );

    }
  );

}


/* =================================================
   送出
================================================= */

function getSelectedStaff(){

  return [
    ...
    document.querySelectorAll(
      "#staffGrid input:checked"
    )
  ].map(
    function(input){

      return input.value;

    }
  );

}


document
  .getElementById(
    "submitBtn"
  )
  .addEventListener(
    "click",
    async function(){

      if (
        isSubmitting
      ) {

        return;

      }


      const trucks =
        Array.from(
          selectedTrucks
        );


      const staff =
        getSelectedStaff();


      if (
        trucks.length === 0
      ) {

        setStatus(
          t(
            "needTruck"
          ),
          "err"
        );

        return;

      }


      if (
        staff.length === 0
      ) {

        setStatus(
          t(
            "needStaff"
          ),
          "err"
        );

        return;

      }


      if (
        photos.length === 0
      ) {

        setStatus(
          t(
            "needPhoto"
          ),
          "err"
        );

        return;

      }


      const qtyButton =
        document.querySelector(
          "#qtySeg button.active"
        );


      const qtyStatus =
        qtyButton &&
        qtyButton.dataset.v ===
        "bad"
          ? "有多有少"
          : "正確";


      isSubmitting =
        true;


      document
        .getElementById(
          "submitBtn"
        )
        .disabled =
        true;


      showProgress();


      setProgressStage(
        "upload"
      );


      let fakePercent =
        8;


      updateProgress(
        t(
          "uploading"
        ),
        fakePercent,
        t(
          "uploading"
        ),
        ""
      );


      /*
       * Apps Script POST 無法把伺服器內部
       * Drive 儲存進度逐張回傳給瀏覽器，
       * 所以這裡只會在 90% 前緩慢等待，
       * 絕不在後端完成前顯示 100%。
       */

      const timer =
        setInterval(
          function(){

            if (
              fakePercent <
              70
            ) {

              fakePercent +=
                2;

            } else if (
              fakePercent <
              88
            ) {

              fakePercent +=
                0.5;

            }


            updateProgress(
              fakePercent >
              75
                ? t(
                    "serverProcessing"
                  )
                : t(
                    "uploading"
                  ),
              fakePercent,
              fakePercent >
              75
                ? t(
                    "serverProcessing"
                  )
                : t(
                    "uploading"
                  ),
              ""
            );

          },
          350
        );


      try {

        const result =
          await postBackend({

            user:
              userName,

            trucks:
              trucks,

            staff:
              staff,

            qtyStatus:
              qtyStatus,

            note:
              document
                .getElementById(
                  "note"
                )
                .value
                .trim(),

            photos:
              photos.slice()

          });


        clearInterval(
          timer
        );


        updateProgress(
          t(
            "success"
          ),
          100,
          t(
            "success"
          ),
          ""
        );


        setStatus(
          t(
            "success"
          ),
          "ok"
        );


        /*
         * 新回報後：
         * 清除回報紀錄快取，
         * 下次打開重新取得日期。
         */

        reportDates =
          [];


        reportCache =
          {};


        trucks.forEach(
          function(truck){

            truckLastUsed[
              truck
            ] = {

              time:
                new Date(),

              staff:
                staff.join(
                  "、"
                )

            };

          }
        );


        selectedTrucks.clear();

        photos =
          [];


        renderTrucks();

        renderPhotoGrid();


        document
          .getElementById(
            "note"
          )
          .value =
          "";


        document
          .querySelectorAll(
            "#staffGrid input"
          )
          .forEach(
            function(input){

              input.checked =
                false;


              const item =
                input.closest(
                  ".staff-item"
                );


              if (
                item
              ) {

                item.classList.remove(
                  "selected"
                );

              }

            }
          );


        setTimeout(
          function(){

            hideProgress();


            isSubmitting =
              false;


            document
              .getElementById(
                "submitBtn"
              )
              .disabled =
              false;


            try {

              if (
                window.liff &&
                liff.isInClient()
              ) {

                liff.closeWindow();

              }

            } catch (error) {

              console.log(
                error
              );

            }

          },
          700
        );


      } catch (error) {

        clearInterval(
          timer
        );


        hideProgress();


        isSubmitting =
          false;


        document
          .getElementById(
            "submitBtn"
          )
          .disabled =
          false;


        setStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "err"
        );

      }

    }
  );

document
  .getElementById(

  )
  .addEventListener(

      document

        )

        );

document

  )

        .getElementById(

async function loadReportDates(){

  const content =
    document.getElementById(
      "historyContent"
    );


  content.innerHTML =
    '<div class="history-loading">' +
    t(
      "historyLoading"
    ) +
    "</div>";


  try {

    const result =
      await getBackend(
        "reportDates"
      );


    reportDates =
      Array.isArray(
        result.data.dates
      )
        ? result.data.dates
        : [];


    renderHistoryDates();


  } catch (error) {

    console.error(
      error
    );


    content.innerHTML =
      '<div class="history-empty">日期載入失敗</div>';

  }

}


/* =================================================
   日期先顯示
================================================= */

function renderHistoryDates(){

  const content =
    document.getElementById(
      "historyContent"
    );


  content.innerHTML =
    "";


  if (
    reportDates.length ===
    0
  ) {

    content.innerHTML =
      '<div class="history-empty">' +
      t(
        "noHistory"
      ) +
      "</div>";

    return;

  }


  reportDates.forEach(
    function(date){

      const day =
        document.createElement(
          "div"
        );


      day.className =
        "history-day";


      day.dataset.date =
        date;


      const head =
        document.createElement(
          "div"
        );


      head.className =
        "history-day-head";


      const toggle =
        document.createElement(
          "button"
        );


      toggle.className =
        "history-toggle";


      const arrow =
        document.createElement(
          "span"
        );


      arrow.className =
        "history-arrow";


      arrow.textContent =
        "▶";


      const dateText =
        document.createElement(
          "span"
        );


      dateText.className =
        "history-date";


      dateText.textContent =
        formatDateLabel(
          date
        );


      toggle.appendChild(
        arrow
      );


      toggle.appendChild(
        dateText
      );


      const photoButton =
        document.createElement(
          "button"
        );


      photoButton.className =
        "history-photo-all";


      photoButton.textContent =
        "📷 " +
        t(
          "viewTodayPhotos"
        );


      const body =
        document.createElement(
          "div"
        );


      body.className =
        "history-day-body";


      toggle.addEventListener(
        "click",
        async function(){

          /*
           * 已經展開就收起。
           */

          if (
            day.classList.contains(
              "open"
            )
          ) {

            day.classList.remove(
              "open"
            );

            return;

          }


          day.classList.add(
            "open"
          );


          /*
           * 第一次點才載入這天。
           */

          if (
            !reportCache[
              date
            ]
          ) {

            await loadReportsForDate(
              date,
              body
            );

          } else {

            renderReportsIntoBody(
              reportCache[
                date
              ],
              body
            );

          }

        }
      );


      photoButton.addEventListener(
        "click",
        async function(){

          if (
            !reportCache[
              date
            ]
          ) {

            day.classList.add(
              "open"
            );


            await loadReportsForDate(
              date,
              body
            );

          }


          showAllDayPhotos(
            date,
            reportCache[
              date
            ] ||
            []
          );

        }
      );


      head.appendChild(
        toggle
      );


      head.appendChild(
        photoButton
      );


      day.appendChild(
        head
      );


      day.appendChild(
        body
      );


      content.appendChild(
        day
      );

    }
  );

}


/* =================================================
   點日期才載入
================================================= */

async function loadReportsForDate(
  date,
  body
){

  body.innerHTML =
    '<div class="day-loading">' +
    t(
      "dayLoading"
    ) +
    "</div>";


  try {

    const result =
      await getBackend(
        "reports",
        {
          date:
            date
        }
      );


    const reports =
      Array.isArray(
        result.data.reports
      )
        ? result.data.reports
        : [];


    /*
     * 前端快取。
     *
     * 同一天再次開啟
     * 不會再叫 Apps Script。
     */

    reportCache[
      date
    ] =
      reports;


    renderReportsIntoBody(
      reports,
      body
    );


  } catch (error) {

    console.error(
      error
    );


    body.innerHTML =
      '<div class="history-empty">回報載入失敗</div>';

  }

}


function renderReportsIntoBody(
  reports,
  body
){

  body.innerHTML =
    "";


  reports.forEach(
    function(report){

      body.appendChild(
        createReportCard(
          report
        )
      );

    }
  );

}


/* =================================================
   回報卡片
================================================= */

function createReportCard(
  report
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "report-card";


  const main =
    document.createElement(
      "div"
    );


  main.className =
    "report-main";


  const truck =
    document.createElement(
      "div"
    );


  truck.className =
    "report-truck";


  truck.textContent =
    report.trucks ||
    "未指定大車";


  const staff =
    document.createElement(
      "div"
    );


  staff.className =
    "report-staff";


  staff.textContent =
    report.staff ||
    "";


  const status =
    document.createElement(
      "div"
    );


  const ok =
    report.qtyStatus ===
    "正確";


  status.className =
    "report-status " +
    (
      ok
        ? "ok"
        : "bad"
    );


  status.textContent =
    ok
      ? "✓ 正確"
      : "✗ " +
        (
          report.qtyStatus ||
          "有多有少"
        );


  main.appendChild(
    truck
  );


  if (
    report.staff
  ) {

    main.appendChild(
      staff
    );

  }


  main.appendChild(
    status
  );


  card.appendChild(
    main
  );


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "report-time";


  time.textContent =
    report.time ||
    "";


  card.appendChild(
    time
  );


  /* ---------------------------------------------
     四格小縮圖
  --------------------------------------------- */

  if (
    Array.isArray(
      report.photos
    ) &&
    report.photos.length >
    0
  ) {

    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "report-photos";


    report.photos.forEach(
      function(photo){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "report-photo";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.thumbnailUrl ||
          photo.url;


        img.loading =
          "lazy";


        img.decoding =
          "async";


        img.addEventListener(
          "click",
          function(){

            openLightbox(
              photo.url ||
              photo.thumbnailUrl
            );

          }
        );


        item.appendChild(
          img
        );


        grid.appendChild(
          item
        );

      }
    );


    card.appendChild(
      grid
    );

  }


  if (
    report.note
  ) {

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "report-note";


    note.textContent =
      report.note;


    card.appendChild(
      note
    );

  }


  /*
   * 回報人與刪除同一排
   */

  const footer =
    document.createElement(
      "div"
    );


  footer.className =
    "report-footer";


  const employee =
    document.createElement(
      "div"
    );


  employee.className =
    "report-employee";


  employee.textContent =
    report.employee
      ? "回報人：" +
        report.employee
      : "";


  footer.appendChild(
    employee
  );


  if (
    String(
      report.employee ||
      ""
    ).trim() ===
    String(
      userName ||
      ""
    ).trim()
  ) {

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "report-delete";


    deleteButton.textContent =
      t(
        "delete"
      );


    deleteButton.addEventListener(
      "click",
      async function(){

        if (
          !confirm(
            t(
              "deleteConfirm"
            )
          )
        ) {

          return;

        }


        deleteButton.disabled =
          true;


        deleteButton.textContent =
          t(
            "deleting"
          );


        try {

          await postBackend({

            action:
              "deleteReport",

            row:
              report.row,

            user:
              userName

          });


          /*
           * 刪除後清除日期快取，
           * 重新載入日期。
           */

          reportDates =
            [];


          reportCache =
            {};


          await loadReportDates();


        } catch (error) {

          deleteButton.disabled =
            false;


          deleteButton.textContent =
            t(
              "delete"
            );


          alert(
            error.message ||
            "刪除失敗"
          );

        }

      }
    );


    footer.appendChild(
      deleteButton
    );

  }


  card.appendChild(
    footer
  );


  return card;

}


/* =================================================
   日期格式
================================================= */

function formatDateLabel(
  date
){

  const parts =
    String(
      date
    ).split(
      "-"
    );


  if (
    parts.length !==
    3
  ) {

    return date;

  }


  return (
    parts[0] +
    "/" +
    parts[1] +
    "/" +
    parts[2]
  );

}

/* =================================================
   放大
================================================= */

function openLightbox(
  url
){

  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    url;


  document
    .getElementById(
      "lightbox"
    )
    .classList.add(
      "open"
    );

}


function closeLightbox(){

  document
    .getElementById(
      "lightbox"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    "";

}

  .getElementById(
    "lightboxClose"
  )
  .addEventListener(
    "click",
    closeLightbox
  );


document
  .getElementById(
    "lightbox"
  )
  .addEventListener(
    "click",
    function(event){

      if (
        event.target ===
        this
      ) {

        closeLightbox();

      }

    }
  );


/* =================================================
   啟動

   大車不等 LINE
================================================= */

async function init(){

  if (
    !currentLanguage
  ) {

    currentLanguage =
      "zh";


    applyLanguage();


    document
      .getElementById(
        "languageScreen"
      )
      .classList.add(
        "show"
      );


  } else {

    applyLanguage();

  }


  /*
   * 最重要：
   *
   * 大車立即開始抓，
   * 不等待 LINE Profile。
   */

  const truckPromise =
    loadTrucks();


  const linePromise =
    initLIFF();


  /*
   * 先讓大車完成。
   */

  await truckPromise;


  /*
   * LINE 同時已經在跑。
   */

  const loginOK =
    await linePromise;


  if (
    loginOK
  ) {

    /*
     * 大車已經出來之後，
     * 才抓人員＋自動勾選。
     */

    await loadStaff();

  }

}


init();
