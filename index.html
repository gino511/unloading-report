<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>下貨點收回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root{
    --ink:#1c1f1a;
    --paper:#f6f4ee;
    --line:#d8d3c4;
    --accent:#2f6f4f;
    --accent-dim:#e4ede7;
    --warn:#b5452e;
    --warn-dim:#f4e2dd;
    --muted:#6b6a5f;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "PingFang TC",
      "Noto Sans TC",
      sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }

  button,
  input,
  textarea{
    font-family:inherit;
  }

  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:20px 18px 110px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }

  .brand h1{
    font-size:19px;
    margin:0;
    letter-spacing:.02em;
  }

  .brand .who{
    font-size:12px;
    color:var(--muted);
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  fieldset{
    border:none;
    padding:0;
    margin:0 0 22px;
  }

  legend{
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--muted);
    margin-bottom:8px;
  }

  .field{
    margin-bottom:16px;
  }

  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.08em;
    margin-bottom:6px;
  }

  /* =========================
     大車複選下拉
     ========================= */

  .multi-select{
    position:relative;
  }

  .multi-select-button{
    width:100%;
    min-height:48px;
    padding:12px 42px 12px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    font-size:16px;
    text-align:left;
    position:relative;
  }

  .multi-select-button::after{
    content:"⌄";
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-55%);
    font-size:20px;
    color:var(--muted);
  }

  .multi-select-button.open{
    border-color:var(--accent);
  }

  .multi-select-panel{
    display:none;
    margin-top:6px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
  }

  .multi-select-panel.open{
    display:block;
  }

  .truck-list{
    max-height:300px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .truck-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 12px;
    border-bottom:1px solid #eeeae0;
    font-size:15px;
  }

  .truck-option:last-child{
    border-bottom:none;
  }

  .truck-option input{
    width:20px;
    height:20px;
    accent-color:var(--accent);
    flex:none;
  }

  .truck-option.completed{
    color:#aaa79b;
    background:#f7f6f2;
  }

  .truck-option.completed .truck-status{
    margin-left:auto;
    font-size:11px;
    color:#9a988c;
  }

  .truck-option-name{
    flex:1;
  }

  .truck-panel-footer{
    padding:9px 12px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--muted);
    background:#faf9f5;
  }

  .selected-summary{
    margin-top:7px;
    font-size:12px;
    color:var(--muted);
    min-height:16px;
  }

  /* =========================
     下貨人員
     ========================= */

  .staff-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .staff-item{
    position:relative;
  }

  .staff-item input{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }

  .staff-item label{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:10px 8px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    font-size:15px;
    font-weight:700;
    margin:0;
    letter-spacing:0;
  }

  .staff-item input:checked + label{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* =========================
     件數
     ========================= */

  .seg{
    display:flex;
    gap:8px;
  }

  .seg button{
    flex:1;
    padding:14px 0;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }

  .seg button[data-v="ok"].active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .seg button[data-v="bad"].active{
    background:var(--warn);
    border-color:var(--warn);
    color:#fff;
  }

  /* =========================
     照片
     ========================= */

  .photo-upload{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:18px;
    text-align:center;
    background:#fff;
    position:relative;
    color:#8a8879;
  }

  .photo-upload span.icon{
    font-size:30px;
    display:block;
    margin-bottom:6px;
  }

  .photo-upload input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }

  .photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
  }

  .thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#fff;
  }

  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .thumb .rm{
    position:absolute;
    top:3px;
    right:3px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
  }

  /* =========================
     備註
     ========================= */

  textarea{
    width:100%;
    padding:12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    background:#fff;
    color:var(--ink);
    resize:vertical;
    min-height:70px;
  }

  /* =========================
     提示
     ========================= */

  .hint{
    font-size:12px;
    color:#9a988c;
    margin-top:6px;
    line-height:1.5;
  }

  /* =========================
     送出
     ========================= */

  .submit-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    z-index:100;
  }

  .submit-bar .inner{
    max-width:480px;
    margin:0 auto;
  }

  button.submit{
    width:100%;
    padding:15px 0;
    border:none;
    border-radius:12px;
    background:var(--ink);
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:.02em;
  }

  button.submit:disabled{
    background:#a3a091;
  }

  .status{
    font-size:13px;
    text-align:center;
    margin-top:8px;
    color:var(--muted);
    min-height:16px;
  }

  .status.err{
    color:var(--warn);
  }

  .status.ok{
    color:var(--accent);
  }

  .loading{
    text-align:center;
    padding:15px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <h1>下貨點收回報</h1>
    <span class="who" id="whoami">載入中…</span>
  </div>


  <!-- =========================
       大車
       ========================= -->

  <fieldset>

    <legend>大車</legend>

    <div class="multi-select">

      <button
        type="button"
        class="multi-select-button"
        id="truckSelectButton"
      >
        請選擇大車…
      </button>

      <div
        class="multi-select-panel"
        id="truckPanel"
      >

        <div
          class="truck-list"
          id="truckList"
        >
          <div class="loading">
            載入大車清單…
          </div>
        </div>

        <div class="truck-panel-footer">
          已完成下貨的大車會自動移到最後
        </div>

      </div>

    </div>

    <div
      class="selected-summary"
      id="truckSummary"
    ></div>

  </fieldset>


  <!-- =========================
       下貨人員
       ========================= -->

  <fieldset>

    <legend>下貨人員</legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >
      <div class="loading">
        載入下貨人員…
      </div>
    </div>

  </fieldset>


  <!-- =========================
       件數
       ========================= -->

  <fieldset>

    <legend>件數是否正確</legend>

    <div class="seg" id="qtySeg">

      <button
        type="button"
        data-v="ok"
        class="active"
      >
        ✓ 件數正確
      </button>

      <button
        type="button"
        data-v="bad"
      >
        ✗ 有多有少
      </button>

    </div>

  </fieldset>


  <!-- =========================
       照片
       ========================= -->

  <fieldset>

    <legend>照片</legend>

    <div class="photo-upload">

      <span class="icon">📷</span>

      點此上傳照片（可一次選多張）

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        multiple
      >

    </div>

    <div
      class="photo-grid"
      id="photoGrid"
    ></div>

    <div class="hint">
      至少上傳1張，可拍照或從相簿選取多張
    </div>

  </fieldset>


  <!-- =========================
       備註
       ========================= -->

  <fieldset>

    <legend>備註（選填）</legend>

    <div class="field">

      <textarea
        id="note"
        placeholder="有多有少的原因、異常說明等"
      ></textarea>

    </div>

  </fieldset>

</div>


<!-- =========================
     送出
     ========================= -->

<div class="submit-bar">

  <div class="inner">

    <button
      class="submit"
      id="submitBtn"
    >
      送出回報
    </button>

    <div
      class="status"
      id="statusMsg"
    ></div>

  </div>

</div>


<script>

/*************************************************
 * 設定
 *************************************************/

/*
 * ⚠️ 這裡之後填你的 LIFF ID
 *
 * 目前先保持：
 *
 * YOUR_LIFF_ID
 *
 * 等你建立 LINE LIFF 後再換。
 */

const LIFF_ID = "YOUR_LIFF_ID";


/*
 * 你的 Google Apps Script 後端
 */

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycby8oksNTRuZEty3SpTCFYi2-QLdmLAVnQql9GxdKazFrg9DBLBTmTjfjFAifrj0gkBH/exec";


/*************************************************
 * 全域資料
 *************************************************/

let userName = "未知使用者";

let trucks = [];

let staff = [];

let completedTrucks = [];

let photos = [];


/*************************************************
 * 工作日
 *************************************************/

let workDate = "";


/*************************************************
 * DOM
 *************************************************/

const truckSelectButton =
  document.getElementById(
    "truckSelectButton"
  );

const truckPanel =
  document.getElementById(
    "truckPanel"
  );

const truckList =
  document.getElementById(
    "truckList"
  );

const truckSummary =
  document.getElementById(
    "truckSummary"
  );

const staffGrid =
  document.getElementById(
    "staffGrid"
  );

const photoInput =
  document.getElementById(
    "photoInput"
  );

const photoGrid =
  document.getElementById(
    "photoGrid"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const statusMsg =
  document.getElementById(
    "statusMsg"
  );


/*************************************************
 * 狀態訊息
 *************************************************/

function setStatus(
  message,
  type
){

  statusMsg.textContent =
    message || "";

  statusMsg.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );

}


/*************************************************
 * 大車下拉開關
 *************************************************/

truckSelectButton.addEventListener(
  "click",
  () => {

    const open =
      truckPanel.classList.contains(
        "open"
      );

    if (open) {

      truckPanel.classList.remove(
        "open"
      );

      truckSelectButton.classList.remove(
        "open"
      );

    } else {

      truckPanel.classList.add(
        "open"
      );

      truckSelectButton.classList.add(
        "open"
      );

    }

  }
);


/*************************************************
 * 點其他地方關閉大車選單
 *************************************************/

document.addEventListener(
  "click",
  (event) => {

    if (
      !event.target.closest(
        ".multi-select"
      )
    ){

      truckPanel.classList.remove(
        "open"
      );

      truckSelectButton.classList.remove(
        "open"
      );

    }

  }
);


/*************************************************
 * 建立大車清單
 *************************************************/

function renderTrucks(){

  /*
   * 未完成的在前面
   * 已完成的在最後
   */

  const sorted =
    [...trucks].sort(
      (a,b) => {

        const aDone =
          completedTrucks.includes(
            a.name
          );

        const bDone =
          completedTrucks.includes(
            b.name
          );

        if (
          aDone &&
          !bDone
        ){
          return 1;
        }

        if (
          !aDone &&
          bDone
        ){
          return -1;
        }

        return 0;

      }
    );


  truckList.innerHTML = "";


  if (sorted.length === 0){

    truckList.innerHTML =
      '<div class="loading">目前沒有可用的大車</div>';

    return;

  }


  sorted.forEach(
    truck => {

      const label =
        document.createElement(
          "label"
        );

      label.className =
        "truck-option";


      if (
        completedTrucks.includes(
          truck.name
        )
      ){

        label.classList.add(
          "completed"
        );

      }


      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =
        "checkbox";

      checkbox.value =
        truck.name;

      checkbox.dataset.id =
        truck.id;


      checkbox.addEventListener(
        "change",
        updateTruckSummary
      );


      const name =
        document.createElement(
          "span"
        );

      name.className =
        "truck-option-name";

      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );

      label.appendChild(
        name
      );


      if (
        completedTrucks.includes(
          truck.name
        )
      ){

        const status =
          document.createElement(
            "span"
          );

        status.className =
          "truck-status";

        status.textContent =
          "已完成";

        label.appendChild(
          status
        );

      }


      truckList.appendChild(
        label
      );

    }
  );


  updateTruckSummary();

}


/*************************************************
 * 大車選擇摘要
 *************************************************/

function getSelectedTrucks(){

  return [
    ...document.querySelectorAll(
      "#truckList input[type='checkbox']:checked"
    )
  ].map(
    checkbox =>
      checkbox.value
  );

}


function updateTruckSummary(){

  const selected =
    getSelectedTrucks();


  if (
    selected.length === 0
  ){

    truckSelectButton.textContent =
      "請選擇大車…";

    truckSummary.textContent =
      "";

    return;

  }


  truckSelectButton.textContent =
    `已選 ${selected.length} 台大車`;


  truckSummary.textContent =
    selected.join("、");

}


/*************************************************
 * 建立下貨人員
 *************************************************/

function renderStaff(){

  staffGrid.innerHTML = "";


  if (
    staff.length === 0
  ){

    staffGrid.innerHTML =
      '<div class="loading">目前沒有可用的下貨人員</div>';

    return;

  }


  staff.forEach(
    (person, index) => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "staff-item";


      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =
        "checkbox";

      checkbox.id =
        "staff_" + index;

      checkbox.value =
        person.name;


      const label =
        document.createElement(
          "label"
        );

      label.htmlFor =
        checkbox.id;

      label.textContent =
        person.name;


      wrapper.appendChild(
        checkbox
      );

      wrapper.appendChild(
        label
      );


      staffGrid.appendChild(
        wrapper
      );

    }
  );

}


/*************************************************
 * 取得選取的下貨人員
 *************************************************/

function getSelectedStaff(){

  return [
    ...document.querySelectorAll(
      "#staffGrid input[type='checkbox']:checked"
    )
  ].map(
    checkbox =>
      checkbox.value
  );

}


/*************************************************
 * 件數
 *************************************************/

document
  .getElementById("qtySeg")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.tagName !==
        "BUTTON"
      ){
        return;
      }


      [
        ...event.currentTarget.children
      ].forEach(
        button =>
          button.classList.remove(
            "active"
          )
      );


      event.target.classList.add(
        "active"
      );

    }
  );


/*************************************************
 * 圖片壓縮
 *************************************************/

function compressImage(
  file,
  maxW = 1200,
  quality = 0.72
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const scale =
                Math.min(
                  1,
                  maxW /
                    img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/*************************************************
 * 選照片
 *************************************************/

photoInput.addEventListener(
  "change",
  async event => {

    const files =
      [
        ...event.target.files
      ];


    if (
      files.length === 0
    ){
      return;
    }


    setStatus(
      "照片處理中…",
      ""
    );


    try {

      for (
        const file of files
      ){

        if (
          !file.type.startsWith(
            "image/"
          )
        ){
          continue;
        }


        const dataUrl =
          await compressImage(
            file
          );


        photos.push(
          dataUrl
        );

      }


      renderPhotoGrid();

      setStatus(
        "",
        ""
      );


    } catch(error){

      console.error(
        error
      );

      setStatus(
        "照片處理失敗",
        "err"
      );

    }


    /*
     * 清空 input
     * 允許下一次再次選同一批照片
     */

    event.target.value = "";

  }
);


/*************************************************
 * 顯示照片
 *************************************************/

function renderPhotoGrid(){

  photoGrid.innerHTML = "";


  photos.forEach(
    (photo, index) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "thumb";


      const img =
        document.createElement(
          "img"
        );

      img.src =
        photo;


      const removeButton =
        document.createElement(
          "button"
        );

      removeButton.type =
        "button";

      removeButton.className =
        "rm";

      removeButton.textContent =
        "✕";


      removeButton.addEventListener(
        "click",
        () => {

          photos.splice(
            index,
            1
          );

          renderPhotoGrid();

        }
      );


      div.appendChild(
        img
      );

      div.appendChild(
        removeButton
      );


      photoGrid.appendChild(
        div
      );

    }
  );

}


/*************************************************
 * 從 Apps Script 取得資料
 *************************************************/

async function loadSystemData(){

  try {

    setStatus(
      "載入資料中…",
      ""
    );


    const response =
      await fetch(
        BACKEND_URL +
        "?action=getData&t=" +
        Date.now()
      );


    const result =
      await response.json();


    if (
      !result.success
    ){

      throw new Error(
        result.message ||
        "取得資料失敗"
      );

    }


    const data =
      result.data;


    trucks =
      Array.isArray(
        data.trucks
      )
        ? data.trucks
        : [];


    staff =
      Array.isArray(
        data.staff
      )
        ? data.staff
        : [];


    completedTrucks =
      Array.isArray(
        data.completedTrucks
      )
        ? data.completedTrucks
        : [];


    workDate =
      data.workDate ||
      "";


    renderTrucks();

    renderStaff();


    setStatus(
      "",
      ""
    );


  } catch(error){

    console.error(
      error
    );


    truckList.innerHTML =
      '<div class="loading">大車清單載入失敗</div>';


    staffGrid.innerHTML =
      '<div class="loading">下貨人員載入失敗</div>';


    setStatus(
      "無法取得系統資料，請重新整理",
      "err"
    );

  }

}


/*************************************************
 * 取得 LINE 使用者
 *************************************************/

async function initLIFF(){

  try {

    /*
     * 尚未設定 LIFF ID
     *
     * 先允許網頁在一般瀏覽器測試。
     */

    if (
      !LIFF_ID ||
      LIFF_ID ===
      "YOUR_LIFF_ID"
    ){

      document.getElementById(
        "whoami"
      ).textContent =
        "測試模式";


      return;

    }


    await liff.init({
      liffId:
        LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ){

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    userName =
      profile.displayName ||
      "未知使用者";


    document.getElementById(
      "whoami"
    ).textContent =
      userName;


  } catch(error){

    console.error(
      error
    );


    document.getElementById(
      "whoami"
    ).textContent =
      "LINE 使用者";


  }

}


/*************************************************
 * 送出回報
 *************************************************/

submitBtn.addEventListener(
  "click",
  async () => {

    const selectedTrucks =
      getSelectedTrucks();


    const selectedStaff =
      getSelectedStaff();


    const qtyButton =
      document.querySelector(
        "#qtySeg button.active"
      );


    const qtyStatus =
      qtyButton
        ? qtyButton.dataset.v
        : "ok";


    const note =
      document
        .getElementById(
          "note"
        )
        .value
        .trim();


    /***************
     * 驗證
     ***************/

    if (
      selectedTrucks.length === 0
    ){

      setStatus(
        "請至少選擇一台大車",
        "err"
      );

      truckPanel.classList.add(
        "open"
      );

      return;

    }


    if (
      selectedStaff.length === 0
    ){

      setStatus(
        "請至少選擇一位下貨人員",
        "err"
      );

      return;

    }


    if (
      photos.length === 0
    ){

      setStatus(
        "請至少上傳1張照片",
        "err"
      );

      return;

    }


    /***************
     * 鎖定按鈕
     ***************/

    submitBtn.disabled =
      true;


    setStatus(
      "照片上傳中，請稍候…",
      ""
    );


    /***************
     * Payload
     ***************/

    const payload = {

      user:
        userName,

      trucks:
        selectedTrucks,

      staff:
        selectedStaff,

      qtyStatus:
        qtyStatus,

      note:
        note,

      photos:
        photos

    };


    try {

      /*
       * 使用 text/plain
       * 避免 Apps Script CORS / preflight 問題
       */

      const response =
        await fetch(
          BACKEND_URL,
          {
            method:"POST",

            mode:"no-cors",

            headers:{
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      /*
       * no-cors 下無法讀取 response
       *
       * 但 Apps Script 已收到並處理。
       */

      setStatus(
        "✓ 已送出回報",
        "ok"
      );


      /*
       * 重新載入今天已完成的大車
       *
       * 讓下一次開啟時，
       * 已經回報的大車會排到最後。
       */

      setTimeout(
        async () => {

          await loadSystemData();

        },
        800
      );


      /*
       * 清空目前表單
       */

      photos = [];

      renderPhotoGrid();


      document
        .querySelectorAll(
          "#staffGrid input[type='checkbox']"
        )
        .forEach(
          checkbox => {
            checkbox.checked =
              false;
          }
        );


      document
        .getElementById(
          "note"
        )
        .value =
          "";


      document
        .querySelectorAll(
          "#truckList input[type='checkbox']"
        )
        .forEach(
          checkbox => {
            checkbox.checked =
              false;
          }
        );


      updateTruckSummary();


      /*
       * LINE 內開啟時，
       * 延遲後關閉視窗。
       *
       * 測試模式不關閉。
       */

      setTimeout(
        () => {

          try {

            if (
              window.liff &&
              liff.isInClient()
            ){

              liff.closeWindow();

            }

          } catch(error){

            console.log(
              error
            );

          }

        },
        1500
      );


    } catch(error){

      console.error(
        error
      );


      setStatus(
        "送出失敗，請檢查網路後重試",
        "err"
      );


      submitBtn.disabled =
        false;

    }

  }
);


/*************************************************
 * 初始化
 *************************************************/

async function init(){

  await initLIFF();

  await loadSystemData();

}


/*************************************************
 * 開始
 *************************************************/

init();

</script>
