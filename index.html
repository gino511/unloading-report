<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>竹北托運 下貨回報</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--ink:#1c1f1a;--paper:#f6f4ee;--line:#d8d3c4;--accent:#2f6f4f;--accent-dim:#e4ede7;--warn:#b5452e;--muted:#6b6a5f;--white:#fff;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;min-height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;}
body.uploading{overflow:hidden;}
button{font-family:inherit;}
.wrap{max-width:480px;margin:0 auto;padding:18px 18px 110px;}

.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
.brand-left{min-width:0;}
.brand h1{font-size:19px;margin:0;letter-spacing:.02em;}
.brand .who{display:block;margin-top:5px;font-size:12px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.top-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 9px;font-size:12px;white-space:nowrap;}
.top-btn:active{transform:scale(.97);}

.language-screen{position:fixed;inset:0;z-index:1000;background:var(--paper);display:none;align-items:center;justify-content:center;padding:24px;}
.language-screen.show{display:flex;}
.language-box{width:100%;max-width:380px;text-align:center;}
.language-box h2{margin:0 0 8px;font-size:23px;}
.language-box p{margin:0 0 24px;color:var(--muted);font-size:13px;}
.language-options{display:grid;gap:10px;}
.language-option{width:100%;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px;font-weight:700;}
.language-option:active{background:var(--accent-dim);}

fieldset{border:none;padding:0;margin:0 0 22px;}
legend{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;}

/* 大車 */
.truck-select-wrap{position:relative;}
.truck-select-button{width:100%;padding:14px 40px 14px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-align:left;font-size:16px;position:relative;}
.truck-select-button:active{background:#faf9f5;}
.truck-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:#8a8879;transition:transform .2s ease;pointer-events:none;}
.truck-arrow svg{width:14px;height:14px;}
.truck-select-wrap.open .truck-arrow{transform:translateY(-50%) rotate(180deg);color:var(--accent);}

.truck-dropdown{display:none;position:absolute;z-index:50;left:0;right:0;margin-top:6px;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.12);overflow:hidden;}
.truck-dropdown.open{display:block;}
.truck-list{max-height:320px;overflow-y:auto;}
.truck-option{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #eee;font-size:15px;}
.truck-option:last-child{border-bottom:none;}
.truck-option input{width:20px;height:20px;accent-color:var(--accent);}
.truck-option.used{background:#f5f4ef;}
.truck-option.used .truck-name{color:#888679;}
.used-staff{margin-left:auto;font-size:11px;padding:3px 7px;border-radius:20px;background:#e9e7df;color:#6f6d62;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
.truck-dropdown-footer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#faf9f5;}
.truck-dropdown-footer button{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;}
.truck-dropdown-footer button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}

/* 人員 */
.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.staff-item{display:flex;align-items:center;gap:8px;padding:13px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px;}
.staff-item input{width:20px;height:20px;accent-color:var(--accent);}
.staff-item.selected{border-color:var(--accent);background:var(--accent-dim);}
.line-match-hint{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--accent-dim);color:var(--accent);font-size:12px;line-height:1.5;}

/* 件數 */
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:14px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:700;color:var(--ink);}
.seg button[data-v="ok"].active{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg button[data-v="bad"].active{background:var(--warn);border-color:var(--warn);color:#fff;}

textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit;resize:vertical;min-height:80px;}
textarea:focus{outline:none;border-color:var(--accent);}

.photo-upload{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:#fff;position:relative;color:#8a8879;}
.photo-upload span.icon{font-size:30px;display:block;margin-bottom:6px;}
.photo-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eee;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:none;}
.hint{font-size:12px;color:#9a988c;margin-top:6px;}

/* 上傳進度 - 往上移，不再置中 */
.upload-progress-screen{position:fixed;inset:0;z-index:9000;display:none;align-items:flex-start;justify-content:center;padding:22px;padding-top:14vh;background:rgba(28,31,26,.52);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.upload-progress-screen.open{display:flex;}
.upload-progress-box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:22px 20px 20px;box-shadow:0 18px 50px rgba(0,0,0,.22);}
.upload-progress-stage{display:flex;justify-content:center;gap:6px;margin-bottom:12px;}
.upload-progress-stage span{font-size:10px;padding:4px 9px;border-radius:999px;background:#f0eee6;color:#a3a091;font-weight:700;letter-spacing:.03em;}
.upload-progress-stage span.active{background:var(--accent);color:#fff;}
.upload-progress-stage span.done{background:var(--accent-dim);color:var(--accent);}
.upload-progress-title{font-size:17px;font-weight:800;text-align:center;margin-bottom:6px;}
.upload-progress-count{font-size:13px;color:var(--muted);text-align:center;min-height:20px;}
.upload-progress-track{width:100%;height:10px;margin-top:17px;border-radius:999px;overflow:hidden;background:#e8e5dc;}
.upload-progress-fill{height:100%;width:0%;border-radius:999px;background:var(--accent);transition:width .25s ease;}
.upload-progress-text{margin-top:11px;text-align:center;font-size:12px;color:var(--muted);min-height:18px;}

/* 回報紀錄 */
.history-screen{display:none;position:fixed;inset:0;z-index:200;background:var(--paper);overflow-y:auto;}
.history-screen.open{display:block;}
.history-wrap{max-width:480px;margin:0 auto;padding:18px 18px 40px;}
.history-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink);}
.history-header h2{margin:0;font-size:19px;}
.history-close{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:13px;}
.history-loading{padding:25px 0;text-align:center;color:var(--muted);}
.history-empty{padding:30px 0;text-align:center;color:var(--muted);font-size:14px;}

.history-day{border-bottom:1px solid var(--line);margin-bottom:8px;}
.history-day-head{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;padding:14px 0;color:var(--ink);text-align:left;}
.history-arrow{width:22px;font-size:16px;transition:transform .2s ease;}
.history-day.open .history-arrow{transform:rotate(90deg);}
.history-date{font-size:17px;font-weight:800;}
.history-photo-all{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;white-space:nowrap;}
.history-day-body{display:none;padding:0 0 14px;}
.history-day.open .history-day-body{display:block;}

.report-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:9px;}
.report-main{display:flex;align-items:center;gap:8px;}
.report-truck{font-size:20px;font-weight:900;line-height:1.15;min-width:0;}
.report-staff{font-size:13px;color:#555;white-space:nowrap;}
.report-status{font-size:12px;font-weight:800;white-space:nowrap;}
.report-status.ok{color:var(--accent);}
.report-status.bad{color:var(--warn);}
.report-employee{margin-left:auto;font-size:11px;color:#8a8879;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;}
.report-time{margin-top:6px;font-size:11px;color:#9a988c;}
.report-note{margin-top:7px;padding:8px;border-radius:8px;background:#f7f5ef;font-size:12px;line-height:1.5;}

/* 回報照片縮圖 - 完整顯示不裁切、不撐滿 */
.report-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
.report-photo{position:relative;width:100%;aspect-ratio:1;border-radius:7px;overflow:hidden;background:#f2f0e8;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.report-photo img{width:100%;height:100%;object-fit:contain;display:block;}
.report-no-photo{margin-top:8px;color:#aaa;font-size:11px;}

/* 大車照片 */
.all-photo-screen{display:none;position:fixed;inset:0;z-index:400;background:rgba(20,20,18,.97);overflow-y:auto;}
.all-photo-screen.open{display:block;}
.all-photo-wrap{max-width:600px;margin:0 auto;padding:16px 14px 40px;}
.all-photo-head{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:15px;}
.all-photo-head h3{margin:0;font-size:18px;}
.all-photo-close{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:7px 10px;}
.all-photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.all-photo-item{background:#111;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.all-photo-item img{display:block;width:100%;height:auto;}

.lightbox{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:15px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:90vh;object-fit:contain;}
.lightbox-close{position:absolute;top:15px;right:15px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:20px;}

.submit-bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
.submit-bar .inner{max-width:480px;margin:0 auto;}
button.submit{width:100%;padding:15px 0;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;}
button.submit:disabled{background:#a3a091;}
.status{font-size:13px;text-align:center;margin-top:8px;color:var(--muted);min-height:16px;}
.status.err{color:var(--warn);}
.status.ok{color:var(--accent);}
.loading{padding:18px;text-align:center;color:var(--muted);font-size:14px;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div class="language-screen" id="languageScreen">
  <div class="language-box">
    <h2>選擇語言</h2>
    <p>Choose your language</p>
    <div class="language-options">
      <button type="button" class="language-option" data-lang="zh">中文</button>
      <button type="button" class="language-option" data-lang="vi">Tiếng Việt</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="brand">
    <div class="brand-left">
      <h1 data-i18n="title">竹北托運 下貨回報</h1>
      <span class="who" id="whoami">載入中…</span>
    </div>
    <div class="top-actions">
      <button type="button" class="top-btn" id="historyBtn">📋 回報紀錄</button>
      <button type="button" class="top-btn" id="languageBtn">中文</button>
    </div>
  </div>

  <fieldset>
    <legend data-i18n="truck">大車</legend>
    <div class="truck-select-wrap" id="truckSelectWrap">
      <button type="button" class="truck-select-button" id="truckSelectButton">
        大車載入中…
        <span class="truck-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </button>
      <div class="truck-dropdown" id="truckDropdown">
        <div class="truck-list" id="truckList">
          <div class="loading">大車資料載入中…</div>
        </div>
        <div class="truck-dropdown-footer">
          <button type="button" id="truckClearBtn" data-i18n="clear">清除</button>
          <button type="button" class="primary" id="truckDoneBtn" data-i18n="done">完成</button>
        </div>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="staff">下貨人員</legend>
    <div class="staff-grid" id="staffGrid">
      <div class="loading">下貨人員資料載入中…</div>
    </div>
    <div id="lineMatchHint" class="line-match-hint" style="display:none;"></div>
  </fieldset>

  <fieldset>
    <legend data-i18n="qty">件數是否正確</legend>
    <div class="seg" id="qtySeg">
      <button type="button" data-v="ok" class="active" data-i18n="qtyOk">✓ 件數正確</button>
      <button type="button" data-v="bad" data-i18n="qtyBad">✗ 有多有少</button>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="photo">照片</legend>
    <div class="photo-upload">
      <span class="icon">📷</span>
      <span data-i18n="uploadPhoto">點此上傳照片（可一次選多張）</span>
      <input type="file" accept="image/*" id="photoInput" multiple>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
    <div class="hint" data-i18n="photoHint">至少上傳1張，可拍照或從相簿選取多張</div>
  </fieldset>

  <fieldset>
    <legend data-i18n="note">備註（選填）</legend>
    <textarea id="note" data-i18n-placeholder="notePlaceholder" placeholder="有多有少的原因、異常說明等"></textarea>
  </fieldset>
</div>

<div class="submit-bar">
  <div class="inner">
    <button class="submit" id="submitBtn" data-i18n="submit">送出回報</button>
    <div class="status" id="statusMsg"></div>
  </div>
</div>

<div class="upload-progress-screen" id="uploadProgressScreen">
  <div class="upload-progress-box">
    <div class="upload-progress-stage" id="uploadProgressStage">
      <span data-stage="process">處理</span>
      <span data-stage="compress">壓縮</span>
      <span data-stage="upload">上傳</span>
    </div>
    <div class="upload-progress-title" id="uploadProgressTitle">處理照片</div>
    <div class="upload-progress-count" id="uploadProgressCount">0 / 0</div>
    <div class="upload-progress-track">
      <div class="upload-progress-fill" id="uploadProgressFill"></div>
    </div>
    <div class="upload-progress-text" id="uploadProgressText">準備中…</div>
  </div>
</div>

<div class="history-screen" id="historyScreen">
  <div class="history-wrap">
    <div class="history-header">
      <h2 data-i18n="historyTitle">回報紀錄</h2>
      <button type="button" class="history-close" id="historyClose" data-i18n="close">關閉</button>
    </div>
    <div id="historyContent">
      <div class="history-loading">回報紀錄載入中…</div>
    </div>
  </div>
</div>

<div class="all-photo-screen" id="allPhotoScreen">
  <div class="all-photo-wrap">
    <div class="all-photo-head">
      <h3 id="allPhotoTitle">當日照片</h3>
      <button type="button" class="all-photo-close" id="allPhotoClose">關閉</button>
    </div>
    <div class="all-photo-grid" id="allPhotoGrid"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose">×</button>
  <img id="lightboxImage" src="" alt="">
</div>

<script>
/* =================================================
   設定
================================================= */
const LIFF_ID = "2011084900-xvJIcgzA";
const BACKEND_URL = "https://script.google.com/macros/s/AKfycby8oksNTRuZEty3SpTCFYi2-QLdmLAVnQql9GxdKazFrg9DBLBTmTjfjFAifrj0gkBH/exec";

/* =================================================
   狀態
================================================= */
let userName = "未知使用者";
let photos = [];

async function getBackend(type){
  const response = await fetch(BACKEND_URL + "?type=" + encodeURIComponent(type) + "&t=" + Date.now(), { method:"GET", cache:"no-store" });
  if(!response.ok){ throw new Error("HTTP " + response.status); }

  if(!result.success){ throw new Error(result.error || "後端資料取得失敗"); }
  return result;
}

function formatTruckTime(value){
  if(value === null || value === undefined){ return ""; }
  const text = String(value).trim();
  if(!text){ return ""; }
  const simpleMatch = text.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(simpleMatch){ return String(simpleMatch[1]).padStart(2,"0") + ":" + simpleMatch[2]; }
  const date = new Date(text);
  if(!isNaN(date.getTime())){ return String(date.getHours()).padStart(2,"0") + ":" + String(date.getMinutes()).padStart(2,"0"); }
  return "";
}

function getTruckUsage(truckName){
  const data = truckLastUsed[truckName];
  if(!data){ return null; }
  return { time:formatTruckTime(data.time), staff:String(data.staff || "").trim() };
}

function sortedTrucks(){
  return truckData.map(function(truck,index){ return { truck:truck, originalIndex:index }; })
    .sort(function(a,b){
      const truckA = a.truck, truckB = b.truck;
      const fixedA = truckA.fixed === true, fixedB = truckB.fixed === true;
      if(fixedA !== fixedB){ return fixedA ? -1 : 1; }
      if(fixedA && fixedB){ return a.originalIndex - b.originalIndex; }
      const usageA = getTruckUsage(truckA.name), usageB = getTruckUsage(truckB.name);
      const usedA = Boolean(usageA && usageA.staff), usedB = Boolean(usageB && usageB.staff);
      if(usedA !== usedB){ return usedA ? 1 : -1; }
      return a.originalIndex - b.originalIndex;
    })
    .map(function(item){ return item.truck; });
}

function renderTrucks(){
  const list = document.getElementById("truckList");
  const button = document.getElementById("truckSelectButton");
  list.innerHTML = "";
  const trucks = sortedTrucks();
  if(trucks.length === 0){
    list.innerHTML = '<div class="loading">目前沒有啟用中的大車</div>';
    return;
  }
  trucks.forEach(function(truck){
    const usage = getTruckUsage(truck.name);
    const isUsed = Boolean(usage && usage.staff);
    const checked = selectedTrucks.has(truck.name);
    const label = document.createElement("label");
    label.className = "truck-option" + (isUsed ? " used" : "");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = truck.name;
    checkbox.checked = checked;
    checkbox.addEventListener("change", function(){
      if(checkbox.checked){ selectedTrucks.add(truck.name); }
      else{ selectedTrucks.delete(truck.name); }
      updateTruckButtonText();
    });
    const name = document.createElement("span");
    name.className = "truck-name";
    name.textContent = truck.name;
    label.appendChild(checkbox);
    label.appendChild(name);
    if(isUsed && usage.staff){
      const staffTag = document.createElement("span");
      staffTag.className = "used-staff";
      staffTag.textContent = usage.staff;
      label.appendChild(staffTag);
    }
    list.appendChild(label);
  });
  updateTruckButtonText();
}

function autoMatchLineStaff(){

  const currentUser = String(userName).trim().toLowerCase();

/* =================================================
   照片壓縮 - 分兩個可回報的階段：讀取(process) / 壓縮(compress)
================================================= */
function readFileAsDataURL(file){
  return new Promise(function(resolve,reject){
    const reader = new FileReader();
    reader.onload = function(event){ resolve(event.target.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressDataURL(rawDataUrl, maxW, quality){
  return new Promise(function(resolve,reject){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = rawDataUrl;
  });
}

/* =================================================
   選照片 - 顯示「處理」與「壓縮」兩個真實階段
================================================= */
document.getElementById("photoInput").addEventListener("change", async function(event){
  if(isSubmitting){ event.target.value = ""; return; }
  const files = [...event.target.files];
  if(files.length === 0){ return; }

  try{
    const imageFiles = files.filter(function(file){ return file.type.startsWith("image/"); });
    const total = imageFiles.length;
    if(total === 0){ return; }

    showUploadProgress();

    for(let i = 0; i < total; i++){
      /* 階段一：處理（讀取檔案） */
      setProgressStage("process");
      const processPercent = ((i / total) * 50);
      updateUploadProgress(t("processingPhoto"), processPercent, t("processingPhoto"), (i+1) + " / " + total);
      const rawDataUrl = await readFileAsDataURL(imageFiles[i]);

      /* 階段二：壓縮 */
      setProgressStage("compress");
      const compressPercent = 50 + ((i / total) * 50);
      updateUploadProgress(t("compressingPhoto"), compressPercent, t("compressingPhoto"), (i+1) + " / " + total);
      const compressed = await compressDataURL(rawDataUrl, 1200, 0.72);

      photos.push(compressed);

      const donePercent = 50 + (((i+1) / total) * 50);
      updateUploadProgress(t("compressingPhoto"), donePercent, t("compressingPhoto"), (i+1) + " / " + total);
    }

    renderPhotoGrid();
    hideUploadProgress();
    setStatus("", "");

  }catch(error){
    console.error(error);
    hideUploadProgress();
    setStatus(t("uploadFail"), "err");
  }

  event.target.value = "";
});

}

/* =================================================
   POST - 使用 XHR 取得真實上傳進度
================================================= */
function postBackendWithProgress(payload, onProgress){
  return new Promise(function(resolve,reject){
    const xhr = new XMLHttpRequest();
    xhr.open("POST", BACKEND_URL, true);
    xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");

    xhr.upload.onprogress = function(event){
      if(event.lengthComputable && onProgress){
        const percent = (event.loaded / event.total) * 100;
        onProgress(percent);
      }
    };

    xhr.onload = function(){
      let result;
      try{
        result = JSON.parse(xhr.responseText);
      }catch(error){
        reject(new Error("Apps Script 沒有回傳正確 JSON"));
        return;
      }
      if(!result.success){
        reject(new Error(result.error || "Apps Script 執行失敗"));
        return;
      }
      resolve(result);
    };

    xhr.onerror = function(){ reject(new Error("網路連線失敗")); };

    xhr.send(JSON.stringify(payload));
  });
}

async function postBackend(payload){
  return postBackendWithProgress(payload, null);
}

  document.getElementById("submitBtn").disabled = locked;

}

/* =================================================
   送出 - 三階段真實進度：處理(已完成) → 壓縮(已完成) → 上傳(即時進度)
================================================= */
document.getElementById("submitBtn").addEventListener("click", async function(){
  if(isSubmitting){ return; }

  const trucks = Array.from(selectedTrucks);
  const staff = getSelectedStaff();
  const qtyButton = document.querySelector("#qtySeg button.active");
  const qtyStatus = qtyButton ? qtyButton.dataset.v : "ok";
  const note = document.getElementById("note").value.trim();

  if(trucks.length === 0){ setStatus(t("needTruck"), "err"); return; }
  if(staff.length === 0){ setStatus(t("needStaff"), "err"); return; }
  if(photos.length === 0){ setStatus(t("needPhoto"), "err"); return; }

  const submitPhotos = photos.slice();
  setSubmittingState(true);
  showUploadProgress();

  /* 照片已經在選取時完成「處理」與「壓縮」，這裡直接進入上傳階段 */
  setProgressStage("upload");
  updateUploadProgress(t("preparing"), 0, t("preparing"), "");

  try{
    const payload = {
      user: userName,
      trucks: trucks,
      staff: staff,
      qtyStatus: qtyStatus === "ok" ? "正確" : "有多有少",
      note: note,
      photos: submitPhotos
    };

    const result = await postBackendWithProgress(payload, function(percent){
      updateUploadProgress(t("uploading"), percent, t("uploading"), Math.round(percent) + "%");
    });

    console.log(result);

    /* 上傳位元組送完後，Apps Script 還要寫入試算表，這段時間顯示「寫入回報」而不是瞬間跳100% */
    updateUploadProgress(t("writingReport"), 96, t("writingReport"), "");
    await new Promise(function(resolve){ setTimeout(resolve, 350); });

    updateUploadProgress(t("success"), 100, t("success"), "");
    setStatus(t("success"), "ok");

    trucks.forEach(function(truck){
      truckLastUsed[truck] = { time: new Date(), staff: staff.join("、") };
    });

    selectedTrucks.clear();
    photos = [];
    renderTrucks();
    renderPhotoGrid();
    document.getElementById("note").value = "";
    document.querySelectorAll("#staffGrid input[type=checkbox]").forEach(function(input){
      input.checked = false;
      const item = input.closest(".staff-item");
      if(item){ item.classList.remove("selected"); }
    });
    document.getElementById("lineMatchHint").style.display = "none";
    document.querySelectorAll("#qtySeg button").forEach(function(btn){ btn.classList.remove("active"); });
    document.querySelector('#qtySeg button[data-v="ok"]').classList.add("active");
    document.getElementById("truckDropdown").classList.remove("open");
    document.getElementById("truckSelectWrap").classList.remove("open");

    if(document.getElementById("historyScreen").classList.contains("open")){
      await loadReports();
    }

    await new Promise(function(resolve){ setTimeout(resolve, 700); });

    hideUploadProgress();
    setSubmittingState(false);

    setTimeout(function(){
      try{
        if(window.liff && liff.isInClient()){ liff.closeWindow(); }
      }catch(error){ console.log(error); }
    }, 500);

  }catch(error){
    console.error(error);
    hideUploadProgress();
    setSubmittingState(false);
    setStatus("❌ " + (error.message || error), "err");
  }
});

function groupReportsByDate(){
  const groups = {};
  reportData.forEach(function(report){
    const date = report.date || "未知日期";
    if(!groups[date]){ groups[date] = []; }
    groups[date].push(report);
  });

}

function formatDateLabel(date){
  if(!date){ return ""; }
  const parts = date.split("-");
  if(parts.length !== 3){ return date; }
  return parts[0] + "/" + parts[1] + "/" + parts[2];
}

function renderHistory(){
  const content = document.getElementById("historyContent");
  const groups = groupReportsByDate();
  const dates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });

  if(dates.length === 0){
    content.innerHTML = '<div class="history-empty">' + t("noHistory") + '</div>';

  }

  content.innerHTML = "";

  dates.forEach(function(date){

    allPhotoBtn.className = "history-photo-all";
    allPhotoBtn.textContent = "📷 " + t("viewTodayPhotos");

    day.appendChild(body);
    content.appendChild(day);

function createReportCard(report){
  const card = document.createElement("div");
  card.className = "report-card";

  const main = document.createElement("div");
  main.className = "report-main";

  const truck = document.createElement("div");
  truck.className = "report-truck";
  truck.textContent = report.trucks || "未指定大車";

  const staff = document.createElement("div");
  staff.className = "report-staff";
  staff.textContent = report.staff || "";

  const status = document.createElement("div");
  const isOK = report.qtyStatus === "正確";
  status.className = "report-status " + (isOK ? "ok" : "bad");
  status.textContent = isOK ? "✓ 正確" : "✗ " + (report.qtyStatus || "有多有少");

  const employee = document.createElement("div");
  employee.className = "report-employee";
  employee.textContent = report.employee || "";

  main.appendChild(truck);
  if(report.staff){ main.appendChild(staff); }
  main.appendChild(status);
  main.appendChild(employee);
  card.appendChild(main);

  const time = document.createElement("div");
  time.className = "report-time";
  time.textContent = report.time || "";
  card.appendChild(time);

  /* 照片：使用 Apps Script 回傳的 thumbnailUrl（小縮圖），完整顯示不裁切 */
  if(Array.isArray(report.photos) && report.photos.length > 0){
    const photoGrid = document.createElement("div");
    photoGrid.className = "report-photos";

    report.photos.forEach(function(photo){
      const photoItem = document.createElement("div");
      photoItem.className = "report-photo";

      const img = document.createElement("img");
      img.src = photo.thumbnailUrl || photo.url;
      img.loading = "lazy";
      img.alt = photo.name || "";

      img.addEventListener("click", function(){
        openLightbox(photo.url || photo.thumbnailUrl);
      });

      photoItem.appendChild(img);
      photoGrid.appendChild(photoItem);
    });

    card.appendChild(photoGrid);
  }else{
    const noPhoto = document.createElement("div");
    noPhoto.className = "report-no-photo";
    noPhoto.textContent = t("noPhotos");
    card.appendChild(noPhoto);
  }

  if(report.note){
    const note = document.createElement("div");
    note.className = "report-note";
    note.textContent = report.note;
    card.appendChild(note);
  }

  if(String(report.employee || "").trim() === String(userName || "").trim()){
    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.textContent = t("delete");
    deleteButton.style.marginTop = "9px";
    deleteButton.style.border = "1px solid var(--line)";
    deleteButton.style.background = "#fff";
    deleteButton.style.borderRadius = "8px";
    deleteButton.style.padding = "7px 10px";
    deleteButton.style.fontSize = "11px";
    deleteButton.addEventListener("click", function(){ deleteReportFromHistory(report, deleteButton); });
    card.appendChild(deleteButton);
  }

  return card;
}

async function deleteReportFromHistory(report, button){
  if(!confirm(t("deleteConfirm"))){ return; }
  button.disabled = true;
  button.textContent = t("deleting");
  try{
    await postBackend({ action:"deleteReport", row:report.row, user:userName });
    reportData = reportData.filter(function(item){ return item.row !== report.row; });
    renderHistory();
  }catch(error){
    console.error(error);
    button.disabled = false;
    button.textContent = t("delete");
    alert(error.message || "刪除失敗");
  }
}

/* =================================================
   當日全部照片 - 也用完整顯示不裁切
================================================= */
function showAllDayPhotos(date, reports){
  const screen = document.getElementById("allPhotoScreen");
  const title = document.getElementById("allPhotoTitle");
  const grid = document.getElementById("allPhotoGrid");

  title.textContent = formatDateLabel(date) + " · " + t("allPhotos");
  grid.innerHTML = "";

  let count = 0;

  reports.forEach(function(report){
    if(!Array.isArray(report.photos)){ return; }
    report.photos.forEach(function(photo){
      count++;
      const item = document.createElement("div");
      item.className = "all-photo-item";
      const img = document.createElement("img");
      img.src = photo.url || photo.thumbnailUrl;
      img.loading = "lazy";
      img.addEventListener("click", function(){ openLightbox(photo.url || photo.thumbnailUrl); });
      item.appendChild(img);
      grid.appendChild(item);
    });
  });

  if(count === 0){
    grid.innerHTML = '<div style="color:#aaa;padding:30px;text-align:center;grid-column:1/-1;">' + t("noDayPhotos") + '</div>';
  }

  screen.classList.add("open");
}

document.getElementById("allPhotoClose").addEventListener("click", function(){
  document.getElementById("allPhotoScreen").classList.remove("open");
});

/* =================================================
   圖片放大
================================================= */
function openLightbox(url){
  document.getElementById("lightboxImage").src = url;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxImage").src = "";
}
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", function(event){ if(event.target === this){ closeLightbox(); } });

/* =================================================
   啟動
================================================= */
async function init(){
  if(!currentLanguage){
    currentLanguage = "zh";
    applyLanguage();
    showLanguageScreen();
  }else{

  }

  const loginOK = await initLIFF();
  if(!loginOK){ return; }

}

init();
</script>
