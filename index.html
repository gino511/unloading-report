<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

button,
textarea,
input{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:20px 18px 110px;
}

/* =================================================
   頂部
================================================= */

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  font-size:19px;
  margin:0;
  letter-spacing:.02em;
}

.brand .who{
  display:block;
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
  max-width:170px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.brand-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.top-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
}

/* =================================================
   頁面導覽
================================================= */

.page-nav{
  display:flex;
  gap:8px;
  margin-bottom:22px;
}

.page-nav button{
  flex:1;
  padding:11px 8px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}

.page-nav button.active{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

/* =================================================
   回報頁
================================================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

fieldset{
  border:none;
  padding:0;
  margin:0 0 22px;
}

legend{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:8px;
}

/* =================================================
   大車
================================================= */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  width:100%;
  padding:13px 42px 13px 13px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  font-size:16px;
  position:relative;
}

.truck-select-button::after{
  content:"⌄";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-55%);
  font-size:20px;
  color:#777;
}

.truck-dropdown{
  display:none;
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  margin-top:6px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  overflow:hidden;
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.truck-option:last-child{
  border-bottom:none;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f5f4ef;
}

.truck-option.used .truck-name{
  color:#888679;
}

.used-staff{
  margin-left:auto;
  font-size:11px;
  padding:3px 7px;
  border-radius:20px;
  background:#e9e7df;
  color:#6f6d62;
  white-space:nowrap;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--line);
  background:#faf9f5;
}

.truck-dropdown-footer button{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:14px;
}

.truck-dropdown-footer button.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* =================================================
   下貨人員
================================================= */

.staff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.staff-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 10px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:var(--accent-dim);
  color:var(--accent);
  font-size:12px;
  line-height:1.5;
}

/* =================================================
   件數
================================================= */

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;
  padding:14px 0;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
  font-weight:700;
  color:var(--ink);
}

.seg button[data-v="ok"].active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  background:var(--warn);
  border-color:var(--warn);
  color:#fff;
}

/* =================================================
   備註
================================================= */

textarea{
  width:100%;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  font-size:16px;
  background:#fff;
  color:var(--ink);
  resize:vertical;
  min-height:80px;
}

textarea:focus{
  outline:none;
  border-color:var(--accent);
}

/* =================================================
   照片上傳
================================================= */

.photo-upload{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:#fff;
  position:relative;
  color:#8a8879;
}

.photo-upload span.icon{
  font-size:30px;
  display:block;
  margin-bottom:6px;
}

.photo-upload input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.thumb{
  position:relative;
  aspect-ratio:1;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#eee;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumb .rm{
  position:absolute;
  top:3px;
  right:3px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
}

.hint{
  font-size:12px;
  color:#9a988c;
  margin-top:6px;
}

/* =================================================
   回報紀錄
================================================= */

.record-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}

.record-title{
  font-size:15px;
  font-weight:700;
}

.refresh-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
}

.record-date{
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  margin-bottom:10px;
  overflow:hidden;
}

.record-date-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:13px 13px;
  background:#faf9f5;
}

.record-date-name{
  font-weight:700;
  font-size:15px;
}

.photo-day-btn{
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  padding:7px 9px;
  font-size:12px;
  white-space:nowrap;
}

.record-items{
  border-top:1px solid var(--line);
}

.record-item{
  padding:13px;
  border-bottom:1px solid #eee;
}

.record-item:last-child{
  border-bottom:none;
}

.record-item-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.record-employee{
  font-weight:700;
  font-size:15px;
}

.record-time{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.record-info{
  margin-top:7px;
  font-size:13px;
  line-height:1.7;
  color:#44443d;
}

.record-note{
  margin-top:6px;
  padding:7px 9px;
  background:#f5f3ed;
  border-radius:7px;
  color:#66645a;
  font-size:12px;
}

.record-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.record-actions button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:12px;
}

.record-actions button.delete{
  color:var(--warn);
  border-color:#dfb6ab;
}

.record-photo-link{
  color:var(--accent);
  text-decoration:none;
  font-size:12px;
  margin-left:5px;
}

.empty-record{
  padding:25px 10px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* =================================================
   照片 Modal
================================================= */

.modal{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(0,0,0,.72);
  padding:20px 12px;
  overflow-y:auto;
}

.modal.open{
  display:block;
}

.modal-box{
  max-width:600px;
  margin:0 auto;
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 14px;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.modal-head strong{
  font-size:15px;
}

.modal-close{
  border:none;
  background:#f1efe8;
  width:32px;
  height:32px;
  border-radius:50%;
  font-size:18px;
}

.modal-body{
  padding:12px;
}

.day-photo-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.day-photo{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
}

.day-photo img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
}

.day-photo-caption{
  padding:7px;
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
}

/* =================================================
   送出
================================================= */

.submit-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:
    12px
    18px
    calc(12px + env(safe-area-inset-bottom));
  z-index:20;
}

.submit-bar .inner{
  max-width:480px;
  margin:0 auto;
}

button.submit{
  width:100%;
  padding:15px 0;
  border:none;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

button.submit:disabled{
  background:#a3a091;
}

.status{
  font-size:13px;
  text-align:center;
  margin-top:8px;
  color:var(--muted);
  min-height:16px;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

</style>

</head>

<body>

<div class="wrap">

  <!-- =================================================
       頂部
  ================================================= -->

  <div class="brand">

    <div class="brand-left">

      <h1 id="pageTitle">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>

    <div class="brand-actions">

      <button
        type="button"
        class="top-btn"
        id="languageBtn"
      >
        語言
      </button>

    </div>

  </div>


  <!-- =================================================
       頁面切換
  ================================================= -->

  <div class="page-nav">

    <button
      type="button"
      id="navReport"
      class="active"
    >
      下貨回報
    </button>

    <button
      type="button"
      id="navHistory"
    >
      回報紀錄
    </button>

  </div>


  <!-- =================================================
       下貨回報頁
  ================================================= -->

  <div
    class="page active"
    id="reportPage"
  >

    <fieldset>

      <legend data-i18n="truckLegend">
        大車
      </legend>

      <div class="truck-select-wrap">

        <button
          type="button"
          class="truck-select-button"
          id="truckSelectButton"
        >
          大車載入中…
        </button>

        <div
          class="truck-dropdown"
          id="truckDropdown"
        >

          <div
            class="truck-list"
            id="truckList"
          >

            <div class="loading">
              大車資料載入中…
            </div>

          </div>

          <div class="truck-dropdown-footer">

            <button
              type="button"
              id="truckClearBtn"
              data-i18n="clear"
            >
              清除
            </button>

            <button
              type="button"
              class="primary"
              id="truckDoneBtn"
              data-i18n="done"
            >
              完成
            </button>

          </div>

        </div>

      </div>

    </fieldset>


    <fieldset>

      <legend data-i18n="staffLegend">
        下貨人員
      </legend>

      <div
        class="staff-grid"
        id="staffGrid"
      >

        <div class="loading">
          下貨人員資料載入中…
        </div>

      </div>

      <div
        id="lineMatchHint"
        class="line-match-hint"
        style="display:none;"
      ></div>

    </fieldset>


    <fieldset>

      <legend data-i18n="qtyLegend">
        件數是否正確
      </legend>

      <div
        class="seg"
        id="qtySeg"
      >

        <button
          type="button"
          data-v="ok"
          class="active"
          data-i18n="qtyOk"
        >
          ✓ 件數正確
        </button>

        <button
          type="button"
          data-v="bad"
          data-i18n="qtyBad"
        >
          ✗ 有多有少
        </button>

      </div>

    </fieldset>


    <fieldset>

      <legend data-i18n="photoLegend">
        照片
      </legend>

      <div class="photo-upload">

        <span class="icon">📷</span>

        <span data-i18n="uploadPhoto">
          點此上傳照片（可一次選多張）
        </span>

        <input
          type="file"
          accept="image/*"
          id="photoInput"
          multiple
        >

      </div>

      <div
        class="photo-grid"
        id="photoGrid"
      ></div>

      <div
        class="hint"
        data-i18n="photoHint"
      >
        至少上傳1張，可拍照或從相簿選取多張
      </div>

    </fieldset>


    <fieldset>

      <legend data-i18n="noteLegend">
        備註（選填）
      </legend>

      <textarea
        id="note"
        data-i18n-placeholder="notePlaceholder"
        placeholder="有多有少的原因、異常說明等"
      ></textarea>

    </fieldset>

  </div>


  <!-- =================================================
       回報紀錄頁
  ================================================= -->

  <div
    class="page"
    id="historyPage"
  >

    <div class="record-toolbar">

      <div
        class="record-title"
        data-i18n="historyTitle"
      >
        全部回報紀錄
      </div>

      <button
        type="button"
        class="refresh-btn"
        id="refreshHistoryBtn"
        data-i18n="refresh"
      >
        重新整理
      </button>

    </div>

    <div id="historyList">

      <div class="loading">
        回報紀錄載入中…
      </div>

    </div>

  </div>

</div>


<!-- =================================================
     照片 Modal
================================================= -->

<div
  class="modal"
  id="photoModal"
>

  <div class="modal-box">

    <div class="modal-head">

      <strong id="modalTitle">
        當日照片
      </strong>

      <button
        type="button"
        class="modal-close"
        id="modalCloseBtn"
      >
        ×
      </button>

    </div>

    <div
      class="modal-body"
      id="modalBody"
    ></div>

  </div>

</div>


<!-- =================================================
     送出
================================================= -->

<div class="submit-bar">

  <div class="inner">

    <button
      class="submit"
      id="submitBtn"
    >
      送出回報
    </button>

    <div
      class="status"
      id="statusMsg"
    ></div>

  </div>

</div>

/* =================================================
   後端 GET
================================================= */

async function getBackend(
  params={}
){

  const query =
    new URLSearchParams(
      params
    );


  query.set(
    "t",
    Date.now()
  );


  const response =
    await fetch(
      BACKEND_URL +
      "?" +
      query.toString(),
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    console.error(
      "後端不是 JSON：",
      text
    );


    throw new Error(
      "Apps Script 回傳格式錯誤"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "後端處理失敗"
    );

  }


  return result;

}

/* =================================================
   時間整理
================================================= */

function formatTruckTime(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  const text =
    String(value).trim();


  if(!text){

    return "";

  }


  const simpleMatch =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if(simpleMatch){

    return (
      String(
        simpleMatch[1]
      ).padStart(2,"0")
      +
      ":" +
      simpleMatch[2]
    );

  }


  const date =
    new Date(text);


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return (
      String(
        date.getHours()
      ).padStart(2,"0")
      +
      ":" +
      String(
        date.getMinutes()
      ).padStart(2,"0")
    );

  }


  return "";

}


/* =================================================
   大車最後使用
================================================= */

function getTruckUsage(
  truckName
){

  const data =
    truckLastUsed[
      truckName
    ];


  if(!data){

    return null;

  }


  if(
    typeof data === "string"
  ){

    return {

      time:
        formatTruckTime(
          data
        ),

      staff:""

    };

  }


  return {

    time:
      formatTruckTime(
        data.time
      ),

    staff:
      String(
        data.staff || ""
      ).trim()

  };

}


/* =================================================
   大車排序
================================================= */

function sortedTrucks(){

  return truckData
    .map(
      function(truck,index){

        return {

          truck:truck,

          originalIndex:index

        };

      }
    )
    .sort(
      function(a,b){

        const truckA =
          a.truck;

        const truckB =
          b.truck;


        const fixedA =
          truckA.fixed === true;

        const fixedB =
          truckB.fixed === true;


        if(
          fixedA !== fixedB
        ){

          return fixedA
            ? -1
            : 1;

        }


        if(
          fixedA &&
          fixedB
        ){

          return (
            a.originalIndex -
            b.originalIndex
          );

        }


        const usageA =
          getTruckUsage(
            truckA.name
          );

        const usageB =
          getTruckUsage(
            truckB.name
          );


        const usedA =
          Boolean(
            usageA &&
            usageA.staff
          );

        const usedB =
          Boolean(
            usageB &&
            usageB.staff
          );


        if(
          usedA !== usedB
        ){

          return usedA
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )
    .map(
      function(item){

        return item.truck;

      }
    );

}


/* =================================================
   顯示大車
================================================= */

function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  const button =
    document.getElementById(
      "truckSelectButton"
    );


  list.innerHTML = "";


  const trucks =
    sortedTrucks();


  if(
    trucks.length === 0
  ){

    list.innerHTML =
      `
      <div class="loading">
        ${escapeHtml(t("noTruck"))}
      </div>
      `;


    button.textContent =
      t("noTruck");


    return;

  }


  trucks.forEach(
    function(truck){

      const usage =
        getTruckUsage(
          truck.name
        );


      const isUsed =
        Boolean(
          usage &&
          usage.staff
        );


      const checked =
        selectedTrucks.has(
          truck.name
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "truck-option" +
        (
          isUsed
            ? " used"
            : ""
        );


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        truck.name;


      checkbox.checked =
        checked;


      checkbox.addEventListener(
        "change",
        function(){

          if(
            checkbox.checked
          ){

            selectedTrucks.add(
              truck.name
            );

          }else{

            selectedTrucks.delete(
              truck.name
            );

          }


          updateTruckButtonText();

        }
      );


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "truck-name";


      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );


      label.appendChild(
        name
      );


      if(
        isUsed &&
        usage.staff
      ){

        const staffTag =
          document.createElement(
            "span"
          );


        staffTag.className =
          "used-staff";


        staffTag.textContent =
          usage.staff;


        staffTag.title =
          usage.staff;


        label.appendChild(
          staffTag
        );

      }


      list.appendChild(
        label
      );

    }
  );


  updateTruckButtonText();

}

   LINE 自動對應
================================================= */

function autoMatchLineStaff(){

  const hint =
    document.getElementById(
      "lineMatchHint"
    );


  hint.style.display =
    "none";


  if(
    !userName ||
    userName === t("unknownUser")
  ){

    return;

  }


  const currentUser =
    String(
      userName
    )
      .trim()
      .toLowerCase();


  const matched =
    staffData.find(
      function(staff){

        const lineName =
          String(
            staff.lineName || ""
          )
            .trim()
            .toLowerCase();


        return (
          lineName &&
          lineName ===
          currentUser
        );

      }
    );


  if(!matched){

    return;

  }


  const inputs =
    document.querySelectorAll(
      "#staffGrid input[type=checkbox]"
    );


  let target =
    null;


  inputs.forEach(
    function(input){

      if(
        String(
          input.value
        ).trim() ===
        String(
          matched.name
        ).trim()
      ){

        target =
          input;

      }

    }
  );


  if(!target){

    return;

  }


  target.checked =
    true;


  const item =
    target.closest(
      ".staff-item"
    );


  if(item){

    item.classList.add(
      "selected"
    );

  }


  hint.style.display =
    "block";


  hint.className =
    "line-match-hint";


  hint.textContent =
    t("lineMatched")
      .replace(
        "{user}",
        userName
      )
      .replace(
        "{staff}",
        matched.name
      );

}

/* =================================================
   圖片壓縮
================================================= */

function compressImage(
  file,
  maxW=1200,
  quality=0.72
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const scale =
                Math.min(
                  1,
                  maxW /
                  img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =================================================
   選照片
================================================= */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const files =
        [...event.target.files];


      if(
        files.length === 0
      ){

        return;

      }


      setStatus(
        t("photoProcess"),
        ""
      );


      try{

        for(
          const file of files
        ){

          if(
            !file.type.startsWith(
              "image/"
            )
          ){

            continue;

          }


          const dataUrl =
            await compressImage(
              file
            );


          photos.push(
            dataUrl
          );

        }


        renderPhotoGrid();


        setStatus(
          "",
          ""
        );


      }catch(error){

        console.error(
          "照片處理失敗：",
          error
        );


        setStatus(
          t("photoProcessFailed"),
          "err"
        );

      }


      event.target.value = "";

    }
  );

/* =================================================
   POST
================================================= */

async function submitReport(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if(!response.ok){

    throw new Error(
      "Apps Script HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    console.error(
      "Apps Script 回傳內容：",
      text
    );


    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "Apps Script 儲存失敗"
    );

  }


  return result;

}

/* =================================================
   日期分組
================================================= */

function groupReportsByDate(
  records
){

  const groups =
    {};


  records.forEach(
    function(record){

      const date =
        String(
          record.date || ""
        ).trim();


      if(!date){

        return;

      }


      if(
        !groups[date]
      ){

        groups[date] = [];

      }


      groups[date].push(
        record
      );

    }
  );


  return groups;

}


/* =================================================
   日期排序
================================================= */

function sortedDates(
  groups
){

  return Object.keys(
    groups
  ).sort(
    function(a,b){

      return (
        String(b)
          .localeCompare(
            String(a)
          )
      );

    }
  );

}


/* =================================================
   日期顯示
================================================= */

function displayDate(
  dateText
){

  const parts =
    String(
      dateText
    ).split("-");


  if(
    parts.length === 3
  ){

    return (
      parts[0] +
      "/" +
      parts[1] +
      "/" +
      parts[2]
    );

  }


  return dateText;

}


/* =================================================
   回報紀錄
================================================= */

function renderHistory(){

  const list =
    document.getElementById(
      "historyList"
    );


  if(
    !Array.isArray(
      reportRecords
    )
  ){

    reportRecords =
      [];

  }


  const groups =
    groupReportsByDate(
      reportRecords
    );


  const dates =
    sortedDates(
      groups
    );


  if(
    dates.length === 0
  ){

    list.innerHTML =
      `
      <div class="empty-record">
        ${escapeHtml(t("noRecords"))}
      </div>
      `;

    return;

  }


  list.innerHTML = "";


  dates.forEach(
    function(date){

      const records =
        groups[date];


      const dateBox =
        document.createElement(
          "div"
        );


      dateBox.className =
        "record-date";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "record-date-header";


      const dateName =
        document.createElement(
          "div"
        );


      dateName.className =
        "record-date-name";


      dateName.textContent =
        displayDate(
          date
        );


      const photoButton =
        document.createElement(
          "button"
        );


      photoButton.type =
        "button";


      photoButton.className =
        "photo-day-btn";


      photoButton.textContent =
        t("viewPhotos");


      photoButton.addEventListener(
        "click",
        function(){

          openDayPhotos(
            date
          );

        }
      );


      header.appendChild(
        dateName
      );


      header.appendChild(
        photoButton
      );


      const items =
        document.createElement(
          "div"
        );


      items.className =
        "record-items";


      records.forEach(
        function(record){

          items.appendChild(
            createRecordItem(
              record
            )
          );

        }
      );


      dateBox.appendChild(
        header
      );


      dateBox.appendChild(
        items
      );


      list.appendChild(
        dateBox
      );

    }
  );

}


/* =================================================
   建立單筆回報
================================================= */

function createRecordItem(
  record
){

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "record-item";


  const top =
    document.createElement(
      "div"
    );


  top.className =
    "record-item-top";


  const employee =
    document.createElement(
      "div"
    );


  employee.className =
    "record-employee";


  employee.textContent =
    record.employee ||
    "";


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "record-time";


  time.textContent =
    record.time ||
    "";


  top.appendChild(
    employee
  );


  top.appendChild(
    time
  );


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "record-info";


  info.innerHTML =
    `
    <div>
      <strong>${escapeHtml(record.trucks || "")}</strong>
    </div>

    <div>
      ${escapeHtml(record.staff || "")}
    </div>

    <div>
      ${escapeHtml(record.qtyStatus || "")}
      ${
        record.photoUrl
          ? `
            <a
              class="record-photo-link"
              href="${escapeAttribute(record.photoUrl)}"
              target="_blank"
              rel="noopener"
            >
              ${escapeHtml(t("viewPhoto"))}
            </a>
          `
          : ""
      }
    </div>
    `;


  item.appendChild(
    top
  );


  item.appendChild(
    info
  );


  if(
    record.note
  ){

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "record-note";


    note.textContent =
      record.note;


    item.appendChild(
      note
    );

  }


  /*
   * C 欄員工名稱
   *
   * 直接判斷是不是目前 LINE 使用者。
   *
   * 不新增任何欄位。
   */

  if(
    String(
      record.employee || ""
    ).trim() ===
    String(
      userName || ""
    ).trim()
  ){

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "record-actions";


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.type =
      "button";


    deleteButton.className =
      "delete";


    deleteButton.textContent =
      t("delete");


    deleteButton.addEventListener(
      "click",
      function(){

        deleteReport(
          record
        );

      }
    );


    actions.appendChild(
      deleteButton
    );


    item.appendChild(
      actions
    );

  }


  return item;

}

async function deleteReport(
  record
){

  const ok =
    window.confirm(
      t("deleteConfirm")
    );


  if(!ok){

    return;

  }


  try{

    const result =
      await postBackend({
        action:
          "deleteReport",

        row:
          record.row,

        employee:
          userName
      });


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "Delete failed"
      );

    }


    setStatus(
      t("deleteSuccess"),
      "ok"
    );


    await loadHistory();


  }catch(error){

    console.error(
      "刪除失敗：",
      error
    );


    setStatus(
      t("deleteFailed") +
      (
        error.message ||
        error
      ),
      "err"
    );

  }

}

/* =================================================
   當日照片
================================================= */

async function openDayPhotos(
  date
){

  const modal =
    document.getElementById(
      "photoModal"
    );


  const body =
    document.getElementById(
      "modalBody"
    );


  const title =
    document.getElementById(
      "modalTitle"
    );


  title.textContent =
    displayDate(
      date
    );


  body.innerHTML =
    `
    <div class="loading">
      ${escapeHtml(t("loadingPhotos"))}
    </div>
    `;


  modal.classList.add(
    "open"
  );


  try{

    const result =
      await getBackend({

        type:
          "dayPhotos",

        date:
          date

      });


    const photos =
      Array.isArray(
        result.data &&
        result.data.photos
      )
        ? result.data.photos
        : [];


    if(
      photos.length === 0
    ){

      body.innerHTML =
        `
        <div class="empty-record">
          ${escapeHtml(t("noPhotos"))}
        </div>
        `;

      return;

    }


    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "day-photo-grid";


    photos.forEach(
      function(photo){

        const box =
          document.createElement(
            "div"
          );


        box.className =
          "day-photo";


        const link =
          document.createElement(
            "a"
          );


        link.href =
          photo.url;


        link.target =
          "_blank";


        link.rel =
          "noopener";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.thumbnailUrl ||
          photo.url;


        img.loading =
          "lazy";


        link.appendChild(
          img
        );


        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "day-photo-caption";


        caption.textContent =
          (
            photo.employee ||
            ""
          ) +
          (
            photo.time
              ? " · " +
                photo.time
              : ""
          );


        box.appendChild(
          link
        );


        box.appendChild(
          caption
        );


        grid.appendChild(
          box
        );

      }
    );


    body.innerHTML = "";


    body.appendChild(
      grid
    );


  }catch(error){

    console.error(
      "當日照片載入失敗：",
      error
    );


    body.innerHTML =
      `
      <div class="empty-record">
        ${escapeHtml(t("photoLoadFailed"))}
      </div>
      `;

  }

}

/* =================================================
   HTML 安全
================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
