<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;

  background:var(--paper);
  color:var(--ink);

  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 110px;
}


/* =================================================
   頂部
================================================= */

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:22px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  font-size:19px;
  margin:0;
  letter-spacing:.02em;
}

.brand .who{
  display:block;
  margin-top:5px;
  font-size:12px;
  color:var(--muted);
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =================================================
   頂部按鈕
================================================= */

.top-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.top-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:9px;
  padding:8px 9px;
  font-size:12px;
  white-space:nowrap;
}

.top-btn:active{
  transform:scale(.97);
}


/* =================================================
   語言
================================================= */

.language-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  background:var(--paper);
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.language-screen.show{
  display:flex;
}

.language-box{
  width:100%;
  max-width:380px;
  text-align:center;
}

.language-box h2{
  margin:0 0 8px;
  font-size:23px;
}

.language-box p{
  margin:0 0 24px;
  color:var(--muted);
  font-size:13px;
}

.language-options{
  display:grid;
  gap:10px;
}

.language-option{
  width:100%;
  padding:16px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font-size:16px;
  font-weight:700;
}

.language-option:active{
  background:var(--accent-dim);
}


/* =================================================
   表單
================================================= */

fieldset{
  border:none;
  padding:0;
  margin:0 0 22px;
}

legend{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:8px;
}


/* =================================================
   大車
================================================= */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  width:100%;
  padding:14px 44px 14px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  font-size:16px;
  position:relative;
}

.truck-select-button::after{
  content:"⌄";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-55%);
  font-size:20px;
  color:#777;
}

.truck-dropdown{
  display:none;
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  margin-top:6px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  overflow:hidden;
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.truck-option:last-child{
  border-bottom:none;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f5f4ef;
}

.truck-option.used .truck-name{
  color:#888679;
}

.used-staff{
  margin-left:auto;
  font-size:11px;
  padding:3px 7px;
  border-radius:20px;
  background:#e9e7df;
  color:#6f6d62;
  white-space:nowrap;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--line);
  background:#faf9f5;
}

.truck-dropdown-footer button{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:14px;
}

.truck-dropdown-footer button.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}


/* =================================================
   人員
================================================= */

.staff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.staff-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 10px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:var(--accent-dim);
  color:var(--accent);
  font-size:12px;
  line-height:1.5;
}


/* =================================================
   件數
================================================= */

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;
  padding:14px 0;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
  font-weight:700;
  color:var(--ink);
}

.seg button[data-v="ok"].active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  background:var(--warn);
  border-color:var(--warn);
  color:#fff;
}


/* =================================================
   照片
================================================= */

textarea{
  width:100%;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  font-size:16px;
  background:#fff;
  color:var(--ink);
  font-family:inherit;
  resize:vertical;
  min-height:80px;
}

textarea:focus{
  outline:none;
  border-color:var(--accent);
}

.photo-upload{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:#fff;
  position:relative;
  color:#8a8879;
}

.photo-upload span.icon{
  font-size:30px;
  display:block;
  margin-bottom:6px;
}

.photo-upload input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.thumb{
  position:relative;
  aspect-ratio:1;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#eee;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumb .rm{
  position:absolute;
  top:3px;
  right:3px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
}

.hint{
  font-size:12px;
  color:#9a988c;
  margin-top:6px;
}


/* =================================================
   上傳總進度
================================================= */

.upload-progress{
  display:none;
  margin-top:10px;
}

.upload-progress.show{
  display:block;
}

.upload-progress-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
}

.upload-progress-text{
  font-size:12px;
  color:var(--muted);
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.upload-progress-count{
  flex-shrink:0;
  font-size:12px;
  font-weight:700;
  color:var(--ink);
}

.upload-progress-track{
  width:100%;
  height:7px;
  border-radius:99px;
  overflow:hidden;
  background:#dedbd0;
}

.upload-progress-bar{
  width:0%;
  height:100%;
  border-radius:99px;
  background:var(--accent);
  transition:width .2s ease;
}

.upload-progress.uploading .upload-progress-bar{
  animation:uploadPulse 1.1s ease-in-out infinite;
}

@keyframes uploadPulse{
  0%{
    opacity:.65;
  }
  50%{
    opacity:1;
  }
  100%{
    opacity:.65;
  }
}


/* =================================================
   回報紀錄
================================================= */

.history-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:var(--paper);
  overflow-y:auto;
}

.history-screen.open{
  display:block;
}

.history-wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 40px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:14px;
  margin-bottom:16px;
  border-bottom:2px solid var(--ink);
}

.history-header h2{
  margin:0;
  font-size:19px;
}

.history-close{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:13px;
}

.history-loading{
  padding:25px 0;
  text-align:center;
  color:var(--muted);
}

.history-empty{
  padding:30px 0;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}


/* =================================================
   日期
================================================= */

.history-day{
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
}

.history-day-head{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  border:none;
  background:transparent;
  padding:14px 0;
  color:var(--ink);
  text-align:left;
}

.history-arrow{
  width:22px;
  font-size:16px;
  transition:transform .2s ease;
}

.history-day.open .history-arrow{
  transform:rotate(90deg);
}

.history-date{
  font-size:17px;
  font-weight:800;
}

.history-photo-all{
  margin-left:auto;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px 9px;
  font-size:11px;
  white-space:nowrap;
}

.history-day-body{
  display:none;
  padding:0 0 14px 0;
}

.history-day.open .history-day-body{
  display:block;
}


/* =================================================
   每筆回報
================================================= */

.report-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin-top:9px;
}

.report-main{
  display:flex;
  align-items:center;
  gap:8px;
}

.report-truck{
  font-size:20px;
  font-weight:900;
  line-height:1.15;
  min-width:0;
}

.report-staff{
  font-size:13px;
  color:#555;
  white-space:nowrap;
}

.report-status{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.report-status.ok{
  color:var(--accent);
}

.report-status.bad{
  color:var(--warn);
}

.report-employee{
  margin-left:auto;
  font-size:11px;
  color:#8a8879;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:80px;
}

.report-time{
  margin-top:6px;
  font-size:11px;
  color:#9a988c;
}

.report-note{
  margin-top:7px;
  padding:8px;
  border-radius:8px;
  background:#f7f5ef;
  font-size:12px;
  line-height:1.5;
}


/* =================================================
   回報照片
================================================= */

.report-photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.report-photo{
  position:relative;
  aspect-ratio:1;
  border-radius:8px;
  overflow:hidden;
  background:#eee;
  border:1px solid var(--line);
  cursor:pointer;
}

.report-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.report-photo.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:10px;
}

.report-no-photo{
  margin-top:8px;
  color:#aaa;
  font-size:11px;
}


/* =================================================
   大車照片
================================================= */

.all-photo-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:400;
  background:rgba(20,20,18,.97);
  overflow-y:auto;
}

.all-photo-screen.open{
  display:block;
}

.all-photo-wrap{
  max-width:600px;
  margin:0 auto;
  padding:16px 14px 40px;
}

.all-photo-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#fff;
  margin-bottom:15px;
}

.all-photo-head h3{
  margin:0;
  font-size:18px;
}

.all-photo-close{
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:8px;
  padding:7px 10px;
}

.all-photo-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.all-photo-item{
  background:#111;
  border-radius:8px;
  overflow:hidden;
}

.all-photo-item img{
  display:block;
  width:100%;
  height:auto;
}


/* =================================================
   圖片放大
================================================= */

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  z-index:600;
  background:rgba(0,0,0,.94);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

.lightbox-close{
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:20px;
}


/* =================================================
   送出
================================================= */

.submit-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
}

.submit-bar .inner{
  max-width:480px;
  margin:0 auto;
}

button.submit{
  width:100%;
  padding:15px 0;
  border:none;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

button.submit:disabled{
  background:#a3a091;
}

.status{
  font-size:13px;
  text-align:center;
  margin-top:8px;
  color:var(--muted);
  min-height:16px;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.hidden{
  display:none !important;
}

</style>

</head>

<body>


<!-- =================================================
     語言選擇
================================================= -->

<div
  class="language-screen"
  id="languageScreen"
>

  <div class="language-box">

    <h2>
      選擇語言
    </h2>

    <p>
      Choose your language
    </p>

    <div class="language-options">

      <button
        type="button"
        class="language-option"
        data-lang="zh"
      >
        中文
      </button>

      <button
        type="button"
        class="language-option"
        data-lang="vi"
      >
        Tiếng Việt
      </button>

    </div>

  </div>

</div>


<!-- =================================================
     主畫面
================================================= -->

<div class="wrap">

  <div class="brand">

    <div class="brand-left">

      <h1 data-i18n="title">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>

    <div class="top-actions">

      <button
        type="button"
        class="top-btn"
        id="historyBtn"
      >
        📋 回報紀錄
      </button>

      <button
        type="button"
        class="top-btn"
        id="languageBtn"
      >
        中文
      </button>

    </div>

  </div>


  <!-- 大車 -->

  <fieldset>

    <legend data-i18n="truck">
      大車
    </legend>

    <div class="truck-select-wrap">

      <button
        type="button"
        class="truck-select-button"
        id="truckSelectButton"
      >
        大車載入中…
      </button>

      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >
          <div class="loading">
            大車資料載入中…
          </div>
        </div>

        <div class="truck-dropdown-footer">

          <button
            type="button"
            id="truckClearBtn"
            data-i18n="clear"
          >
            清除
          </button>

          <button
            type="button"
            class="primary"
            id="truckDoneBtn"
            data-i18n="done"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>


  <!-- 下貨人員 -->

  <fieldset>

    <legend data-i18n="staff">
      下貨人員
    </legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >
      <div class="loading">
        下貨人員資料載入中…
      </div>
    </div>

    <div
      id="lineMatchHint"
      class="line-match-hint"
      style="display:none;"
    ></div>

  </fieldset>


  <!-- 件數 -->

  <fieldset>

    <legend data-i18n="qty">
      件數是否正確
    </legend>

    <div
      class="seg"
      id="qtySeg"
    >

      <button
        type="button"
        data-v="ok"
        class="active"
        data-i18n="qtyOk"
      >
        ✓ 件數正確
      </button>

      <button
        type="button"
        data-v="bad"
        data-i18n="qtyBad"
      >
        ✗ 有多有少
      </button>

    </div>

  </fieldset>


  <!-- 照片 -->

  <fieldset>

    <legend data-i18n="photo">
      照片
    </legend>

    <div class="photo-upload">

      <span class="icon">
        📷
      </span>

      <span data-i18n="uploadPhoto">
        點此上傳照片（可一次選多張）
      </span>

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        multiple
      >

    </div>

    <div
      class="photo-grid"
      id="photoGrid"
    ></div>

    <div
      class="hint"
      data-i18n="photoHint"
    >
      至少上傳1張，可拍照或從相簿選取多張
    </div>

    <!-- 唯一一條總進度 -->

    <div
      class="upload-progress"
      id="uploadProgress"
    >

      <div class="upload-progress-top">

        <div
          class="upload-progress-text"
          id="uploadProgressText"
        >
          處理照片
        </div>

        <div
          class="upload-progress-count"
          id="uploadProgressCount"
        >
          0 / 0
        </div>

      </div>

      <div class="upload-progress-track">

        <div
          class="upload-progress-bar"
          id="uploadProgressBar"
        ></div>

      </div>

    </div>

  </fieldset>


  <!-- 備註 -->

  <fieldset>

    <legend data-i18n="note">
      備註（選填）
    </legend>

    <textarea
      id="note"
      data-i18n-placeholder="notePlaceholder"
      placeholder="有多有少的原因、異常說明等"
    ></textarea>

  </fieldset>

</div>


<!-- =================================================
     送出
================================================= -->

        error.message ||

      ),
      "err"
    );


    return false;

  }

}


/* =================================================
   GET 後端
================================================= */

async function getBackend(
  type
){

  const response =
    await fetch(
      BACKEND_URL +
      "?type=" +
      encodeURIComponent(
        type
      ) +
      "&t=" +
      Date.now(),
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "後端沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "後端資料取得失敗"
    );

  }


  return result;

}

/* =================================================
   大車時間
================================================= */

function formatTruckTime(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  const text =
    String(
      value
    ).trim();


  if(!text){

    return "";

  }


  const simpleMatch =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if(simpleMatch){

    return (
      String(
        simpleMatch[1]
      ).padStart(
        2,
        "0"
      ) +
      ":" +
      simpleMatch[2]
    );

  }


  const date =
    new Date(
      text
    );


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return (
      String(
        date.getHours()
      ).padStart(
        2,
        "0"
      ) +
      ":" +
      String(
        date.getMinutes()
      ).padStart(
        2,
        "0"
      )
    );

  }


  return "";

}


/* =================================================
   大車最後使用
================================================= */

function getTruckUsage(
  truckName
){

  const data =
    truckLastUsed[
      truckName
    ];


  if(!data){

    return null;

  }


  return {

    time:
      formatTruckTime(
        data.time
      ),

    staff:
      String(
        data.staff ||
        ""
      ).trim()

  };

}


/* =================================================
   大車排序
================================================= */

function sortedTrucks(){

  return truckData
    .map(
      function(
        truck,
        index
      ){

        return {

          truck:
            truck,

          originalIndex:
            index

        };

      }
    )
    .sort(
      function(a,b){

        const truckA =
          a.truck;

        const truckB =
          b.truck;


        const fixedA =
          truckA.fixed === true;

        const fixedB =
          truckB.fixed === true;


        if(
          fixedA !==
          fixedB
        ){

          return fixedA
            ? -1
            : 1;

        }


        if(
          fixedA &&
          fixedB
        ){

          return (
            a.originalIndex -
            b.originalIndex
          );

        }


        const usageA =
          getTruckUsage(
            truckA.name
          );

        const usageB =
          getTruckUsage(
            truckB.name
          );


        const usedA =
          Boolean(
            usageA &&
            usageA.staff
          );

        const usedB =
          Boolean(
            usageB &&
            usageB.staff
          );


        if(
          usedA !==
          usedB
        ){

          return usedA
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )
    .map(
      function(item){

        return item.truck;

      }
    );

}


/* =================================================
   顯示大車
================================================= */

function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  const button =
    document.getElementById(
      "truckSelectButton"
    );


  list.innerHTML =
    "";


  const trucks =
    sortedTrucks();


  if(
    trucks.length === 0
  ){

    list.innerHTML =
      `
      <div class="loading">
        目前沒有啟用中的大車
      </div>
      `;


    button.textContent =
      "目前沒有啟用中的大車";


    return;

  }


  trucks.forEach(
    function(truck){

      const usage =
        getTruckUsage(
          truck.name
        );


      const isUsed =
        Boolean(
          usage &&
          usage.staff
        );


      const checked =
        selectedTrucks.has(
          truck.name
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "truck-option" +
        (
          isUsed
            ? " used"
            : ""
        );


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        truck.name;


      checkbox.checked =
        checked;


      checkbox.addEventListener(
        "change",
        function(){

          if(
            checkbox.checked
          ){

            selectedTrucks.add(
              truck.name
            );

          }else{

            selectedTrucks.delete(
              truck.name
            );

          }


          updateTruckButtonText();

        }
      );


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "truck-name";


      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );


      label.appendChild(
        name
      );


      if(
        isUsed &&
        usage.staff
      ){

        const staffTag =
          document.createElement(
            "span"
          );


        staffTag.className =
          "used-staff";


        staffTag.textContent =
          usage.staff;


        label.appendChild(
          staffTag
        );

      }


      list.appendChild(
        label
      );

    }
  );


  updateTruckButtonText();

}

  button.textContent =
    "已選 " +
    names.length +

    names.join("、");

    return;

  staffData.forEach(
    function(staff){

      const label =
        document.createElement(
          "label"
        );


      label.className =
        "staff-item";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        staff.name;


      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        staff.name;


      checkbox.addEventListener(
        "change",
        function(){

          label.classList.toggle(
            "selected",
            checkbox.checked
          );

        }
      );


      label.appendChild(
        checkbox
      );


      label.appendChild(
        span
      );


      grid.appendChild(
        label
      );

    }
  );

}


/* =================================================
   LINE 對應
================================================= */

function autoMatchLineStaff(){

  const hint =
    document.getElementById(
      "lineMatchHint"
    );


  hint.style.display =
    "none";


  if(
    !userName ||
    userName ===
      "未知使用者"
  ){

    return;

  }


  const currentUser =
    String(
      userName
    )
      .trim()
      .toLowerCase();


  const matched =
    staffData.find(
      function(staff){

        const lineName =
          String(
            staff.lineName ||
            ""
          )
            .trim()
            .toLowerCase();


        return (
          lineName &&
          lineName ===
            currentUser
        );

      }
    );


  if(!matched){

    return;

  }


  const inputs =
    document.querySelectorAll(
      "#staffGrid input[type=checkbox]"
    );


  let target =
    null;


  inputs.forEach(
    function(input){

      if(
        String(
          input.value
        ).trim() ===
        String(
          matched.name
        ).trim()
      ){

        target =
          input;

      }

    }
  );


  if(!target){

    return;

  }


  target.checked =
    true;


  const item =
    target.closest(
      ".staff-item"
    );


  if(item){

    item.classList.add(
      "selected"
    );

  }


  hint.style.display =
    "block";


  hint.textContent =
    t("lineMatch")
      .replace(
        "{user}",
        userName
      )
      .replace(
        "{staff}",
        matched.name
      );

}

          }

      );


      renderPhotoGrid();


      event.target.value =

  photos.forEach(
    function(photo,index){

      const div =
        document.createElement(
          "div"

      const img =

          "img"
        );


      img.src =
        photo.previewUrl;


      const remove =
        document.createElement(
          "button"
        );


      remove.className =
        "rm";


      remove.type =
        "button";


      remove.textContent =
        "✕";


      remove.disabled =
        isSubmitting;


      remove.addEventListener(
        "click",
        function(){

          if(isSubmitting){
            return;
          }


          const removed =
            photos.splice(
              index,
              1
            )[0];


          if(
            removed &&
            removed.previewUrl
          ){

            URL.revokeObjectURL(
              removed.previewUrl
            );

          }


          renderPhotoGrid();

        }
      );


      div.appendChild(
        img
      );


      div.appendChild(
        remove
      );


      grid.appendChild(
        div
      );

    }
  );

}


/* =================================================
   圖片壓縮
 *
 * 1200px
 * JPEG
 * Quality 72%
================================================= */

function compressImage(
  file,
  maxW = 1200,
  quality = 0.72
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const scale =
                Math.min(
                  1,
                  maxW /
                    img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.max(
                  1,
                  Math.round(
                    img.width *
                    scale
                  )
                );


              canvas.height =
                Math.max(
                  1,
                  Math.round(
                    img.height *
                    scale
                  )
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                );


              resolve(
                dataUrl
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  "圖片讀取失敗"
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "圖片檔案讀取失敗"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =================================================
   POST
================================================= */

async function postBackend(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "Apps Script 執行失敗"
    );

  }


  return result;

}

/* =================================================
   送出
 *
 * 重要：
 *
 * photos 裡面仍然是原始 File。
 *
 * 送出時：
 *
 * 1. 總數 = 照片數
 * 2. 每一張逐張壓縮成 1200px / 72%
 * 3. 每完成一張更新同一條進度條
 * 4. 全部完成後一次送給 Apps Script
 * 5. Apps Script 成功才清除照片
 * 6. 失敗不清除照片
================================================= */

document
  .getElementById(
    "submitBtn"
  )
  .addEventListener(
    "click",
    async function(){

      if(isSubmitting){
        return;
      }


      const trucks =
        Array.from(
          selectedTrucks
        );


      const staff =
        getSelectedStaff();


      const qtyButton =
        document.querySelector(
          "#qtySeg button.active"
        );


      const qtyStatus =
        qtyButton
          ? qtyButton.dataset.v
          : "ok";


      const note =
        document
          .getElementById(
            "note"
          )
          .value
          .trim();


      if(
        trucks.length === 0
      ){

        setStatus(
          t("needTruck"),
          "err"
        );

        return;

      }


      if(
        staff.length === 0
      ){

        setStatus(
          t("needStaff"),
          "err"
        );

        return;

      }


      if(
        photos.length === 0
      ){

        setStatus(
          t("needPhoto"),
          "err"
        );

        return;

      }


      /*
       * 從這裡開始鎖定。
       *
       * 員工不能重複按送出。
       */

      setSubmittingState(
        true
      );


      const total =
        photos.length;


      const compressedPhotos =
        [];


      try{

        /*
         * ==========================================
         * 階段 1：逐張處理照片
         * ==========================================
         *
         * 進度條只有一條。
         *
         * 例如 6 張：
         *
         * 處理照片 1 / 6
         * 處理照片 2 / 6
         * ...
         * 處理照片 6 / 6
         */

        for(
          let i = 0;
          i < photos.length;
          i++
        ){

          const photo =
            photos[i];


          const current =
            i + 1;


          showUploadProgress(
            current,
            total,
            t("processingPhoto"),
            (
              current /
              total
            ) *
            90,
            false
          );


          const compressed =
            await compressImage(
              photo.file,
              1200,
              0.72
            );


          compressedPhotos.push(
            compressed
          );


          /*
           * 讓瀏覽器有機會更新畫面，
           * 確保進度條真的會看到變化。
           */

          await new Promise(
            function(resolve){

              setTimeout(
                resolve,
                20
              );

            }
          );

        }


        /*
         * ==========================================
         * 階段 2：送到 Apps Script
         * ==========================================
         *
         * 這裡維持你原本後端一次 POST 的架構。
         *
         * 因此不能假裝每一張都各自完成 HTTP upload。
         *
         * 進度條會從照片處理完成後進入
         * 「照片上傳中…」，
         * 等真正的 POST 成功後直接到 100%。
         */

        showUploadProgress(
          total,
          total,
          t("uploadingReport"),
          95,
          true
        );


        setStatus(
          t("sending"),
          ""
        );


        const payload = {

          user:
            userName,

          trucks:
            trucks,

          staff:
            staff,

          qtyStatus:
            qtyStatus === "ok"
              ? "正確"
              : "有多有少",

          note:
            note,

          /*
           * 這裡傳出去的全部都是：
           *
           * JPEG
           * 最寬 1200px
           * quality 0.72
           *
           * 不會把原始 File 傳給 Google Drive。
           */

          photos:
            compressedPhotos

        };


        const result =
          await postBackend(
            payload
          );


        console.log(
          result
        );


        /*
         * ==========================================
         * 真正成功
         * ==========================================
         */

        showUploadProgress(
          total,
          total,
          t("success"),
          100,
          false
        );


        setStatus(
          t("success"),
          "ok"
        );


        /*
         * 只有成功才更新最後使用紀錄。
         */

        trucks.forEach(
          function(truck){

            truckLastUsed[
              truck
            ] = {

              time:
                new Date(),

              staff:
                staff.join("、")

            };

          }
        );


        /*
         * 只有成功才清除照片。
         */

        photos.forEach(
          function(photo){

            if(
              photo.previewUrl
            ){

              URL.revokeObjectURL(
                photo.previewUrl
              );

            }

          }
        );


        photos =
          [];


        renderPhotoGrid();


        selectedTrucks.clear();

        renderTrucks();


        document
          .getElementById(
            "note"
          )
          .value =
          "";


        document
          .querySelectorAll(
            "#staffGrid input[type=checkbox]"
          )
          .forEach(
            function(input){

              input.checked =
                false;


              const item =
                input.closest(
                  ".staff-item"
                );


              if(item){

                item.classList.remove(
                  "selected"
                );

              }

            }
          );


        document
          .getElementById(
            "lineMatchHint"
          )
          .style
          .display =
          "none";


        document
          .querySelectorAll(
            "#qtySeg button"
          )
          .forEach(
            function(btn){

              btn.classList.remove(
                "active"
              );

            }
          );


        document
          .querySelector(
            '#qtySeg button[data-v="ok"]'
          )
          .classList
          .add(
            "active"
          );


        document
          .getElementById(
            "truckDropdown"
          )
          .classList
          .remove(
            "open"
          );


        /*
         * 成功後重新整理回報紀錄。
         */

        if(
          document
            .getElementById(
              "historyScreen"
            )
            .classList
            .contains(
              "open"
            )
        ){

          await loadReports();

        }


        /*
         * 顯示完成後才解鎖。
         */

        setSubmittingState(
          false
        );


        /*
         * 進度條留著短暫顯示 100%，
         * 然後關閉。
         */

        setTimeout(
          function(){

            hideUploadProgress();

          },
          1200
        );


        /*
         * LIFF 成功後關閉視窗。
         */

        setTimeout(
          function(){

            try{

              if(
                window.liff &&
                liff.isInClient()
              ){

                liff.closeWindow();

              }

            }catch(error){

              console.log(
                error
              );

            }

          },
          1500
        );


      }catch(error){

        console.error(
          error
        );


        /*
         * ==========================================
         * 失敗
         * ==========================================
         *
         * 最重要：
         *
         * photos 完全不動。
         *
         * 所以原始照片仍然留在畫面上，
         * 使用者可以直接重新按「送出回報」。
         */

        setStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "err"
        );


        /*
         * 進度條顯示失敗，
         * 不清除照片。
         */

        showUploadProgress(
          0,
          total,
          t("uploadFail"),
          0,
          false
        );


        /*
         * 解鎖。
         */

        setSubmittingState(
          false
        );

      }

    }
  );

/* =================================================
   日期分組
================================================= */

function groupReportsByDate(){

  const groups =
    {};


  reportData.forEach(
    function(report){

      const date =
        report.date ||
        "未知日期";


      if(
        !groups[date]
      ){

        groups[date] =
          [];

      }


      groups[date].push(
        report
      );

    }
  );


  return groups;

}


/* =================================================
   日期顯示
================================================= */

function formatDateLabel(
  date
){

  if(
    !date
  ){

    return "";

  }


  const parts =
    date.split("-");


  if(
    parts.length !== 3
  ){

    return date;

  }


  return (
    parts[0] +
    "/" +
    parts[1] +
    "/" +
    parts[2]
  );

}


/* =================================================
   回報紀錄
================================================= */

function renderHistory(){

  const content =
    document.getElementById(
      "historyContent"
    );


  const groups =
    groupReportsByDate();


  const dates =
    Object.keys(
      groups
    ).sort(
      function(a,b){

        return b.localeCompare(
          a
        );

      }
    );


  if(
    dates.length === 0
  ){

    content.innerHTML =
      `
      <div class="history-empty">
        ${t("noHistory")}
      </div>
      `;

    return;

  }


  content.innerHTML =
    "";


  dates.forEach(
    function(date){

      const day =
        document.createElement(
          "div"
        );


      day.className =
        "history-day";


      const head =
        document.createElement(
          "button"
        );


      head.type =
        "button";


      head.className =
        "history-day-head";


      const arrow =
        document.createElement(
          "span"
        );


      arrow.className =
        "history-arrow";


      arrow.textContent =
        "▶";


      const dateText =
        document.createElement(
          "span"
        );


      dateText.className =
        "history-date";


      dateText.textContent =
        formatDateLabel(
          date
        );


      const allPhotoBtn =
        document.createElement(
          "button"
        );


      allPhotoBtn.type =
        "button";


      allPhotoBtn.className =
        "history-photo-all";


      allPhotoBtn.textContent =
        "📷 " +
        t(
          "viewTodayPhotos"
        );


      allPhotoBtn.addEventListener(
        "click",
        function(event){

          event.stopPropagation();

          showAllDayPhotos(
            date,
            groups[date]
          );

        }
      );


      head.appendChild(
        arrow
      );


      head.appendChild(
        dateText
      );


      head.appendChild(
        allPhotoBtn
      );


      const body =
        document.createElement(
          "div"
        );


      body.className =
        "history-day-body";


      groups[date].forEach(
        function(report){

          body.appendChild(
            createReportCard(
              report
            )
          );

        }
      );


      head.addEventListener(
        "click",
        function(){

          day.classList.toggle(
            "open"
          );

        }
      );


      day.appendChild(
        head
      );


      day.appendChild(
        body
      );


      content.appendChild(
        day
      );

    }
  );

}


/* =================================================

================================================= */

function createReportCard(
  report
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "report-card";


  const main =
    document.createElement(
      "div"
    );


  main.className =
    "report-main";


  const truck =
    document.createElement(
      "div"
    );


  truck.className =
    "report-truck";


  truck.textContent =
    report.trucks ||
    "未指定大車";


  const staff =
    document.createElement(
      "div"
    );


  staff.className =
    "report-staff";


  staff.textContent =
    report.staff ||
    "";


  const status =
    document.createElement(
      "div"
    );


  const isOK =
    report.qtyStatus ===
    "正確";


  status.className =
    "report-status " +
    (
      isOK
        ? "ok"
        : "bad"
    );


  status.textContent =
    isOK
      ? "✓ 正確"
      : "✗ " +
        (
          report.qtyStatus ||
          "有多有少"
        );


  const employee =
    document.createElement(
      "div"
    );


  employee.className =
    "report-employee";


  employee.textContent =
    report.employee ||
    "";


  main.appendChild(
    truck
  );


  if(
    report.staff
  ){

    main.appendChild(
      staff
    );

  }


  main.appendChild(
    status
  );


  main.appendChild(
    employee
  );


  card.appendChild(
    main
  );


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "report-time";


  time.textContent =
    report.time ||
    "";


  card.appendChild(
    time
  );


  /*
   * 回報照片：
   *
   * 仍然只載入縮圖 URL。
   *
   * loading="lazy"
   * 不會一進回報紀錄就把全部照片原圖抓下來。
   */

  if(
    Array.isArray(
      report.photos
    ) &&
    report.photos.length > 0
  ){

    const photoGrid =
      document.createElement(
        "div"
      );


    photoGrid.className =
      "report-photos";


    report.photos.forEach(
      function(photo){

        const photoItem =
          document.createElement(
            "div"
          );


        photoItem.className =
          "report-photo";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.url;


        img.loading =
          "lazy";


        img.decoding =
          "async";


        img.alt =
          photo.name ||
          "";


        img.addEventListener(
          "click",
          function(){

            openLightbox(
              photo.url
            );

          }
        );


        photoItem.appendChild(
          img
        );


        photoGrid.appendChild(
          photoItem
        );

      }
    );


    card.appendChild(
      photoGrid
    );

  }else{

    const noPhoto =
      document.createElement(
        "div"
      );


    noPhoto.className =
      "report-no-photo";


    noPhoto.textContent =
      t(
        "noPhotos"
      );


    card.appendChild(
      noPhoto
    );

  }


  /*
   * 備註
   */

  if(
    report.note
  ){

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "report-note";


    note.textContent =
      report.note;


    card.appendChild(
      note
    );

  }


  /*
   * 只有自己傳的才顯示刪除
   */

  if(
    String(
      report.employee ||
      ""
    ).trim() ===
    String(
      userName ||
      ""
    ).trim()
  ){

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.type =
      "button";


    deleteButton.textContent =
      t(
        "delete"
      );


    deleteButton.style.marginTop =
      "9px";


    deleteButton.style.border =
      "1px solid var(--line)";


    deleteButton.style.background =
      "#fff";


    deleteButton.style.borderRadius =
      "8px";


    deleteButton.style.padding =
      "7px 10px";


    deleteButton.style.fontSize =
      "11px";


    deleteButton.addEventListener(
      "click",
      function(){

        deleteReportFromHistory(
          report,
          deleteButton
        );

      }
    );


    card.appendChild(
      deleteButton
    );

  }


  return card;

}


/* =================================================
   刪除
================================================= */

async function deleteReportFromHistory(
  report,
  button
){

  if(
    !confirm(
      t(
        "deleteConfirm"
      )
    )
  ){

    return;

  }


  button.disabled =
    true;


  button.textContent =
    t(
      "deleting"
    );


  try{

    await postBackend({

      action:
        "deleteReport",

      row:
        report.row,

      user:
        userName

    });


    reportData =
      reportData.filter(
        function(item){

          return (
            item.row !==
            report.row
          );

        }
      );


    renderHistory();


  }catch(error){

    console.error(
      error
    );


    button.disabled =
      false;


    button.textContent =
      t(
        "delete"
      );


    alert(
      error.message ||
      "刪除失敗"
    );

  }

}


/* =================================================
   當日全部照片
================================================= */

function showAllDayPhotos(
  date,
  reports
){

  const screen =
    document.getElementById(
      "allPhotoScreen"
    );


  const title =
    document.getElementById(
      "allPhotoTitle"
    );


  const grid =
    document.getElementById(
      "allPhotoGrid"
    );


  title.textContent =
    formatDateLabel(
      date
    ) +
    " · " +
    t(
      "allPhotos"
    );


  grid.innerHTML =
    "";


  let count =
    0;


  reports.forEach(
    function(report){

      if(
        !Array.isArray(
          report.photos
        )
      ){

        return;

      }


      report.photos.forEach(
        function(photo){

          count++;


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "all-photo-item";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            photo.url;


          img.loading =
            "lazy";


          img.decoding =
            "async";


          img.addEventListener(
            "click",
            function(){

              openLightbox(
                photo.url
              );

            }
          );


          item.appendChild(
            img
          );


          grid.appendChild(
            item
          );

        }
      );

    }
  );


  if(
    count === 0
  ){

    grid.innerHTML =
      `
      <div
        style="
          color:#aaa;
          padding:30px;
          text-align:center;
          grid-column:1/-1;
        "
      >
        ${t("noDayPhotos")}
      </div>
      `;

  }


  screen.classList.add(
    "open"
  );

}


document
  .getElementById(
    "allPhotoClose"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "allPhotoScreen"
        )
        .classList
        .remove(
          "open"
        );

    }
  );


/* =================================================
   圖片放大
================================================= */

function openLightbox(
  url
){

  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    url;


  document
    .getElementById(
      "lightbox"
    )
    .classList
    .add(
      "open"
    );

}


function closeLightbox(){

  document
    .getElementById(
      "lightbox"
    )
    .classList
    .remove(
      "open"
    );


  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    "";

}


document
  .getElementById(
    "lightboxClose"
  )
  .addEventListener(
    "click",
    closeLightbox
  );


document
  .getElementById(
    "lightbox"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        this
      ){

        closeLightbox();

      }

    }
  );


/* =================================================
   啟動
================================================= */

async function init(){

  /*
   * 第一次進入才要求選語言
   */

  if(
    !currentLanguage
  ){

    currentLanguage =
      "zh";

    applyLanguage();

    showLanguageScreen();

  }else{

    applyLanguage();

  }


  document
    .getElementById(
      "truckSelectButton"
    )
    .textContent =
    "大車載入中…";


  const loginOK =
    await initLIFF();


  if(!loginOK){

    return;

  }


  await loadSystemData();

}


init();

</script>
