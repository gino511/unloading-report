<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;

  background:var(--paper);
  color:var(--ink);

  -webkit-tap-highlight-color:transparent;
}

button,
textarea,
input{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 120px;
}

/* =================================================
   頂部
================================================= */

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
  padding-bottom:14px;

  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  font-size:19px;
  margin:0 0 4px;
  letter-spacing:.02em;
}

.brand .who{
  font-size:12px;
  color:var(--muted);

  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0;
}

.top-action{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);

  border-radius:9px;

  padding:8px 9px;

  font-size:12px;
  font-weight:700;
}

.top-action:active{
  transform:scale(.97);
}

/* =================================================
   FIELDSET
================================================= */

fieldset{
  border:none;
  padding:0;
  margin:0 0 22px;
}

legend{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:8px;
}

/* =================================================
   大車
================================================= */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  width:100%;

  padding:13px 42px 13px 13px;

  border:1.5px solid var(--line);
  border-radius:10px;

  background:#fff;
  color:var(--ink);

  text-align:left;
  font-size:16px;

  position:relative;
}

.truck-select-button::after{
  content:"⌄";

  position:absolute;

  right:14px;
  top:50%;

  transform:translateY(-55%);

  font-size:20px;
  color:#777;
}

.truck-dropdown{
  display:none;

  position:absolute;

  z-index:50;

  left:0;
  right:0;

  margin-top:6px;

  background:#fff;

  border:1.5px solid var(--line);
  border-radius:12px;

  box-shadow:0 8px 25px rgba(0,0,0,.12);

  overflow:hidden;
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;

  gap:10px;

  padding:13px 14px;

  border-bottom:1px solid #eee;

  font-size:15px;
}

.truck-option:last-child{
  border-bottom:none;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f5f4ef;
}

.truck-option.used .truck-name{
  color:#888679;
}

.used-staff{
  margin-left:auto;

  font-size:11px;

  padding:3px 7px;

  border-radius:20px;

  background:#e9e7df;
  color:#6f6d62;

  white-space:nowrap;

  max-width:150px;

  overflow:hidden;
  text-overflow:ellipsis;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;

  padding:10px;

  border-top:1px solid var(--line);

  background:#faf9f5;
}

.truck-dropdown-footer button{
  flex:1;

  padding:10px;

  border:1px solid var(--line);

  border-radius:8px;

  background:#fff;

  font-size:14px;
}

.truck-dropdown-footer button.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* =================================================
   下貨人員
================================================= */

.staff-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:8px;
}

.staff-item{
  display:flex;
  align-items:center;

  gap:8px;

  padding:13px 10px;

  border:1.5px solid var(--line);

  border-radius:10px;

  background:#fff;

  font-size:15px;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;

  padding:8px 10px;

  border-radius:8px;

  background:var(--accent-dim);

  color:var(--accent);

  font-size:12px;

  line-height:1.5;
}

/* =================================================
   件數
================================================= */

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;

  padding:14px 0;

  border:1.5px solid var(--line);

  border-radius:10px;

  background:#fff;

  font-size:15px;
  font-weight:700;

  color:var(--ink);
}

.seg button[data-v="ok"].active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  background:var(--warn);
  border-color:var(--warn);
  color:#fff;
}

/* =================================================
   照片上傳
================================================= */

.photo-upload{
  border:1.5px dashed var(--line);

  border-radius:12px;

  padding:18px;

  text-align:center;

  background:#fff;

  position:relative;

  color:#8a8879;
}

.photo-upload span.icon{
  font-size:30px;

  display:block;

  margin-bottom:6px;
}

.photo-upload input{
  position:absolute;

  inset:0;

  opacity:0;

  cursor:pointer;
}

.photo-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

  margin-top:12px;
}

.thumb{
  position:relative;

  aspect-ratio:1;

  border-radius:8px;

  overflow:hidden;

  border:1px solid var(--line);

  background:#eee;
}

.thumb img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.thumb .rm{
  position:absolute;

  top:3px;
  right:3px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:rgba(0,0,0,.65);

  color:#fff;

  font-size:13px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:none;
}

.hint{
  font-size:12px;

  color:#9a988c;

  margin-top:6px;
}

/* =================================================
   備註
================================================= */

textarea{
  width:100%;

  padding:12px;

  border:1.5px solid var(--line);

  border-radius:10px;

  font-size:16px;

  background:#fff;

  color:var(--ink);

  resize:vertical;

  min-height:80px;
}

textarea:focus{
  outline:none;
  border-color:var(--accent);
}

/* =================================================
   回報紀錄入口
================================================= */

.history-entry{
  margin-top:4px;
  margin-bottom:25px;
}

.history-entry-button{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:13px 14px;

  border:1.5px solid var(--line);

  border-radius:10px;

  background:#fff;

  color:var(--ink);

  font-size:14px;
  font-weight:700;
}

.history-entry-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.history-entry-icon{
  font-size:18px;
}

.history-entry-arrow{
  color:#888;
  font-size:20px;
}

/* =================================================
   回報紀錄頁
================================================= */

.history-page{
  display:none;

  position:fixed;

  inset:0;

  z-index:200;

  background:var(--paper);

  overflow-y:auto;
}

.history-page.open{
  display:block;
}

.history-page-inner{
  max-width:480px;

  margin:0 auto;

  padding:18px 18px 50px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-bottom:14px;

  border-bottom:2px solid var(--ink);

  margin-bottom:15px;
}

.history-title{
  font-size:19px;
  font-weight:800;
}

.history-close{
  border:1px solid var(--line);

  background:#fff;

  border-radius:9px;

  padding:8px 12px;

  font-size:13px;
}

/* =================================================
   日期
================================================= */

.history-date{
  border:1px solid var(--line);

  border-radius:12px;

  background:#fff;

  margin-bottom:10px;

  overflow:hidden;
}

.history-date-head{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  padding:13px;

  border:none;

  background:#fff;

  color:var(--ink);

  text-align:left;
}

.history-date-arrow{
  width:20px;

  font-size:17px;

  color:#777;

  transition:transform .15s ease;
}

.history-date.open
.history-date-arrow{
  transform:rotate(90deg);
}

.history-date-text{
  font-size:16px;
  font-weight:800;
}

.history-date-photo{
  margin-left:auto;

  border:1px solid var(--line);

  border-radius:8px;

  background:#faf9f5;

  padding:7px 8px;

  font-size:11px;

  white-space:nowrap;
}

.history-date-body{
  display:none;

  border-top:1px solid var(--line);

  padding:10px;
}

.history-date.open
.history-date-body{
  display:block;
}

/* =================================================
   回報單筆
================================================= */

.report-card{
  border-bottom:1px solid #e5e1d7;

  padding:12px 0;
}

.report-card:last-child{
  border-bottom:none;
}

.report-main{
  display:grid;

  grid-template-columns:minmax(0,1fr) auto;

  gap:10px;

  align-items:start;
}

.report-truck{
  font-size:19px;

  font-weight:900;

  line-height:1.25;

  margin-bottom:5px;
}

.report-staff{
  font-size:13px;

  color:#55534b;

  line-height:1.5;
}

.report-status{
  display:inline-block;

  margin-top:5px;

  padding:4px 7px;

  border-radius:6px;

  font-size:11px;

  font-weight:700;
}

.report-status.ok{
  background:var(--accent-dim);
  color:var(--accent);
}

.report-status.bad{
  background:#f6dfd9;
  color:var(--warn);
}

.report-meta{
  margin-top:7px;

  font-size:11px;

  color:#8a887e;

  line-height:1.5;
}

.report-note{
  margin-top:7px;

  font-size:13px;

  line-height:1.5;

  color:#45433d;
}

.report-photos{
  display:flex;

  gap:7px;

  margin-top:10px;

  overflow-x:auto;

  padding-bottom:2px;
}

.report-photo{
  width:76px;
  height:76px;

  flex:0 0 76px;

  border-radius:8px;

  overflow:hidden;

  border:1px solid var(--line);

  background:#eee;
}

.report-photo img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.report-photo-count{
  font-size:11px;

  color:#888;

  margin-top:5px;
}

.report-empty-photo{
  font-size:11px;
  color:#999;
}

/* =================================================
   當日所有照片
================================================= */

.day-photo-page{
  display:none;

  position:fixed;

  inset:0;

  z-index:250;

  background:rgba(20,20,18,.96);

  overflow-y:auto;
}

.day-photo-page.open{
  display:block;
}

.day-photo-inner{
  max-width:480px;

  margin:0 auto;

  padding:20px 14px 50px;
}

.day-photo-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  color:#fff;

  margin-bottom:15px;
}

.day-photo-title{
  font-size:17px;
  font-weight:800;
}

.day-photo-close{
  border:1px solid rgba(255,255,255,.35);

  background:transparent;

  color:#fff;

  border-radius:8px;

  padding:7px 11px;
}

.day-photo-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:6px;
}

.day-photo-item{
  aspect-ratio:1;

  border-radius:6px;

  overflow:hidden;

  background:#222;
}

.day-photo-item img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.day-photo-empty{
  color:#aaa;

  text-align:center;

  padding:40px 10px;
}

/* =================================================
   語言
================================================= */

.language-page{
  display:none;

  position:fixed;

  inset:0;

  z-index:300;

  background:var(--paper);

  align-items:center;
  justify-content:center;

  padding:25px;
}

.language-page.open{
  display:flex;
}

.language-box{
  width:100%;
  max-width:400px;
}

.language-title{
  font-size:23px;

  font-weight:900;

  margin-bottom:7px;
}

.language-subtitle{
  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;
}

.language-options{
  display:grid;
  gap:10px;
}

.language-option{
  width:100%;

  display:flex;

  align-items:center;

  gap:12px;

  padding:15px;

  border:1.5px solid var(--line);

  border-radius:12px;

  background:#fff;

  text-align:left;

  font-size:16px;

  font-weight:700;
}

.language-option.active{
  border-color:var(--accent);

  background:var(--accent-dim);
}

.language-radio{
  width:20px;
  height:20px;

  border:2px solid #aaa;

  border-radius:50%;

  flex-shrink:0;
}

.language-option.active
.language-radio{
  border-color:var(--accent);

  box-shadow:
    inset 0 0 0 4px #fff;

  background:var(--accent);
}

.language-save{
  width:100%;

  margin-top:15px;

  padding:14px;

  border:none;

  border-radius:11px;

  background:var(--ink);

  color:#fff;

  font-size:15px;

  font-weight:800;
}

/* =================================================
   Submit
================================================= */

.submit-bar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:var(--paper);

  border-top:1px solid var(--line);

  padding:
    12px
    18px
    calc(12px + env(safe-area-inset-bottom));
}

.submit-bar .inner{
  max-width:480px;

  margin:0 auto;
}

button.submit{
  width:100%;

  padding:15px 0;

  border:none;

  border-radius:12px;

  background:var(--ink);

  color:#fff;

  font-size:16px;

  font-weight:700;
}

button.submit:disabled{
  background:#a3a091;
}

.status{
  font-size:13px;

  text-align:center;

  margin-top:8px;

  color:var(--muted);

  min-height:16px;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;

  text-align:center;

  color:var(--muted);

  font-size:14px;
}

</style>

</head>

<body>

<div class="wrap">

  <div class="brand">

    <div class="brand-left">

      <h1 data-i18n="title">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>

    <div class="top-actions">

      <button
        type="button"
        class="top-action"
        id="languageBtn"
      >
        語言
      </button>

      <button
        type="button"
        class="top-action"
        id="historyTopBtn"
      >
        回報紀錄
      </button>

    </div>

  </div>

  <!-- =================================================
       大車
  ================================================== -->

  <fieldset>

    <legend data-i18n="truck">
      大車
    </legend>

    <div class="truck-select-wrap">

      <button
        type="button"
        class="truck-select-button"
        id="truckSelectButton"
      >
        大車載入中…
      </button>

      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >
          <div class="loading">
            大車資料載入中…
          </div>
        </div>

        <div class="truck-dropdown-footer">

          <button
            type="button"
            id="truckClearBtn"
            data-i18n="clear"
          >
            清除
          </button>

          <button
            type="button"
            class="primary"
            id="truckDoneBtn"
            data-i18n="done"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>

  <!-- =================================================
       下貨人員
  ================================================== -->

  <fieldset>

    <legend data-i18n="staff">
      下貨人員
    </legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >
      <div class="loading">
        下貨人員資料載入中…
      </div>
    </div>

    <div
      id="lineMatchHint"
      class="line-match-hint"
      style="display:none;"
    ></div>

  </fieldset>

  <!-- =================================================
       件數
  ================================================== -->

  <fieldset>

    <legend data-i18n="qty">
      件數是否正確
    </legend>

    <div
      class="seg"
      id="qtySeg"
    >

      <button
        type="button"
        data-v="ok"
        class="active"
        data-i18n="qtyOk"
      >
        ✓ 件數正確
      </button>

      <button
        type="button"
        data-v="bad"
        data-i18n="qtyBad"
      >
        ✗ 有多有少
      </button>

    </div>

  </fieldset>

  <!-- =================================================
       照片
  ================================================== -->

  <fieldset>

    <legend data-i18n="photos">
      照片
    </legend>

    <div class="photo-upload">

      <span class="icon">
        📷
      </span>

      <span data-i18n="uploadPhoto">
        點此上傳照片（可一次選多張）
      </span>

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        multiple
      >

    </div>

    <div
      class="photo-grid"
      id="photoGrid"
    ></div>

    <div
      class="hint"
      data-i18n="photoHint"
    >
      至少上傳1張，可拍照或從相簿選取多張
    </div>

  </fieldset>

  <!-- =================================================
       備註
  ================================================== -->

  <fieldset>

    <legend data-i18n="noteTitle">
      備註（選填）
    </legend>

    <textarea
      id="note"
      placeholder="有多有少的原因、異常說明等"
      data-i18n-placeholder="notePlaceholder"
    ></textarea>

  </fieldset>

  <!-- =================================================
       最下面才是回報紀錄入口
  ================================================== -->

  <div class="history-entry">

    <button
      type="button"
      class="history-entry-button"
      id="historyBottomBtn"
    >

      <span class="history-entry-left">

        <span class="history-entry-icon">
          📋
        </span>

        <span data-i18n="history">
          回報紀錄
        </span>

      </span>

      <span class="history-entry-arrow">
        ›
      </span>

    </button>

  </div>

</div>

<!-- =================================================
     回報紀錄
================================================== -->

<div
  class="history-page"
  id="historyPage"
>

  <div class="history-page-inner">

    <div class="history-header">

      <div
        class="history-title"
        data-i18n="history"
      >
        回報紀錄
      </div>

      <button
        type="button"
        class="history-close"
        id="historyCloseBtn"
        data-i18n="close"
      >
        關閉
      </button>

    </div>

    <div id="historyList">

      <div class="loading">
        回報紀錄載入中…
      </div>

    </div>

  </div>

</div>

<!-- =================================================
     當日所有照片
================================================== -->

<div
  class="day-photo-page"
  id="dayPhotoPage"
>

  <div class="day-photo-inner">

    <div class="day-photo-header">

      <div
        class="day-photo-title"
        id="dayPhotoTitle"
      ></div>

      <button
        type="button"
        class="day-photo-close"
        id="dayPhotoCloseBtn"
      >
        關閉
      </button>

    </div>

    <div
      class="day-photo-grid"
      id="dayPhotoGrid"
    ></div>

  </div>

</div>

<!-- =================================================
     語言選擇
================================================== -->

<div
  class="language-page"
  id="languagePage"
>

  <div class="language-box">

    <div
      class="language-title"
      data-i18n="languageTitle"
    >
      選擇語言
    </div>

    <div

/* =================================================
   GET
================================================= */

async function getBackend(
  type
){

  const url =
    BACKEND_URL +
    "?type=" +
    encodeURIComponent(
      type
    ) +
    "&t=" +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    console.error(
      text
    );

    throw new Error(
      "Apps Script 回傳格式錯誤"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "後端資料取得失敗"
    );

  }


  return result;

}

/* =================================================
   大車時間
================================================= */

function formatTruckTime(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  const text =
    String(
      value
    ).trim();


  if(!text){

    return "";

  }


  const simpleMatch =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if(simpleMatch){

    return (
      String(
        simpleMatch[1]
      ).padStart(2,"0")
      +
      ":" +
      simpleMatch[2]
    );

  }


  const date =
    new Date(
      text
    );


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return (
      String(
        date.getHours()
      ).padStart(2,"0")
      +
      ":" +
      String(
        date.getMinutes()
      ).padStart(2,"0")
    );

  }


  return "";

}


/* =================================================
   大車最後使用
================================================= */

function getTruckUsage(
  truckName
){

  const data =
    truckLastUsed[
      truckName
    ];


  if(!data){

    return null;

  }


  if(
    typeof data ===
    "string"
  ){

    return {

      time:
        formatTruckTime(
          data
        ),

      staff:""

    };

  }


  return {

    time:
      formatTruckTime(
        data.time
      ),

    staff:
      String(
        data.staff ||
        ""
      ).trim()

  };

}


/* =================================================
   大車排序
================================================= */

function sortedTrucks(){

  return truckData
    .map(
      function(
        truck,
        index
      ){

        return {

          truck:
            truck,

          originalIndex:
            index

        };

      }
    )
    .sort(
      function(
        a,
        b
      ){

        const truckA =
          a.truck;

        const truckB =
          b.truck;


        const fixedA =
          truckA.fixed === true;

        const fixedB =
          truckB.fixed === true;


        if(
          fixedA !== fixedB
        ){

          return fixedA
            ? -1
            : 1;

        }


        if(
          fixedA &&
          fixedB
        ){

          return (
            a.originalIndex -
            b.originalIndex
          );

        }


        const usageA =
          getTruckUsage(
            truckA.name
          );

        const usageB =
          getTruckUsage(
            truckB.name
          );


        const usedA =
          Boolean(
            usageA &&
            usageA.staff
          );

        const usedB =
          Boolean(
            usageB &&
            usageB.staff
          );


        if(
          usedA !== usedB
        ){

          return usedA
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )
    .map(
      function(item){

        return item.truck;

      }
    );

}


/* =================================================
   Render 大車
================================================= */

function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  const button =
    document.getElementById(
      "truckSelectButton"
    );


  list.innerHTML =
    "";


  const trucks =
    sortedTrucks();


  if(
    trucks.length === 0
  ){

    list.innerHTML =
      `
      <div class="loading">
        ${t("loading")}
      </div>
      `;

    button.textContent =
      t("truck");

    return;

  }


  trucks.forEach(
    function(truck){

      const usage =
        getTruckUsage(
          truck.name
        );


      const isUsed =
        Boolean(
          usage &&
          usage.staff
        );


      const checked =
        selectedTrucks.has(
          truck.name
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "truck-option" +
        (
          isUsed
            ? " used"
            : ""
        );


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        truck.name;


      checkbox.checked =
        checked;


      checkbox.addEventListener(
        "change",
        function(){

          if(
            checkbox.checked
          ){

            selectedTrucks.add(
              truck.name
            );

          }else{

            selectedTrucks.delete(
              truck.name
            );

          }


          updateTruckButtonText();

        }
      );


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "truck-name";


      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );


      label.appendChild(
        name
      );


      if(
        isUsed &&
        usage.staff
      ){

        const staffTag =
          document.createElement(
            "span"
          );


        staffTag.className =
          "used-staff";


        staffTag.textContent =
          usage.staff;


        label.appendChild(
          staffTag
        );

      }


      list.appendChild(
        label
      );

    }
  );


  updateTruckButtonText();

}

/* =================================================
   LINE 自動對應
================================================= */

function autoMatchLineStaff(){

  const hint =
    document.getElementById(
      "lineMatchHint"
    );


  hint.style.display =
    "none";


  const currentUser =
    String(
      userName
    )
      .trim()
      .toLowerCase();


  if(
    !currentUser ||
    currentUser ===
    "未知使用者"
  ){

    return;

  }


  const matched =
    staffData.find(
      function(staff){

        const lineName =
          String(
            staff.lineName ||
            ""
          )
            .trim()
            .toLowerCase();


        return (
          lineName &&
          lineName ===
          currentUser
        );

      }
    );


  if(!matched){

    return;

  }


  const inputs =
    document.querySelectorAll(
      "#staffGrid input[type=checkbox]"
    );


  let target =
    null;


  inputs.forEach(
    function(input){

      if(
        String(
          input.value
        ).trim() ===
        String(
          matched.name
        ).trim()
      ){

        target =
          input;

      }

    }
  );


  if(!target){

    return;

  }


  target.checked =
    true;


  const item =
    target.closest(
      ".staff-item"
    );


  if(item){

    item.classList.add(
      "selected"
    );

  }


  hint.style.display =
    "block";


  hint.textContent =
    t(
      "lineMatch"
    )
      .replace(
        "{user}",
        userName
      )
      .replace(
        "{staff}",
        matched.name
      );

}

/* =================================================
   壓縮圖片
================================================= */

function compressImage(
  file,
  maxW=1200,
  quality=.72
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const scale =
                Math.min(
                  1,
                  maxW /
                  img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =================================================

================================================= */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const files =
        [
          ...event.target.files
        ];


      if(
        files.length === 0
      ){

        return;

      }


      setStatus(
        t("photoUploading"),
        ""
      );


      try{

        for(
          const file of files
        ){

          if(
            !file.type.startsWith(
              "image/"
            )
          ){

            continue;

          }


          const dataUrl =
            await compressImage(
              file
            );


          photos.push(
            dataUrl
          );

        }


        renderPhotoGrid();


        setStatus(
          "",
          ""
        );


      }catch(error){

        console.error(
          error
        );


        setStatus(
          t("photoError"),
          "err"
        );

      }


      event.target.value =
        "";

    }
  );

/* =================================================
   POST
================================================= */

async function submitReport(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "Apps Script 儲存失敗"
    );

  }


  return result;

}

/* =================================================
   讀取回報紀錄
================================================= */

async function loadHistory(
  silent
){

  if(!silent){

    document
      .getElementById(
        "historyList"
      )
      .innerHTML =
      `
      <div class="loading">
        ${t("historyLoading")}
      </div>
      `;

  }


  try{

    const result =
      await getBackend(
        "reports"
      );


    historyData =
      Array.isArray(
        result.data &&
        result.data.reports
      )
        ? result.data.reports
        : [];


    renderHistory();


  }catch(error){

    console.error(
      "回報紀錄讀取失敗：",
      error
    );


    document
      .getElementById(
        "historyList"
      )
      .innerHTML =
      `
      <div class="loading">
        ${t("systemError")}
        ${error.message}
      </div>
      `;

  }

}


/* =================================================
   日期格式
================================================= */

function formatHistoryDate(
  dateText
){

  if(!dateText){

    return "";

  }


  const parts =
    String(
      dateText
    ).split("-");


  if(
    parts.length !== 3
  ){

    return dateText;

  }


  return (
    Number(parts[1]) +
    "/" +
    Number(parts[2])
  );

}


/* =================================================
   Render 回報紀錄
================================================= */

function renderHistory(){

  const container =
    document.getElementById(
      "historyList"
    );


  container.innerHTML =
    "";


  if(
    historyData.length === 0
  ){

    container.innerHTML =
      `
      <div class="loading">
        ${t("noHistory")}
      </div>
      `;

    return;

  }


  /*
   * 依日期分組
   */

  const groups =
    {};


  historyData.forEach(
    function(report){

      const date =
        report.date ||
        "";


      if(!groups[date]){

        groups[date] =
          [];

      }


      groups[date].push(
        report
      );

    }
  );


  /*
   * 日期由新到舊
   */

  const dates =
    Object.keys(
      groups
    ).sort(
      function(a,b){

        return (
          b.localeCompare(a)
        );

      }
    );


  dates.forEach(
    function(date){

      const dateBox =
        document.createElement(
          "div"
        );


      dateBox.className =
        "history-date";


      const head =
        document.createElement(
          "button"
        );


      head.type =
        "button";


      head.className =
        "history-date-head";


      const arrow =
        document.createElement(
          "span"
        );


      arrow.className =
        "history-date-arrow";


      arrow.textContent =
        "›";


      const dateText =
        document.createElement(
          "span"
        );


      dateText.className =
        "history-date-text";


      dateText.textContent =
        formatHistoryDate(
          date
        );


      const photoButton =
        document.createElement(
          "button"
        );


      photoButton.type =
        "button";


      photoButton.className =
        "history-date-photo";


      photoButton.textContent =
        t("todayPhotos");


      photoButton.addEventListener(
        "click",
        function(event){

          event.stopPropagation();


          openDayPhotos(
            date,
            groups[date]
          );

        }
      );


      head.appendChild(
        arrow
      );


      head.appendChild(
        dateText
      );


      head.appendChild(
        photoButton
      );


      const body =
        document.createElement(
          "div"
        );


      body.className =
        "history-date-body";


      groups[date].forEach(
        function(report){

          body.appendChild(
            createReportCard(
              report
            )
          );

        }
      );


      head.addEventListener(
        "click",
        function(){

          dateBox.classList.toggle(
            "open"
          );

        }
      );


      dateBox.appendChild(
        head
      );


      dateBox.appendChild(
        body
      );


      container.appendChild(
        dateBox
      );

    }
  );

}


/* =================================================
   單筆回報
================================================= */

function createReportCard(
  report
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "report-card";


  const main =
    document.createElement(
      "div"
    );


  main.className =
    "report-main";


  const left =
    document.createElement(
      "div"
    );


  const truck =
    document.createElement(
      "div"
    );


  truck.className =
    "report-truck";


  truck.textContent =
    report.truck ||
    "—";


  const staff =
    document.createElement(
      "div"
    );


  staff.className =
    "report-staff";


  staff.textContent =
    report.staff ||
    "—";


  const status =
    document.createElement(
      "span"
    );


  const isOK =
    String(
      report.qtyStatus ||
      ""
    ).trim() ===
    "正確";


  status.className =
    "report-status " +
    (
      isOK
        ? "ok"
        : "bad"
    );


  status.textContent =
    isOK
      ? t("qtyCorrect")
      : t("qtyWrong");


  left.appendChild(
    truck
  );


  left.appendChild(
    staff
  );


  left.appendChild(
    status
  );


  const photosBox =
    document.createElement(
      "div"
    );


  photosBox.className =
    "report-photos";


  const photoList =
    Array.isArray(
      report.photos
    )
      ? report.photos
      : [];


  photoList.forEach(
    function(photo){

      if(
        !photo.url
      ){

        return;

      }


      const photoBox =
        document.createElement(
          "div"
        );


      photoBox.className =
        "report-photo";


      const img =
        document.createElement(
          "img"
        );


      img.loading =
        "lazy";


      img.src =
        photo.url;


      img.alt =
        "photo";


      photoBox.appendChild(
        img
      );


      photosBox.appendChild(
        photoBox
      );

    }
  );


  if(
    photoList.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "report-empty-photo";


    empty.textContent =
      t("noPhotos");


    photosBox.appendChild(
      empty
    );

  }


  left.appendChild(
    photosBox
  );


  if(
    report.note
  ){

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "report-note";


    note.textContent =
      report.note;


    left.appendChild(
      note
    );

  }


  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "report-meta";


  meta.textContent =
    (
      t("reportTime") +
      " " +
      (
        report.time ||
        ""
      ) +
      " · " +
      t("reporter") +
      " " +
      (
        report.employee ||
        ""
      )
    );


  left.appendChild(
    meta
  );


  main.appendChild(
    left
  );


  card.appendChild(
    main
  );


  return card;

}


/* =================================================
   當日所有照片
================================================= */

function openDayPhotos(
  date,
  reports
){

  const page =
    document.getElementById(
      "dayPhotoPage"
    );


  const title =
    document.getElementById(
      "dayPhotoTitle"
    );


  const grid =
    document.getElementById(
      "dayPhotoGrid"
    );


  title.textContent =
    formatHistoryDate(
      date
    ) +
    " · " +
    t("todayPhotos");


  grid.innerHTML =
    "";


  const photosForDay =
    [];


  reports.forEach(
    function(report){

      if(
        !Array.isArray(
          report.photos
        )
      ){

        return;

      }


      report.photos.forEach(
        function(photo){

          if(
            photo &&
            photo.url
          ){

            photosForDay.push(
              photo
            );

          }

        }
      );

    }
  );


  if(
    photosForDay.length === 0
  ){

    grid.innerHTML =
      `
      <div class="day-photo-empty">
        ${t("noDayPhotos")}
      </div>
      `;

  }else{

    photosForDay.forEach(
      function(photo){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "day-photo-item";


        const img =
          document.createElement(
            "img"
          );


        img.loading =
          "lazy";


        img.src =
          photo.url;


        item.appendChild(
          img
        );


        grid.appendChild(
          item
        );

      }
    );

  }


  page.classList.add(
    "open"
  );

}
