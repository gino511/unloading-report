<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;

  background:var(--paper);
  color:var(--ink);

  -webkit-tap-highlight-color:transparent;
}

body.uploading{
  overflow:hidden;
}

button,
textarea{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 110px;
}


/* =================================================
   頂部
================================================= */

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:22px;
  padding-bottom:14px;

  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  margin:0;

  font-size:19px;
  letter-spacing:.02em;
}

.brand .who{
  display:block;

  margin-top:5px;

  max-width:160px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:12px;
  color:var(--muted);
}

.top-actions{
  display:flex;
  align-items:center;

  gap:6px;

  flex-shrink:0;
}

.top-btn{
  padding:8px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#fff;
  color:var(--ink);

  font-size:12px;

  white-space:nowrap;
}

.top-btn:active{
  transform:scale(.97);
}


/* =================================================
   語言
================================================= */

.language-screen{
  position:fixed;
  inset:0;

  z-index:1000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:24px;

  background:var(--paper);
}

.language-screen.show{
  display:flex;
}

.language-box{
  width:100%;
  max-width:380px;

  text-align:center;
}

.language-box h2{
  margin:0 0 8px;

  font-size:23px;
}

.language-box p{
  margin:0 0 24px;

  color:var(--muted);

  font-size:13px;
}

.language-options{
  display:grid;
  gap:10px;
}

.language-option{
  width:100%;

  padding:16px;

  border:1.5px solid var(--line);
  border-radius:12px;

  background:#fff;

  color:var(--ink);

  font-size:16px;
  font-weight:700;
}


/* =================================================
   表單
================================================= */

fieldset{
  margin:0 0 22px;
  padding:0;

  border:none;
}

legend{
  margin-bottom:8px;

  color:var(--muted);

  font-size:12px;
  font-weight:700;

  letter-spacing:.12em;
}


/* =================================================
   大車
================================================= */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  position:relative;

  width:100%;

  padding:14px 42px 14px 14px;

  border:1.5px solid var(--line);
  border-radius:10px;

  background:#fff;
  color:var(--ink);

  text-align:left;

  font-size:16px;
}

.truck-arrow{
  position:absolute;

  right:14px;
  top:50%;

  width:18px;
  height:18px;

  display:flex;

  align-items:center;
  justify-content:center;

  transform:translateY(-50%);

  color:#8a8879;

  pointer-events:none;

  transition:transform .2s ease;
}

.truck-arrow svg{
  width:14px;
  height:14px;
}

.truck-select-wrap.open .truck-arrow{
  transform:
    translateY(-50%)
    rotate(180deg);

  color:var(--accent);
}

.truck-dropdown{
  position:absolute;

  z-index:50;

  display:none;

  left:0;
  right:0;

  margin-top:6px;

  overflow:hidden;

  border:1.5px solid var(--line);
  border-radius:12px;

  background:#fff;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;

  overflow-y:auto;
}

.truck-option{
  display:flex;

  align-items:center;

  gap:10px;

  padding:13px 14px;

  border-bottom:1px solid #eee;

  font-size:15px;
}

.truck-option:last-child{
  border-bottom:none;
}

.truck-option input{
  width:20px;
  height:20px;

  accent-color:var(--accent);
}

.truck-option.used{
  background:#f5f4ef;
}

.truck-option.used .truck-name{
  color:#888679;
}

.used-staff{
  margin-left:auto;

  max-width:150px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  padding:3px 7px;

  border-radius:20px;

  background:#e9e7df;
  color:#6f6d62;

  font-size:11px;
}

.truck-dropdown-footer{
  display:flex;

  gap:8px;

  padding:10px;

  border-top:1px solid var(--line);

  background:#faf9f5;
}

.truck-dropdown-footer button{
  flex:1;

  padding:10px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#fff;

  font-size:14px;
}

.truck-dropdown-footer button.primary{
  border-color:var(--ink);

  background:var(--ink);
  color:#fff;
}


/* =================================================
   下貨人員
================================================= */

.staff-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;
}

.staff-item{
  display:flex;

  align-items:center;

  gap:8px;

  padding:13px 10px;

  border:1.5px solid var(--line);
  border-radius:10px;

  background:#fff;

  font-size:15px;
}

.staff-item input{
  width:20px;
  height:20px;

  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);

  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;

  padding:8px 10px;

  border-radius:8px;

  background:var(--accent-dim);

  color:var(--accent);

  font-size:12px;
  line-height:1.5;
}


/* =================================================
   件數
================================================= */

.seg{
  display:flex;

  gap:8px;
}

.seg button{
  flex:1;

  padding:14px 0;

  border:1.5px solid var(--line);
  border-radius:10px;

  background:#fff;
  color:var(--ink);

  font-size:15px;
  font-weight:700;
}

.seg button[data-v="ok"].active{
  border-color:var(--accent);

  background:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  border-color:var(--warn);

  background:var(--warn);
  color:#fff;
}


/* =================================================
   照片
================================================= */

textarea{
  width:100%;

  min-height:80px;

  padding:12px;

  border:1.5px solid var(--line);
  border-radius:10px;

  background:#fff;

  color:var(--ink);

  font-size:16px;

  resize:vertical;
}

textarea:focus{
  outline:none;

  border-color:var(--accent);
}

.photo-upload{
  position:relative;

  padding:18px;

  border:1.5px dashed var(--line);
  border-radius:12px;

  background:#fff;

  color:#8a8879;

  text-align:center;
}

.photo-upload span.icon{
  display:block;

  margin-bottom:6px;

  font-size:30px;
}

.photo-upload input{
  position:absolute;
  inset:0;

  opacity:0;

  cursor:pointer;
}

.photo-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:12px;
}

.thumb{
  position:relative;

  aspect-ratio:1;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:8px;

  background:#eee;
}

.thumb img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.thumb .rm{
  position:absolute;

  top:3px;
  right:3px;

  width:24px;
  height:24px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:none;
  border-radius:50%;

  background:rgba(0,0,0,.65);

  color:#fff;

  font-size:13px;
}

.hint{
  margin-top:6px;

  color:#9a988c;

  font-size:12px;
}


/* =================================================
   進度視窗
================================================= */

.upload-progress-screen{
  position:fixed;
  inset:0;

  z-index:9000;

  display:none;

  align-items:flex-start;
  justify-content:center;

  padding:
    12vh
    22px
    22px;

  background:
    rgba(28,31,26,.52);

  backdrop-filter:
    blur(4px);

  -webkit-backdrop-filter:
    blur(4px);
}

.upload-progress-screen.open{
  display:flex;
}

.upload-progress-box{
  width:100%;
  max-width:360px;

  padding:22px 20px 20px;

  border-radius:16px;

  background:#fff;

  box-shadow:
    0 18px 50px rgba(0,0,0,.22);
}

.upload-progress-stage{
  display:flex;

  justify-content:center;

  gap:6px;

  margin-bottom:12px;
}

.upload-progress-stage span{
  padding:4px 9px;

  border-radius:999px;

  background:#f0eee6;

  color:#a3a091;

  font-size:10px;
  font-weight:700;
}

.upload-progress-stage span.active{
  background:var(--accent);

  color:#fff;
}

.upload-progress-stage span.done{
  background:var(--accent-dim);

  color:var(--accent);
}

.upload-progress-title{
  margin-bottom:6px;

  font-size:17px;
  font-weight:800;

  text-align:center;
}

.upload-progress-count{
  min-height:20px;

  color:var(--muted);

  font-size:13px;

  text-align:center;
}

.upload-progress-track{
  width:100%;
  height:10px;

  margin-top:17px;

  overflow:hidden;

  border-radius:999px;

  background:#e8e5dc;
}

.upload-progress-fill{
  width:0%;
  height:100%;

  border-radius:999px;

  background:var(--accent);

  transition:
    width .25s ease;
}

.upload-progress-text{
  min-height:18px;

  margin-top:11px;

  color:var(--muted);

  font-size:12px;

  text-align:center;
}


/* =================================================
   回報紀錄
================================================= */

.history-screen{
  position:fixed;
  inset:0;

  z-index:200;

  display:none;

  overflow-y:auto;

  background:var(--paper);
}

.history-screen.open{
  display:block;
}

.history-wrap{
  max-width:480px;

  margin:0 auto;

  padding:18px 18px 40px;
}

.history-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:16px;
  padding-bottom:14px;

  border-bottom:2px solid var(--ink);
}

.history-header h2{
  margin:0;

  font-size:19px;
}

.history-close{
  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#fff;

  font-size:13px;
}

.history-loading,
.history-empty{
  padding:30px 0;

  color:var(--muted);

  font-size:14px;

  text-align:center;
}

.history-day{
  margin-bottom:8px;

  border-bottom:1px solid var(--line);
}

.history-day-head{
  width:100%;

  display:flex;

  align-items:center;

  gap:8px;

  padding:14px 0;

  border:none;

  background:transparent;

  color:var(--ink);

  text-align:left;
}

.history-arrow{
  width:22px;

  font-size:16px;

  transition:
    transform .2s ease;
}

.history-day.open .history-arrow{
  transform:rotate(90deg);
}

.history-date{
  font-size:17px;
  font-weight:800;
}

.history-photo-all{
  margin-left:auto;

  padding:7px 9px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#fff;

  font-size:11px;

  white-space:nowrap;
}

.history-day-body{
  display:none;

  padding-bottom:14px;
}

.history-day.open .history-day-body{
  display:block;
}


/* =================================================
   回報卡片
================================================= */

.report-card{
  margin-top:9px;

  padding:13px;

  border:1px solid var(--line);
  border-radius:12px;

  background:#fff;
}

.report-main{
  display:flex;

  align-items:center;

  gap:8px;

  min-width:0;
}

.report-truck{
  min-width:0;

  overflow:hidden;

  font-size:20px;
  font-weight:900;

  line-height:1.15;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.report-staff{
  min-width:0;

  overflow:hidden;

  color:#555;

  font-size:13px;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.report-status{
  margin-left:auto;

  flex-shrink:0;

  font-size:12px;
  font-weight:800;

  white-space:nowrap;
}

.report-status.ok{
  color:var(--accent);
}

.report-status.bad{
  color:var(--warn);
}

.report-time{
  margin-top:6px;

  color:#9a988c;

  font-size:11px;
}

.report-note{
  margin-top:8px;

  padding:8px;

  border-radius:8px;

  background:#f7f5ef;

  font-size:12px;

  line-height:1.5;
}


/* =================================================
   回報紀錄照片
   四格、無外框、直接填滿
================================================= */

.report-photos{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:6px;

  margin-top:10px;
}

.report-photo{
  position:relative;

  width:100%;

  aspect-ratio:1;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:none;
  border-radius:7px;

  background:transparent;

  cursor:pointer;
}

.report-photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.report-photo.loading::after{
  content:"";

  position:absolute;

  width:14px;
  height:14px;

  border:2px solid rgba(255,255,255,.7);
  border-top-color:var(--accent);
  border-radius:50%;

  animation:
    thumbnailSpin .7s linear infinite;
}

@keyframes thumbnailSpin{
  to{
    transform:rotate(360deg);
  }
}

.report-no-photo{
  margin-top:8px;

  color:#aaa;

  font-size:11px;
}


/* =================================================
   卡片底部
================================================= */

.report-footer{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:10px;
  padding-top:9px;

  border-top:1px solid #eee;
}

.report-employee{
  min-width:0;

  overflow:hidden;

  color:#8a8879;

  font-size:11px;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.report-delete{
  margin-left:auto;

  padding:6px 10px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#fff;

  color:var(--warn);

  font-size:11px;
}


/* =================================================
   當日全部照片
   三格、無外框、直接填滿
================================================= */

.all-photo-screen{
  position:fixed;
  inset:0;

  z-index:400;

  display:none;

  overflow-y:auto;

  background:
    rgba(20,20,18,.97);
}

.all-photo-screen.open{
  display:block;
}

.all-photo-wrap{
  max-width:600px;

  margin:0 auto;

  padding:16px 14px 40px;
}

.all-photo-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:15px;

  color:#fff;
}

.all-photo-head h3{
  margin:0;

  font-size:18px;
}

.all-photo-close{
  padding:7px 10px;

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius:8px;

  background:
    rgba(255,255,255,.08);

  color:#fff;
}

.all-photo-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:6px;
}

.all-photo-item{
  position:relative;

  width:100%;

  aspect-ratio:1;

  overflow:hidden;

  border:none;
  border-radius:7px;

  background:transparent;

  cursor:pointer;
}

.all-photo-item img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}


/* =================================================
   Lightbox
================================================= */

.lightbox{
  position:fixed;
  inset:0;

  z-index:600;

  display:none;

  align-items:center;
  justify-content:center;

  padding:15px;

  background:
    rgba(0,0,0,.94);
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:100%;
  max-height:90vh;

  object-fit:contain;
}

.lightbox-close{
  position:absolute;

  top:15px;
  right:15px;

  width:38px;
  height:38px;

  border:
    1px solid
    rgba(255,255,255,.3);

  border-radius:50%;

  background:
    rgba(255,255,255,.1);

  color:#fff;

  font-size:20px;
}


/* =================================================
   送出
================================================= */

.submit-bar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  padding:
    12px
    18px
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid
    var(--line);

  background:var(--paper);
}

.submit-bar .inner{
  max-width:480px;

  margin:0 auto;
}

button.submit{
  width:100%;

  padding:15px 0;

  border:none;
  border-radius:12px;

  background:var(--ink);

  color:#fff;

  font-size:16px;
  font-weight:700;
}

button.submit:disabled{
  background:#a3a091;
}

.status{
  min-height:16px;

  margin-top:8px;

  color:var(--muted);

  font-size:13px;

  text-align:center;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;

  color:var(--muted);

  font-size:14px;

  text-align:center;
}

</style>

</head>


<body>


<!-- =================================================
     語言
================================================= -->

<div
  class="language-screen"
  id="languageScreen"
>

  <div class="language-box">

    <h2>
      選擇語言
    </h2>

    <p>
      Choose your language
    </p>

    <div class="language-options">

      <button
        type="button"
        class="language-option"
        data-lang="zh"
      >
        中文
      </button>

      <button
        type="button"
        class="language-option"
        data-lang="vi"
      >
        Tiếng Việt
      </button>

    </div>

  </div>

</div>


<!-- =================================================
     主畫面
================================================= -->

<div class="wrap">

  <div class="brand">

    <div class="brand-left">

      <h1 data-i18n="title">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>


    <div class="top-actions">

      <button
        type="button"
        class="top-btn"
        id="historyBtn"
      >
        📋 回報紀錄
      </button>

      <button
        type="button"
        class="top-btn"
        id="languageBtn"
      >
        中文
      </button>

    </div>

  </div>


  <!-- 大車 -->

  <fieldset>

    <legend data-i18n="truck">
      大車
    </legend>


    <div
      class="truck-select-wrap"
      id="truckSelectWrap"
    >

      <button
        type="button"
        class="truck-select-button"
        id="truckSelectButton"
      >

        <span id="truckSelectText">
          大車載入中…
        </span>

        <span class="truck-arrow">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <polyline
              points="6 9 12 15 18 9"
            ></polyline>

          </svg>

        </span>

      </button>


      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >

          <div class="loading">
            大車資料載入中…
          </div>

        </div>


        <div class="truck-dropdown-footer">

          <button
            type="button"
            id="truckClearBtn"
            data-i18n="clear"
          >
            清除
          </button>

          <button
            type="button"
            class="primary"
            id="truckDoneBtn"
            data-i18n="done"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>

/* =================================================
   GET
================================================= */

async function getBackend(
  type
){

  const response =
    await fetch(
      BACKEND_URL +
      "?type=" +
      encodeURIComponent(
        type
      ) +
      "&t=" +
      Date.now(),
      {

        method:
          "GET",

        cache:
          "no-store"

      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "後端沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "後端資料取得失敗"
    );

  }


  return result;

}

/* =================================================
   大車
================================================= */

function formatTruckTime(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  const text =
    String(
      value
    ).trim();


  if(!text){

    return "";

  }


  const match =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if(match){

    return (
      String(
        match[1]
      ).padStart(
        2,
        "0"
      ) +
      ":" +
      match[2]
    );

  }


  const date =
    new Date(
      text
    );


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return (
      String(
        date.getHours()
      ).padStart(
        2,
        "0"
      ) +
      ":" +
      String(
        date.getMinutes()
      ).padStart(
        2,
        "0"
      )
    );

  }


  return "";

}


function getTruckUsage(
  truckName
){

  const data =
    truckLastUsed[
      truckName
    ];


  if(!data){

    return null;

  }


  return {

    time:
      formatTruckTime(
        data.time
      ),

    staff:
      String(
        data.staff ||
        ""
      ).trim()

  };

}


function sortedTrucks(){

  return truckData

    .map(
      function(
        truck,
        index
      ){

        return {

          truck:
            truck,

          originalIndex:
            index

        };

      }
    )

    .sort(
      function(
        a,
        b
      ){

        const truckA =
          a.truck;


        const truckB =
          b.truck;


        const fixedA =
          truckA.fixed ===
          true;


        const fixedB =
          truckB.fixed ===
          true;


        if(
          fixedA !==
          fixedB
        ){

          return fixedA
            ? -1
            : 1;

        }


        if(
          fixedA &&
          fixedB
        ){

          return (
            a.originalIndex -
            b.originalIndex
          );

        }


        const usageA =
          getTruckUsage(
            truckA.name
          );


        const usageB =
          getTruckUsage(
            truckB.name
          );


        const usedA =
          Boolean(
            usageA &&
            usageA.staff
          );


        const usedB =
          Boolean(
            usageB &&
            usageB.staff
          );


        if(
          usedA !==
          usedB
        ){

          return usedA
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )

    .map(
      function(item){

        return item.truck;

      }
    );

}


function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  list.innerHTML =
    "";


  const trucks =
    sortedTrucks();


  if(
    trucks.length ===
    0
  ){

    list.innerHTML =
      '<div class="loading">目前沒有啟用中的大車</div>';


    updateTruckButtonText();

    return;

  }


  trucks.forEach(
    function(truck){

      const usage =
        getTruckUsage(
          truck.name
        );


      const isUsed =
        Boolean(
          usage &&
          usage.staff
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "truck-option" +
        (
          isUsed
            ? " used"
            : ""
        );


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        truck.name;


      checkbox.checked =
        selectedTrucks.has(
          truck.name
        );


      checkbox.addEventListener(
        "change",
        function(){

          if(
            checkbox.checked
          ){

            selectedTrucks.add(
              truck.name
            );

          }else{

            selectedTrucks.delete(
              truck.name
            );

          }


          updateTruckButtonText();

        }
      );


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "truck-name";


      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );


      label.appendChild(
        name
      );


      if(
        isUsed &&
        usage.staff
      ){

        const staffTag =
          document.createElement(
            "span"
          );


        staffTag.className =
          "used-staff";


        staffTag.textContent =
          usage.staff;


        label.appendChild(
          staffTag
        );

      }


      list.appendChild(
        label
      );

    }
  );


  updateTruckButtonText();

}


function updateTruckButtonText(){

  const textElement =
    document.getElementById(
      "truckSelectText"

  const names =
    Array.from(
      selectedTrucks

  if(
    names.length ===

    textElement.textContent =
      "請選擇大車…";

    return;

  }


  if(
    names.length ===
    1
  ){

    textElement.textContent =
      names[0];

    return;

  }


  textElement.textContent =
    "已選 " +
    names.length +
    " 台：" +
    names.join(
      "、"
    );

}

    "none";

    !userName ||
    userName ===
    "未知使用者"

  const currentUser =
    String(
      userName
    )
      .trim()
      .toLowerCase();


  const matched =
    staffData.find(
      function(staff){

        const lineName =
          String(
            staff.lineName ||
            ""
          )
            .trim()
            .toLowerCase();


        return (
          lineName &&
          lineName ===
          currentUser
        );

      }
    );


  if(!matched){

  }


  const inputs =
    document.querySelectorAll(
      "#staffGrid input[type=checkbox]"

    function(input){

      if(
        String(
          input.value
        ).trim() ===
        String(
          matched.name
        ).trim()
      ){

        target =
          input;

      }

    }
  );


  if(!target){

    return;

  }


  target.checked =
    true;


  const item =
    target.closest(
      ".staff-item"
    );


  if(item){

    t(
      "lineMatch"
    )
      .replace(
        "{user}",

      .replace(

        matched.name

/* =================================================
   照片處理
================================================= */

function readFileAsDataURL(
  file
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          resolve(
            event.target.result
          );

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "照片讀取失敗"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function compressDataURL(
  rawDataUrl,
  maxW,
  quality
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const img =
        new Image();


      img.onload =
        function(){

          try{

            const scale =
              Math.min(
                1,
                maxW /
                img.width
              );


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              Math.round(
                img.width *
                scale
              );


            canvas.height =
              Math.round(
                img.height *
                scale
              );


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              canvas.width,
              canvas.height
            );


            resolve(
              canvas.toDataURL(
                "image/jpeg",
                quality
              )
            );


          }catch(error){

            reject(
              error
            );

          }

        };


      img.onerror =
        function(){

          reject(
            new Error(
              "照片解析失敗"
            )
          );

        };


      img.src =
        rawDataUrl;

    }
  );

}


/* =================================================
   選照片
================================================= */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      if(
        isSubmitting
      ){

        event.target.value =
          "";

        return;

      }


      const files =
        [
          ...event.target.files
        ]
        .filter(
          function(file){

            return file.type.startsWith(
              "image/"
            );

          }
        );


      if(
        files.length ===
        0
      ){

        event.target.value =
          "";

        return;

      }


      const total =
        files.length;


      showUploadProgress();


      try{

        for(
          let i = 0;
          i < total;
          i++
        ){

          setProgressStage(
            "process"
          );


          updateUploadProgress(
            t(
              "processingPhoto"
            ),
            (
              i /
              total
            ) *
            35,
            t(
              "processingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            total
          );


          const rawData =
            await readFileAsDataURL(
              files[i]
            );


          await new Promise(
            function(resolve){

              requestAnimationFrame(
                resolve
              );

            }
          );


          setProgressStage(
            "compress"
          );


          updateUploadProgress(
            t(
              "compressingPhoto"
            ),
            35 +
            (
              i /
              total
            ) *
            60,
            t(
              "compressingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            total
          );


          const compressed =
            await compressDataURL(
              rawData,
              1200,
              0.72
            );


          photos.push(
            compressed
          );


          updateUploadProgress(
            t(
              "compressingPhoto"
            ),
            35 +
            (
              (
                i + 1
              ) /
              total
            ) *
            60,
            t(
              "compressingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            total
          );


          await new Promise(
            function(resolve){

              requestAnimationFrame(
                resolve
              );

            }
          );

        }


        renderPhotoGrid();


        await new Promise(
          function(resolve){

            setTimeout(
              resolve,
              180
            );

          }
        );


        hideUploadProgress();


        setStatus(
          "",
          ""
        );


      }catch(error){

        console.error(
          error
        );


        hideUploadProgress();


        setStatus(
          t(
            "uploadFail"
          ) +
          "：" +
          (
            error.message ||
            error
          ),
          "err"
        );

      }


      event.target.value =
        "";

    }
  );

/* =================================================
   POST
================================================= */

async function postBackend(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:
          "POST",

        headers:{

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "Apps Script 執行失敗"
    );

  }


  return result;

}

function groupReportsByDate(){

  const groups =
    {};


  reportData.forEach(
    function(report){

      const date =
        report.date ||
        "未知日期";


      if(
        !groups[
          date
        ]
      ){

        groups[
          date
        ] =
          [];

      }


      groups[
        date
      ].push(
        report
      );

    }
  );


  return groups;

}


function formatDateLabel(
  date
){

  if(
    !date
  ){

    return "";

  }


  const parts =
    date.split(
      "-"
    );


  if(
    parts.length !==
    3
  ){

    return date;

  }


  return (
    parts[0] +
    "/" +
    parts[1] +
    "/" +
    parts[2]
  );

}

      .sort(

        ){

          return b.localeCompare(

    0
  ){

    content.innerHTML =
      '<div class="history-empty">' +
      t(

        }
      );


      head.appendChild(

      head.appendChild(

      const body =

function getThumbnailUrl(
  photo
){

  if(
    photo &&
    photo.thumbnailUrl
  ){

    return photo.thumbnailUrl;

  }


  if(
    photo &&
    photo.thumbnail
  ){

    return photo.thumbnail;

  }


  if(
    photo &&
    photo.id
  ){

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(
        photo.id
      ) +
      "&sz=w320"
    );

  }


  return (
    photo &&
    photo.url
      ? photo.url
      : ""
  );

}


function getFullPhotoUrl(
  photo
){

  if(
    photo &&
    photo.url
  ){

    return photo.url;

  }


  if(
    photo &&
    photo.id
  ){

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(
        photo.id
      ) +
      "&sz=w1600"
    );

  }


  return getThumbnailUrl(
    photo
  );

}

    "正確";


  status.className =
    "report-status " +
    (
      isOK
        ? "ok"
        : "bad"
    );


  status.textContent =
    isOK
      ? "✓ 正確"
      : "✗ " +
        (
          report.qtyStatus ||
          "有多有少"
        );


  main.appendChild(
    truck
  );


  if(
    report.staff
  ){

    main.appendChild(
      staff
    );

  }


  main.appendChild(
    status
  );


  card.appendChild(
    main
  );


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "report-time";


  time.textContent =
    report.time ||
    "";


  card.appendChild(
    time
  );


  if(
    Array.isArray(
      report.photos
    ) &&
    report.photos.length >
    0
  ){

    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "report-photos";


    report.photos.forEach(
      function(photo){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "report-photo loading";


        const img =
          document.createElement(
            "img"
          );


        const thumbnailUrl =
          getThumbnailUrl(
            photo
          );


        const fullUrl =
          getFullPhotoUrl(
            photo
          );


        img.src =
          thumbnailUrl;


        img.decoding =
          "async";


        img.alt =
          photo.name ||
          "";


        let fallbackUsed =
          false;


        img.addEventListener(
          "load",
          function(){

            item.classList.remove(
              "loading"
            );

          }
        );


        img.addEventListener(
          "error",
          function(){

            if(
              !fallbackUsed &&
              fullUrl &&
              fullUrl !==
              thumbnailUrl
            ){

              fallbackUsed =
                true;


              img.src =
                fullUrl;


            }else{

              item.classList.remove(
                "loading"
              );

            }

          }
        );


        item.addEventListener(
          "click",
          function(){

            openLightbox(
              fullUrl ||
              thumbnailUrl
            );

          }
        );


        item.appendChild(
          img
        );


        grid.appendChild(
          item
        );

      }
    );


    card.appendChild(
      grid
    );


  }else{

    const noPhoto =
      document.createElement(
        "div"
      );


    noPhoto.className =
      "report-no-photo";


    noPhoto.textContent =
      t(
        "noPhotos"
      );


    card.appendChild(
      noPhoto
    );

  }


  if(
    report.note
  ){

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "report-note";


    note.textContent =
      report.note;


    card.appendChild(
      note
    );

  }


  const footer =
    document.createElement(
      "div"
    );


  footer.className =
    "report-footer";


  const employee =
    document.createElement(
      "div"
    );


  employee.className =
    "report-employee";


  employee.textContent =
    report.employee
      ? "回報人：" +
        report.employee
      : "";


  footer.appendChild(
    employee
  );


  if(
    String(
      report.employee ||
      ""
    ).trim() ===
    String(
      userName ||
      ""
    ).trim()
  ){

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.type =
      "button";


    deleteButton.className =
      "report-delete";


    deleteButton.textContent =
      t(
        "delete"
      );


    deleteButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();


        deleteReportFromHistory(
          report,
          deleteButton
        );

      }
    );


    footer.appendChild(
      deleteButton
    );

  }


  card.appendChild(
    footer
  );


  return card;

}


/* =================================================
   刪除
================================================= */

async function deleteReportFromHistory(
  report,
  button
){

  if(
    !confirm(
      t(
        "deleteConfirm"
      )
    )
  ){

    return;

  }


  button.disabled =
    true;


  button.textContent =
    t(
      "deleting"
    );


  try{

    await postBackend({

      action:
        "deleteReport",

      row:
        report.row,

      user:
        userName

    });


    reportData =
      reportData.filter(
        function(item){

          return (
            item.row !==
            report.row
          );

        }
      );


    renderHistory();


  }catch(error){

    console.error(
      error
    );


    button.disabled =
      false;


    button.textContent =
      t(
        "delete"
      );


    alert(
      error.message ||
      "刪除失敗"
    );

  }

}


/* =================================================
   當日全部照片
================================================= */

function showAllDayPhotos(
  date,
  reports
){

  const screen =
    document.getElementById(
      "allPhotoScreen"
    );


  const title =
    document.getElementById(
      "allPhotoTitle"
    );


  const grid =
    document.getElementById(
      "allPhotoGrid"
    );


  title.textContent =
    formatDateLabel(
      date
    ) +
    " · " +
    t(
      "allPhotos"
    );


  grid.innerHTML =
    "";


  let count =
    0;


  reports.forEach(
    function(report){

      if(
        !Array.isArray(
          report.photos
        )
      ){

        return;

      }


      report.photos.forEach(
        function(photo){

          count++;


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "all-photo-item";


          const img =
            document.createElement(
              "img"
            );


          const thumb =
            getThumbnailUrl(
              photo
            );


          const full =
            getFullPhotoUrl(
              photo
            );


          img.src =
            thumb;


          img.decoding =
            "async";


          img.addEventListener(
            "click",
            function(){

              openLightbox(
                full ||
                thumb
              );

            }
          );


          item.appendChild(
            img
          );


          grid.appendChild(
            item
          );

        }
      );

    }
  );


  if(
    count ===
    0
  ){

    grid.innerHTML =
      '<div style="color:#aaa;padding:30px;text-align:center;grid-column:1/-1;">' +
      t(
        "noDayPhotos"
      ) +
      "</div>";

  }


  screen.classList.add(
    "open"
  );

}


document
  .getElementById(
    "allPhotoClose"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "allPhotoScreen"
        )
        .classList.remove(
          "open"
        );

    }
  );


/* =================================================
   Lightbox
================================================= */

function openLightbox(
  url
){

  if(
    !url
  ){

    return;

  }


  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    url;


  document
    .getElementById(
      "lightbox"
    )
    .classList.add(
      "open"
    );

}


function closeLightbox(){

  document
    .getElementById(
      "lightbox"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    "";

}


document
  .getElementById(
    "lightboxClose"
  )
  .addEventListener(
    "click",
    closeLightbox
  );


document
  .getElementById(
    "lightbox"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        this
      ){

        closeLightbox();

      }

    }
  );


/* =================================================
   啟動
================================================= */

async function init(){

  if(
    !currentLanguage
  ){

    currentLanguage =
      "zh";


    applyLanguage();


    showLanguageScreen();


  }else{

    applyLanguage();

  }


  document
    .getElementById(
      "truckSelectText"
    )
    .textContent =
    "大車載入中…";


  const loginOK =
    await initLIFF();


  if(
    !loginOK
  ){

    return;

  }


  await loadSystemData();

}


init();

</script>
