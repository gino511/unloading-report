<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;

  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

body.uploading{
  overflow:hidden;
}

button,
textarea{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 110px;
}


/* =================================================
   頂部
================================================= */

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:22px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  margin:0;
  font-size:19px;
}

.who{
  display:block;
  margin-top:5px;
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--muted);
  font-size:12px;
}

.top-actions{
  display:flex;
  gap:6px;
}

.top-btn{
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:var(--ink);
  font-size:12px;
}


/* =================================================
   語言
================================================= */

.language-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--paper);
}

.language-screen.show{
  display:flex;
}

.language-box{
  width:100%;
  max-width:380px;
  text-align:center;
}

.language-box h2{
  margin:0 0 8px;
}

.language-box p{
  color:var(--muted);
}

.language-options{
  display:grid;
  gap:10px;
}

.language-option{
  padding:16px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:700;
}


/* =================================================
   編輯提示
================================================= */

.edit-banner{
  display:none;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
  padding:11px 12px;
  border:1px solid #cad9ce;
  border-radius:10px;
  background:var(--accent-dim);
}

.edit-banner.show{
  display:flex;
}

.edit-banner-text{
  flex:1;
  color:var(--accent);
  font-size:13px;
  font-weight:700;
}

.edit-cancel{
  padding:7px 10px;
  border:1px solid #b6cbbb;
  border-radius:8px;
  background:#fff;
  color:var(--accent);
  font-size:12px;
}


/* =================================================
   表單
================================================= */

fieldset{
  margin:0 0 22px;
  padding:0;
  border:none;
}

legend{
  margin-bottom:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
}


/* =================================================
   大車
================================================= */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  position:relative;
  width:100%;
  padding:14px 42px 14px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  font-size:16px;
}

.truck-arrow{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  pointer-events:none;
  transition:.2s;
}

.truck-arrow svg{
  width:100%;
  height:100%;
}

.truck-select-wrap.open .truck-arrow{
  transform:
    translateY(-50%)
    rotate(180deg);
}

.truck-dropdown{
  position:absolute;
  z-index:50;
  display:none;
  left:0;
  right:0;
  margin-top:6px;
  overflow:hidden;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border-bottom:1px solid #eee;
}

.truck-option:last-child{
  border-bottom:none;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f1efe8;
}

.truck-option.used .truck-name{
  color:#99968a;
}

.used-staff{
  margin-left:auto;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding:3px 7px;
  border-radius:20px;
  background:#e7e4dc;
  color:#747166;
  font-size:11px;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--line);
}

.truck-dropdown-footer button{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}

.truck-dropdown-footer .primary{
  border-color:var(--ink);
  background:var(--ink);
  color:#fff;
}


/* =================================================
   人員
================================================= */

.staff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.staff-grid > .loading{
  grid-column:1 / -1;
  width:100%;
  text-align:center;
}

.staff-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 10px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:var(--accent-dim);
  color:var(--accent);
  font-size:12px;
}


/* =================================================
   件數
================================================= */

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;
  padding:14px 0;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font-weight:700;
}

.seg button[data-v="ok"].active{
  border-color:var(--accent);
  background:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  border-color:var(--warn);
  background:var(--warn);
  color:#fff;
}


/* =================================================
   照片
================================================= */

.photo-upload{
  position:relative;
  padding:18px;
  border:1.5px dashed var(--line);
  border-radius:12px;
  background:#fff;
  color:#8a8879;
  text-align:center;
}

.photo-upload .icon{
  display:block;
  margin-bottom:6px;
  font-size:30px;
}

.photo-upload input{
  position:absolute;
  inset:0;
  opacity:0;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.thumb{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:8px;
  background:#eee;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.thumb .rm{
  position:absolute;
  top:3px;
  right:3px;
  width:24px;
  height:24px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
}

.thumb-badge{
  position:absolute;
  left:4px;
  bottom:4px;
  padding:3px 6px;
  border-radius:999px;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:9px;
}

.hint{
  margin-top:6px;
  color:#99968a;
  font-size:12px;
}

textarea{
  width:100%;
  min-height:80px;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:16px;
}


/* =================================================
   進度
================================================= */

.upload-progress-screen{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:12vh 22px 22px;
  background:rgba(28,31,26,.52);
  backdrop-filter:blur(4px);
}

.upload-progress-screen.open{
  display:flex;
}

.upload-progress-box{
  width:100%;
  max-width:360px;
  padding:22px 20px;
  border-radius:16px;
  background:#fff;
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}

.upload-progress-stage{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-bottom:12px;
}

.upload-progress-stage span{
  padding:4px 9px;
  border-radius:999px;
  background:#f0eee6;
  color:#a3a091;
  font-size:10px;
  font-weight:700;
}

.upload-progress-stage span.active{
  background:var(--accent);
  color:#fff;
}

.upload-progress-stage span.done{
  background:var(--accent-dim);
  color:var(--accent);
}

.upload-progress-title{
  font-weight:800;
  text-align:center;
}

.upload-progress-count{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.upload-progress-track{
  height:10px;
  margin-top:17px;
  overflow:hidden;
  border-radius:999px;
  background:#e8e5dc;
}

.upload-progress-fill{
  width:0;
  height:100%;
  border-radius:999px;
  background:var(--accent);
  transition:width .25s;
}

.upload-progress-text{
  margin-top:11px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}


/* =================================================
   回報紀錄
================================================= */

.history-screen{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  overflow-y:auto;
  background:var(--paper);
}

.history-screen.open{
  display:block;
}

.history-wrap{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 40px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.history-header h2{
  margin:0;
}

.history-close{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
}

.history-loading,
.history-empty{
  padding:30px 0;
  color:var(--muted);
  text-align:center;
}

.history-day{
  border-bottom:1px solid var(--line);
}

.history-day-head{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  padding:14px 0;
}

.history-toggle{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0;
  border:none;
  background:transparent;
  color:var(--ink);
  text-align:left;
}

.history-arrow{
  width:22px;
  transition:.2s;
}

.history-day.open .history-arrow{
  transform:rotate(90deg);
}

.history-date{
  font-size:17px;
  font-weight:800;
}

.history-photo-all{
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:11px;
}

.history-day-body{
  display:none;
  padding-bottom:14px;
}

.history-day.open .history-day-body{
  display:block;
}

.day-loading{
  padding:18px;
  color:var(--muted);
  text-align:center;
}


/* =================================================
   回報卡片
================================================= */

.report-card{
  margin-top:9px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.report-main{
  display:block;
  width:100%;
  min-width:0;
}

.report-truck{
  display:block;
  width:100%;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  font-size:20px;
  font-weight:900;
  line-height:1.2;
}

.report-staff{
  display:block;
  width:100%;
  min-width:0;
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  color:#555;
  font-size:13px;
  line-height:1.3;
  text-align:right;
}

.report-status{
  flex-shrink:0;
  margin:0;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.report-status.ok{
  color:var(--accent);
}

.report-status.bad{
  color:var(--warn);
}

.report-note{
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  background:#f7f5ef;
  font-size:12px;
}


/* =================================================
   四格縮圖
================================================= */

.report-photos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.report-photo{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:7px;
}

.report-photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}


/* =================================================
   卡片底部
   日期 / 回報人 / 狀態 / 編輯 / 刪除 同一行
================================================= */

.report-footer{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto auto;
  align-items:center;
  column-gap:8px;
  width:100%;
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid #eee;
  white-space:nowrap;
}

.report-footer-time{
  min-width:0;
  color:#9a988c;
  font-size:10px;
  white-space:nowrap;
}

.report-employee{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  color:#8a8879;
  font-size:10px;
  text-align:center;
}

.report-footer .report-status{
  margin:0;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.report-footer .report-status.ok{
  color:var(--accent);
}

.report-footer .report-status.bad{
  color:var(--warn);
}

.report-actions{
  display:contents;
}

.report-edit,
.report-delete{
  padding:5px 7px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  font-size:10px;
  white-space:nowrap;
}

.report-edit{
  color:var(--accent);
}

.report-delete{
  color:var(--warn);
}


/* =================================================
   當日照片
================================================= */

.all-photo-screen{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  overflow-y:auto;
  background:rgba(20,20,18,.97);
}

.all-photo-screen.open{
  display:block;
}

.all-photo-wrap{
  max-width:600px;
  margin:0 auto;
  padding:16px 14px 40px;
}

.all-photo-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
  color:#fff;
}

.all-photo-close{
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
  background:rgba(255,255,255,.08);
  color:#fff;
}

.all-photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.all-photo-item{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:7px;
}

.all-photo-item img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}


/* =================================================
   Lightbox
================================================= */

.lightbox{
  position:fixed;
  inset:0;
  z-index:600;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.94);
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

.lightbox-close{
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:50%;
  background:rgba(255,255,255,.1);
  color:#fff;
}


/* =================================================
   送出
================================================= */

.submit-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:
    12px 18px
    calc(
      12px +
      env(safe-area-inset-bottom)
    );
  border-top:1px solid var(--line);
  background:var(--paper);
}

.submit-bar .inner{
  max-width:480px;
  margin:0 auto;
}

.submit{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

.submit:disabled{
  background:#aaa79a;
}

.status{
  min-height:16px;
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;
  color:var(--muted);
  text-align:center;
}

</style>

</head>


<body>


<div
  class="language-screen"
  id="languageScreen"
>

  <div class="language-box">

    <h2>選擇語言</h2>

    <p>Choose your language</p>

    <div class="language-options">

      <button
        type="button"
        class="language-option"
        data-lang="zh"
      >
        中文
      </button>

      <button
        type="button"
        class="language-option"
        data-lang="vi"
      >
        Tiếng Việt
      </button>

    </div>

  </div>

</div>


<div class="wrap">

  <div class="brand">

    <div class="brand-left">

      <h1 data-i18n="title">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>

    <div class="top-actions">

      <button
        type="button"
        class="top-btn"
        id="historyBtn"
      >
        📋 回報紀錄
      </button>

      <button
        type="button"
        class="top-btn"
        id="languageBtn"
      >
        中文
      </button>

    </div>

  </div>


  <div
    class="edit-banner"
    id="editBanner"
  >

    <div
      class="edit-banner-text"
      id="editBannerText"
    >
      正在編輯回報
    </div>

    <button
      type="button"
      class="edit-cancel"
      id="editCancelBtn"
    >
      取消編輯
    </button>

  </div>


  <fieldset>

    <legend data-i18n="truck">
      大車
    </legend>

    <div
      class="truck-select-wrap"
      id="truckSelectWrap"
    >

      <button
        type="button"
        class="truck-select-button"
        id="truckSelectButton"
      >

        <span id="truckSelectText">
          大車載入中…
        </span>

        <span class="truck-arrow">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline
              points="6 9 12 15 18 9"
            />
          </svg>

        </span>

      </button>

      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >

          <div class="loading">
            大車資料載入中…
          </div>

        </div>

        <div class="truck-dropdown-footer">

          <button
            type="button"
            id="truckClearBtn"
            data-i18n="clear"
          >
            清除
          </button>

          <button
            type="button"
            class="primary"
            id="truckDoneBtn"
            data-i18n="done"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>


  <fieldset>

    <legend data-i18n="staff">
      下貨人員
    </legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >

      <div class="loading">
        下貨人員資料載入中…
      </div>

    </div>

    <div
      class="line-match-hint"
      id="lineMatchHint"
      style="display:none;"
    ></div>

/* =================================================
   API
================================================= */

async function getBackend(
  type,
  extra
){

  const params =
    new URLSearchParams();


  params.set(
    "type",
    type
  );


  params.set(
    "t",
    Date.now()
  );


  if (
    extra
  ) {

    Object.keys(
      extra
    ).forEach(
      function(key){

        params.set(
          key,
          extra[key]
        );

      }
    );

  }


  const response =
    await fetch(
      BACKEND_URL +
      "?" +
      params.toString(),
      {
        method:"GET",
        cache:"no-store"
      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  } catch (error) {

    throw new Error(
      "後端沒有回傳正確 JSON"
    );

  }


  if (
    !result.success
  ) {

    throw new Error(
      result.error ||
      "後端執行失敗"
    );

  }


  return result;

}


async function postBackend(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:
          "POST",

        headers:{

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  } catch (error) {

    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if (
    !result.success
  ) {

    throw new Error(
      result.error ||
      "Apps Script 執行失敗"
    );

  }


  return result;

}

function isTruckFixed(truck){

  if(!truck){
    return false;
  }


  const value =
    truck.fixed;


  if(value === true){
    return true;
  }


  const text =
    String(
      value ?? ""
    )
      .trim()
      .toUpperCase();


  return (
    text === "TRUE" ||
    text === "1" ||
    text === "Y" ||
    text === "YES" ||
    text === "是" ||
    text === "啟用"
  );

}


function sortedTrucks(){

  /*
   * D欄固定的車：
   * 不代表固定原本位置，也不是固定最上面。
   *
   * 它的意思是：
   * 就算今天已經使用過，也仍然視為「未使用」來排序。
   *
   * 因此：
   * - 一般未使用車在前
   * - D欄固定車也在前
   * - 一般已使用車排到後面
   * - 同一群內維持工作表原本順序
   *
   * 例如原本：1、2、3、4
   * 2、3 已使用，4 有勾固定
   * 結果：1、4、2、3
   */

  return truckData
    .map(
      function(
        truck,
        index
      ){

        const fixed =
          isTruckFixed(
            truck
          );


        const used =
          Boolean(
            truckLastUsed[
              truck.name
            ]
          );


        return {

          truck:
            truck,

          originalIndex:
            index,

          /*
           * fixed=true 時，
           * 即使真的用過也不算進「已使用後移」群組。
           */
          sortAsUsed:
            used && !fixed

        };

      }
    )
    .sort(
      function(a,b){

        if(
          a.sortAsUsed !==
          b.sortAsUsed
        ){

          return a.sortAsUsed
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )
    .map(
      function(item){

        return item.truck;

      }
    );

}


function renderTrucks(){

  const list =
    document.getElementById(

  if (

    list.innerHTML =
      '<div class="loading">目前沒有啟用中的大車</div>';

    return;

  }


  sortedTrucks()
    .forEach(
      function(truck){

        const usage =
          truckLastUsed[
            truck.name
          ] ||
          null;


        const isUsed =
          Boolean(
            usage
          );


        const label =
          document.createElement(
            "label"
          );


        label.className =
          "truck-option" +
          (
            isUsed
              ? " used"
              : ""
          );


        const checkbox =
          document.createElement(
            "input"
          );


        checkbox.type =
          "checkbox";


        checkbox.value =
          truck.name;


        checkbox.checked =
          selectedTrucks.has(
            truck.name
          );


        checkbox.addEventListener(
          "change",

            if (

        const name =

        label.appendChild(

/* =================================================
   大車名稱解析（前端）
================================================= */

function parseTruckSelection(
  text
){

  text =
    String(
      text ||
      ""
    ).trim();


  const names =
    truckData
      .map(
        function(truck){

          return truck.name;

        }
      )
      .sort(
        function(a,b){

          return (
            b.length -
            a.length
          );

        }
      );


  function walk(
    position
  ){

    if (
      position ===
      text.length
    ) {

      return [];

    }


    for (
      let i = 0;
      i < names.length;
      i++
    ) {

      const name =
        names[i];


      if (
        text.slice(
          position,
          position +
          name.length
        ) !==
        name
      ) {

        continue;

      }


      const end =
        position +
        name.length;


      if (
        end ===
        text.length
      ) {

        return [
          name
        ];

      }


      if (
        text.charAt(
          end
        ) !==
        "、"
      ) {

        continue;

      }


      const rest =
        walk(
          end + 1
        );


      if (
        rest
      ) {

        return [
          name
        ].concat(
          rest
        );

      }

    }


    return null;

  }


  return (
    walk(
      0
    ) ||
    text
      .split("、")
      .map(
        function(item){

          return item.trim();

        }
      )
      .filter(Boolean)
  );

}

/* =================================================
   照片處理
================================================= */

function readFileAsDataURL(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          resolve(
            event.target.result
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


function compressDataURL(
  rawData,
  maxW,
  quality
){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();


      img.onload =
        function(){

          const scale =
            Math.min(
              1,
              maxW /
              img.width
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            Math.round(
              img.width *
              scale
            );


          canvas.height =
            Math.round(
              img.height *
              scale
            );


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


      img.onerror =
        reject;


      img.src =
        rawData;

    }
  );

}

function showProgress(){

function setProgressStage(
  stage
){

  const stages =
    [
      "process",
      "compress",
      "upload"
    ];


  const activeIndex =
    stages.indexOf(
      stage
    );


  document
    .querySelectorAll(
      "#uploadProgressStage span"
    )
    .forEach(
      function(el){

        const index =
          stages.indexOf(
            el.dataset.stage
          );


        el.classList.remove(
          "active",
          "done"
        );


        if (
          index <
          activeIndex
        ) {

          el.classList.add(
            "done"
          );


        } else if (
          index ===
          activeIndex
        ) {

          el.classList.add(
            "active"
          );

        }

      }
    );

}


function updateProgress(
  title,
  percent,
  text,
  count
){

  document
    .getElementById(
      "uploadProgressTitle"
    )
    .textContent =
    title || "";


  document
    .getElementById(
      "uploadProgressFill"
    )
    .style.width =
    Math.min(
      100,
      Math.max(
        0,
        percent
      )
    ) +
    "%";


  document
    .getElementById(
      "uploadProgressText"
    )
    .textContent =
    text || "";


  document
    .getElementById(
      "uploadProgressCount"
    )
    .textContent =
    count || "";

}


/* =================================================
   選照片
================================================= */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const files =
        [
          ...
          event.target.files
        ].filter(
          function(file){

            return file.type.startsWith(
              "image/"
            );

          }
        );


      if (
        files.length === 0
      ) {

        return;

      }


      showProgress();


      try {

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          setProgressStage(
            "process"
          );


          updateProgress(
            t(
              "processingPhoto"
            ),
            (
              i /
              files.length
            ) *
            40,
            t(
              "processingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            files.length
          );


          const raw =
            await readFileAsDataURL(
              files[i]
            );


          setProgressStage(
            "compress"
          );


          updateProgress(
            t(
              "compressingPhoto"
            ),
            40 +
            (
              i /
              files.length
            ) *
            55,
            t(
              "compressingPhoto"
            ),
            (
              i + 1
            ) +
            " / " +
            files.length
          );


          const compressed =
            await compressDataURL(
              raw,
              1200,
              0.72
            );


          photos.push({

            kind:
              "new",

            dataUrl:
              compressed

          });

        }


        renderPhotoGrid();


        hideProgress();


      } catch (error) {

        console.error(
          error
        );


        hideProgress();

      }


      event.target.value =
        "";

    }
  );


function renderPhotoGrid(){

  const grid =

  grid.innerHTML =

  photos.forEach(

      const img =
        document.createElement(
          "img"
        );

              photo.url
            )

      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "rm";


      remove.textContent =
        "×";


      remove.addEventListener(

          if (

          photos.splice(

          );


          renderPhotoGrid();

        }
      );

document
  .getElementById(
    "submitBtn"
  )
  .addEventListener(
    "click",
    async function(){

      if (
        isSubmitting
      ) {

        return;

      }


      const trucks =
        Array.from(
          selectedTrucks
        );


      const staff =
        getSelectedStaff();


      if (
        trucks.length === 0
      ) {

        setStatus(
          t(
            "needTruck"
          ),
          "err"
        );

        return;

      }


      if (
        staff.length === 0
      ) {

        setStatus(
          t(
            "needStaff"
          ),
          "err"
        );

        return;

      }


      if (
        photos.length === 0
      ) {

        setStatus(
          t(
            "needPhoto"
          ),
          "err"
        );

        return;

      }


      const qtyButton =
        document.querySelector(
          "#qtySeg button.active"
        );


      const qtyStatus =
        qtyButton &&
        qtyButton.dataset.v ===
        "bad"
          ? "有多有少"
          : "正確";


      const newPhotos =
        photos
          .filter(
            function(photo){

              return (
                photo.kind ===
                "new"
              );

            }
          )
          .map(
            function(photo){

              return photo.dataUrl;

            }
          );


      const keepPhotoIds =
        photos
          .filter(
            function(photo){

              return (
                photo.kind ===
                "existing"
              );

            }
          )
          .map(
            function(photo){

              return photo.id;

            }
          );


      const isEditing =
        Boolean(
          editingReport
        );


      isSubmitting =
        true;


      document
        .getElementById(
          "submitBtn"
        )
        .disabled =
        true;


      showProgress();


      setProgressStage(
        "upload"
      );


      let progress =
        8;


      updateProgress(
        t(
          "uploading"
        ),
        progress,
        t(
          "uploading"
        ),
        ""
      );


      const timer =
        setInterval(
          function(){

            if (
              progress <
              70
            ) {

              progress +=
                2;


            } else if (
              progress <
              88
            ) {

              progress +=
                0.5;

            }


            updateProgress(
              progress >
              75
                ? t(
                    "serverProcessing"
                  )
                : t(
                    "uploading"
                  ),
              progress,
              progress >
              75
                ? t(
                    "serverProcessing"
                  )
                : t(
                    "uploading"
                  ),
              ""
            );

          },
          350
        );


      try {

        const payload = {

          user:
            userName,

          trucks:
            trucks,

          staff:
            staff,

          qtyStatus:
            qtyStatus,

          note:
            document
              .getElementById(
                "note"
              )
              .value
              .trim(),

          photos:
            newPhotos

        };


        if (
          isEditing
        ) {

          payload.action =
            "updateReport";


          payload.row =
            editingReport.row;


          payload.keepPhotoIds =
            keepPhotoIds;

        }


        await postBackend(
          payload
        );


        clearInterval(
          timer
        );


        updateProgress(
          isEditing
            ? t(
                "editSuccess"
              )
            : t(
                "success"
              ),
          100,
          isEditing
            ? t(
                "editSuccess"
              )
            : t(
                "success"
              ),
          ""
        );


        setStatus(
          isEditing
            ? t(
                "editSuccess"
              )
            : t(
                "success"
              ),
          "ok"
        );


        reportDates =
          [];


        reportCache =
          {};


        editingReport =
          null;


        document
          .getElementById(
            "editBanner"
          )
          .classList.remove(
            "show"
          );


        updateSubmitButtonText();


        /*
         * 重新取得今日大車狀態，
         * 因為編輯可能改了大車。
         */

        await loadTrucks();


        clearForm(
          true
        );


        setTimeout(
          function(){

            hideProgress();


            isSubmitting =
              false;


            document
              .getElementById(
                "submitBtn"
              )
              .disabled =
              false;


            if (
              !isEditing
            ) {

              try {

                if (
                  window.liff &&
                  liff.isInClient()
                ) {

                  liff.closeWindow();

                }

              } catch (error) {

                console.log(
                  error
                );

              }

            }

          },
          700
        );


      } catch (error) {

        clearInterval(
          timer
        );


        hideProgress();


        isSubmitting =
          false;


        document
          .getElementById(
            "submitBtn"
          )
          .disabled =
          false;


        setStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "err"
        );

      }

    }
  );

  date,

  try {

      await getBackend(
        "reports",
        {

            date
        }
      );


    const reports =
      Array.isArray(
        result.data.reports
      )
        ? result.data.reports
        : [];

      date

      error

    body.innerHTML =

/* =================================================
   回報卡片文字自動縮小
================================================= */

function fitTextToWidth(
  element,
  normalSize,
  minimumSize
){

  if(
    !element
  ){

    return;

  }


  element.style.fontSize =
    normalSize +
    "px";


  let size =
    normalSize;


  while(
    element.scrollWidth >
      element.clientWidth &&
    size >
      minimumSize
  ){

    size -=
      0.5;


    element.style.fontSize =
      size +
      "px";

  }

}

    ok
      ? "✓ 正確"
      : "✗ " +
        (
          report.qtyStatus ||
          "有多有少"
        );


  main.appendChild(
    truck
  );


  if (
    report.staff
  ) {

    main.appendChild(
      staff
    );

  }


  card.appendChild(
    main
  );

  
  if (
    Array.isArray(
      report.photos
    ) &&
    report.photos.length >
    0
  ) {

    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "report-photos";


    report.photos.forEach(
      function(photo){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "report-photo";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.thumbnailUrl ||
          photo.url;


        img.loading =
          "lazy";


        img.decoding =
          "async";


        img.addEventListener(
          "click",
          function(){

            openLightbox(
              photo.url ||
              photo.thumbnailUrl
            );

          }
        );


        item.appendChild(
          img
        );


        grid.appendChild(
          item
        );

      }
    );


    card.appendChild(
      grid
    );

  }


  if (
    report.note
  ) {

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "report-note";


    note.textContent =
      report.note;


    card.appendChild(
      note
    );

  }


  const footer =
  document.createElement(
    "div"
  );


footer.className =
  "report-footer";


/*
 * =============================================
 * 日期＋時間
 *
 * 如果後端有 actualDate，
 * 就使用真正跨日後的日期。
 *
 * 否則使用原本工作日日期。
 * =============================================
 */

const footerTime =
  document.createElement(
    "div"
  );


footerTime.className =
  "report-footer-time";


const displayDate =
  report.actualDate ||
  report.date ||
  "";


let shortDate =
  "";


if(
  displayDate
){

  const dateParts =
    String(
      displayDate
    ).split(
      "-"
    );


  if(
    dateParts.length === 3
  ){

    shortDate =
      dateParts[1] +
      "/" +
      dateParts[2];

  }else{

    shortDate =
      displayDate;

  }

}


footerTime.textContent =
  (
    shortDate
      ? shortDate + " "
      : ""
  ) +
  (
    report.time
      ? String(
          report.time
        ).substring(
          0,
          5
        )
      : ""
  );


footer.appendChild(
  footerTime
);


/*
 * =============================================
 * 回報人
 * =============================================
 */

const employee =
  document.createElement(
    "div"
  );


employee.className =
  "report-employee";


employee.textContent =
  report.employee
    ? "回報人：" +
      report.employee
    : "";


footer.appendChild(
  employee
);


/*
 * =============================================
 * 件數狀態
 * 正確 / 有多有少
 * =============================================
 */

footer.appendChild(
  status
);


/*
 * =============================================
 * 只有本人顯示：
 * 編輯 / 刪除
 * =============================================
 */

if(
  String(
    report.employee ||
    ""
  ).trim() ===
  String(
    userName ||
    ""
  ).trim()
){

  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "report-actions";


  const editButton =
    document.createElement(
      "button"
    );


  editButton.type =
    "button";


  editButton.className =
    "report-edit";


  editButton.textContent =
    t(
      "edit"
    );


  editButton.addEventListener(
    "click",
    function(){

      startEditReport(
        report
      );

    }
  );


  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.type =
    "button";


  deleteButton.className =
    "report-delete";


  deleteButton.textContent =
    t(
      "delete"
    );


  deleteButton.addEventListener(
    "click",
    async function(){

      if(
        !confirm(
          t(
            "deleteConfirm"
          )
        )
      ){

        return;

      }


      deleteButton.disabled =
        true;


      deleteButton.textContent =
        t(
          "deleting"
        );


      try{

        await postBackend({

          action:
            "deleteReport",

          row:
            report.row,

          user:
            userName

        });


        reportDates =
          [];


        reportCache =
          {};


        await loadReportDates();


        await loadTrucks();


      }catch(error){

        deleteButton.disabled =
          false;


        deleteButton.textContent =
          t(
            "delete"
          );


        alert(
          error.message ||
          "刪除失敗"
        );

      }

    }
  );


  actions.appendChild(
    editButton
  );


  actions.appendChild(
    deleteButton
  );


  footer.appendChild(
    actions
  );

}


card.appendChild(
  footer
);


  requestAnimationFrame(
    function(){

      fitTextToWidth(
        truck,
        20,
        11
      );


      if(
        report.staff
      ){

        fitTextToWidth(
          staff,
          13,
          9
        );

      }


      fitTextToWidth(
        employee,
        10,
        8
      );

    }
  );


  return card;

}


/* =================================================
   日期
================================================= */

function formatDateLabel(
  date
){

  const parts =
    String(
      date
    ).split(
      "-"
    );


  if (
    parts.length !==
    3
  ) {

    return date;

  }


  return (
    parts[0] +
    "/" +
    parts[1] +
    "/" +
    parts[2]
  );

}


/* =================================================
   當日全部照片
================================================= */

function showAllDayPhotos(
  date,
  reports
){

  const grid =
    document.getElementById(
      "allPhotoGrid"
    );


  grid.innerHTML =
    "";


  document
    .getElementById(
      "allPhotoTitle"
    )
    .textContent =
    formatDateLabel(
      date
    ) +
    " · " +
    t(
      "allPhotos"
    );


  reports.forEach(
    function(report){

      if (
        !Array.isArray(
          report.photos
        )
      ) {

        return;

      }


      report.photos.forEach(
        function(photo){

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "all-photo-item";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            photo.thumbnailUrl ||
            photo.url;


          img.loading =
            "lazy";


          img.addEventListener(
            "click",
            function(){

              openLightbox(
                photo.url ||
                photo.thumbnailUrl
              );

            }
          );


          item.appendChild(
            img
          );


          grid.appendChild(
            item
          );

        }
      );

    }
  );


  document
    .getElementById(
      "allPhotoScreen"
    )
    .classList.add(
      "open"
    );

}


document
  .getElementById(
    "allPhotoClose"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "allPhotoScreen"
        )
        .classList.remove(
          "open"
        );

    }
  );


/* =================================================
   Lightbox
================================================= */

function openLightbox(
  url
){

  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    url;


  document
    .getElementById(
      "lightbox"
    )
    .classList.add(
      "open"
    );

}


function closeLightbox(){

  document
    .getElementById(
      "lightbox"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "lightboxImage"
    )
    .src =
    "";

}


document
  .getElementById(
    "lightboxClose"
  )
  .addEventListener(
    "click",
    closeLightbox
  );


document
  .getElementById(
    "lightbox"
  )
  .addEventListener(
    "click",
    function(event){

      if (
        event.target ===
        this
      ) {

        closeLightbox();

      }

    }
  );


/* =================================================
   啟動
================================================= */

async function init(){

  if (
    !currentLanguage
  ) {

    currentLanguage =
      "zh";


    applyLanguage();


    document
      .getElementById(
        "languageScreen"
      )
      .classList.add(
        "show"
      );


  } else {

    applyLanguage();

  }


  /*
   * 大車立即開始
   * LINE 同時開始
   */

  const truckPromise =
    loadTrucks();


  const linePromise =
    initLIFF();


  /*
   * 大車先完成、先顯示
   */

  await truckPromise;


  const loginOK =
    await linePromise;


  if (
    loginOK
  ) {

    /*
     * 大車出來後才載人員
     */

    await loadStaff();

  }

}


init();

</script>
