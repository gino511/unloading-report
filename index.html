<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>竹北托運 下貨回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
  --soft:#faf9f5;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:20px 18px 110px;
}

.brand{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.brand-left{
  min-width:0;
}

.brand h1{
  font-size:19px;
  margin:0;
  letter-spacing:.02em;
}

.brand .who{
  font-size:12px;
  color:var(--muted);
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.language-button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

fieldset{
  border:none;
  padding:0;
  margin:0 0 22px;
}

legend{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:8px;
}

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  width:100%;
  padding:13px 42px 13px 13px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  font-size:16px;
  font-family:inherit;
  position:relative;
}

.truck-select-button::after{
  content:"⌄";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-55%);
  font-size:20px;
  color:#777;
}

.truck-dropdown{
  display:none;
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  margin-top:6px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  overflow:hidden;
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.truck-option:last-child{
  border-bottom:none;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f5f4ef;
}

.truck-option.used .truck-name{
  color:#888679;
}

.used-staff{
  margin-left:auto;
  font-size:11px;
  padding:3px 7px;
  border-radius:20px;
  background:#e9e7df;
  color:#6f6d62;
  white-space:nowrap;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--line);
  background:#faf9f5;
}

.truck-dropdown-footer button{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-family:inherit;
  font-size:14px;
}

.truck-dropdown-footer button.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.staff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.staff-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 10px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

.line-match-hint{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:var(--accent-dim);
  color:var(--accent);
  font-size:12px;
  line-height:1.5;
}

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;
  padding:14px 0;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
  font-weight:700;
  color:var(--ink);
}

.seg button[data-v="ok"].active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  background:var(--warn);
  border-color:var(--warn);
  color:#fff;
}

textarea{
  width:100%;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  font-size:16px;
  background:#fff;
  color:var(--ink);
  font-family:inherit;
  resize:vertical;
  min-height:80px;
}

textarea:focus{
  outline:none;
  border-color:var(--accent);
}

.photo-upload{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:#fff;
  position:relative;
  color:#8a8879;
}

.photo-upload span.icon{
  font-size:30px;
  display:block;
  margin-bottom:6px;
}

.photo-upload input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.thumb{
  position:relative;
  aspect-ratio:1;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#eee;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumb .rm{
  position:absolute;
  top:3px;
  right:3px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
}

.hint{
  font-size:12px;
  color:#9a988c;
  margin-top:6px;
}

.submit-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:
    12px
    18px
    calc(12px + env(safe-area-inset-bottom));
}

.submit-bar .inner{
  max-width:480px;
  margin:0 auto;
}

button.submit{
  width:100%;
  padding:15px 0;
  border:none;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

button.submit:disabled{
  background:#a3a091;
}

.status{
  font-size:13px;
  text-align:center;
  margin-top:8px;
  color:var(--muted);
  min-height:16px;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}


/* =================================================
   回報紀錄入口
================================================= */

.history-entry{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 15px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font-size:15px;
  text-align:left;
}

.history-entry .arrow{
  color:#8a8879;
  font-size:18px;
}


/* =================================================
   回報紀錄頁
================================================= */

.history-page{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--paper);
  overflow-y:auto;
}

.history-page.open{
  display:block;
}

.history-inner{
  max-width:480px;
  margin:0 auto;
  padding:18px 18px 50px;
}

.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
  margin-bottom:16px;
}

.history-title{
  font-size:20px;
  font-weight:800;
}

.history-close{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px 10px;
  font-size:13px;
}

.history-date{
  margin-bottom:18px;
}

.history-date-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px;
}

.history-date-button{
  flex:1;
  border:none;
  background:transparent;
  padding:0;
  text-align:left;
  font-size:18px;
  font-weight:800;
  color:var(--ink);
}

.day-photo-button{
  flex:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
}

.history-date-body{
  display:none;
}

.history-date.open .history-date-body{
  display:block;
}

.report-card{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:11px;
  padding:11px 11px 9px;
  margin-bottom:8px;
}

.report-main{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.report-truck{
  font-size:20px;
  line-height:1.2;
  font-weight:900;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.report-staff{
  font-size:14px;
  font-weight:700;
  color:var(--muted);
  white-space:nowrap;
  max-width:90px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.report-qty{
  font-size:12px;
  font-weight:800;
  padding:4px 7px;
  border-radius:7px;
  white-space:nowrap;
}

.report-qty.ok{
  background:var(--accent-dim);
  color:var(--accent);
}

.report-qty.bad{
  background:#f6e5e0;
  color:var(--warn);
}

.report-photo-button{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:17px;
  flex:none;
}

.report-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
  padding-top:7px;
  border-top:1px solid #eee;
}

.report-time{
  font-size:11px;
  color:#969387;
}

.report-employee{
  font-size:11px;
  color:var(--muted);
}

.report-note{
  margin-top:7px;
  font-size:12px;
  line-height:1.5;
  color:#6b6a5f;
  white-space:pre-wrap;
}

.report-delete{
  border:none;
  background:none;
  color:var(--warn);
  font-size:11px;
  padding:2px 0;
}


/* =================================================
   照片查看器
================================================= */

.photo-viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.92);
  padding:55px 12px 20px;
  overflow-y:auto;
}

.photo-viewer.open{
  display:block;
}

.photo-viewer-close{
  position:fixed;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.18);
  color:#fff;
  font-size:20px;
  z-index:310;
}

.photo-viewer-title{
  color:#fff;
  text-align:center;
  font-size:14px;
  margin-bottom:14px;
}

.photo-viewer-grid{
  max-width:480px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.photo-viewer-grid img{
  width:100%;
  border-radius:7px;
  display:block;
  background:#222;
}

.photo-empty{
  color:#fff;
  text-align:center;
  padding:40px 10px;
  font-size:14px;
}


/* =================================================
   語言選擇
================================================= */

.language-modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(28,31,26,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.language-modal.open{
  display:flex;
}

.language-box{
  width:100%;
  max-width:360px;
  background:var(--paper);
  border-radius:16px;
  padding:24px 20px 20px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.language-box h2{
  margin:0 0 7px;
  font-size:20px;
}

.language-box p{
  margin:0 0 18px;
  color:var(--muted);
  font-size:13px;
}

.language-options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.language-option{
  width:100%;
  padding:15px;
  border:1.5px solid var(--line);
  border-radius:11px;
  background:#fff;
  text-align:left;
  font-size:16px;
  font-weight:700;
}

.language-option:active{
  background:var(--accent-dim);
  border-color:var(--accent);
}


/* =================================================
   當日照片頁提示
================================================= */

.day-photo-list{
  color:#fff;
}

</style>

</head>

<body>


<div class="wrap">

  <div class="brand">

    <div class="brand-left">

      <h1 id="titleText">
        竹北托運 下貨回報
      </h1>

      <span
        class="who"
        id="whoami"
      >
        載入中…
      </span>

    </div>

    <button
      type="button"
      class="language-button"
      id="languageButton"
    >
      🌐 語言
    </button>

  </div>


  <!-- ==========================================
       大車
  =========================================== -->

  <fieldset>

    <legend data-i18n="truck">
      大車
    </legend>

    <div class="truck-select-wrap">

      <button
        type="button"
        class="truck-select-button"
        id="truckSelectButton"
      >
        大車載入中…
      </button>

      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >
          <div class="loading">
            大車資料載入中…
          </div>
        </div>

        <div class="truck-dropdown-footer">

          <button
            type="button"
            id="truckClearBtn"
            data-i18n="clear"
          >
            清除
          </button>

          <button
            type="button"
            class="primary"
            id="truckDoneBtn"
            data-i18n="done"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>


  <!-- ==========================================
       下貨人員
  =========================================== -->

  <fieldset>

    <legend data-i18n="staff">
      下貨人員
    </legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >
      <div class="loading">
        下貨人員資料載入中…
      </div>
    </div>

    <div
      id="lineMatchHint"
      class="line-match-hint"
      style="display:none;"
    ></div>

  </fieldset>


  <!-- ==========================================
       件數
  =========================================== -->

  <fieldset>

    <legend data-i18n="qty">
      件數是否正確
    </legend>

    <div
      class="seg"
      id="qtySeg"
    >

      <button
        type="button"
        data-v="ok"
        class="active"
        data-i18n="qtyOk"
      >
        ✓ 件數正確
      </button>

      <button
        type="button"
        data-v="bad"
        data-i18n="qtyBad"
      >
        ✗ 有多有少
      </button>

    </div>

  </fieldset>


  <!-- ==========================================
       照片
  =========================================== -->

  <fieldset>

    <legend data-i18n="photo">
      照片
    </legend>

    <div class="photo-upload">

      <span class="icon">
        📷
      </span>

      <span id="photoUploadText">
        點此上傳照片（可一次選多張）
      </span>

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        multiple
      >

    </div>

    <div
      class="photo-grid"
      id="photoGrid"
    ></div>

    <div
      class="hint"
      id="photoHint"
    >
      至少上傳1張，可拍照或從相簿選取多張
    </div>

  </fieldset>


  <!-- ==========================================
       備註
  =========================================== -->

  <fieldset>

    <legend data-i18n="note">
      備註（選填）
    </legend>

    <textarea
      id="note"
      placeholder="有多有少的原因、異常說明等"
    ></textarea>

  </fieldset>


  <!-- ==========================================
       回報紀錄
       只是一行入口
  =========================================== -->

  <fieldset>

    <button
      type="button"
      class="history-entry"
      id="historyEntry"
    >

      <span>
        📋
        <span data-i18n="history">
          回報紀錄
        </span>
      </span>

      <span class="arrow">
        →
      </span>

    </button>

  </fieldset>

</div>


<!-- ==========================================
     送出
=========================================== -->

<div class="submit-bar">

  <div class="inner">

    <button
      class="submit"
      id="submitBtn"
      data-i18n="submit"
    >
      送出回報
    </button>

    <div
      class="status"
      id="statusMsg"
    ></div>

  </div>

</div>


<!-- ==========================================
     回報紀錄頁
=========================================== -->

<div
  class="history-page"
  id="historyPage"
>

  <div class="history-inner">

    <div class="history-header">

      <div
        class="history-title"
        data-i18n="history"
      >
        回報紀錄
      </div>

      <button
        type="button"
        class="history-close"
        id="historyClose"
        data-i18n="close"
      >
        關閉
      </button>

    </div>

    <div id="historyContent">

      <div class="loading">
        載入中…
      </div>

    </div>

  </div>

</div>


<!-- ==========================================
     照片查看器
=========================================== -->

<div
  class="photo-viewer"
  id="photoViewer"
>

  <button
    type="button"
    class="photo-viewer-close"
    id="photoViewerClose"
  >
    ×
  </button>

  <div
    class="photo-viewer-title"
    id="photoViewerTitle"
  ></div>

  <div
    class="photo-viewer-grid"
    id="photoViewerGrid"
  ></div>

</div>


<!-- ==========================================
     語言選擇
=========================================== -->

<div
  class="language-modal"
  id="languageModal"
>

  <div class="language-box">

    <h2>
      <span id="languageTitle">
        選擇語言
      </span>
    </h2>

    <p id="languageDescription">
      請選擇系統語言
    </p>

    <div class="language-options">

      <button
        type="button"
        class="language-option"
        data-language="zh-TW"
      >
        🇹🇼 中文
      </button>

      <button
        type="button"
        class="language-option"
        data-language="vi"
      >
        🇻🇳 Tiếng Việt
      </button>

    </div>

  </div>

</div>


<script>

/* =================================================
   設定
================================================= */

const LIFF_ID =
  "2011084900-xvJIcgzA";

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycby8oksNTRuZEty3SpTCFYi2-QLdmLAVnQql9GxdKazFrg9DBLBTmTjfjFAifrj0gkBH/exec";


/* =================================================
   狀態
================================================= */

let userName =
  "未知使用者";

let photos =
  [];

let truckData =
  [];

let staffData =
  [];

let truckLastUsed =
  {};

let selectedTrucks =
  new Set();

let reportData =
  null;

let currentLanguage =
  localStorage.getItem(
    "zhubei_transport_language"
  );


/* =================================================
   翻譯
================================================= */

const LANG =
{

  "zh-TW": {

    title:
      "竹北托運 下貨回報",

    loading:
      "載入中…",

    truck:
      "大車",

    staff:
      "下貨人員",

    qty:
      "件數是否正確",

    qtyOk:
      "✓ 件數正確",

/* =================================================
   翻譯函式
================================================= */

function t(
  key,
  vars
){

  const lang =
    LANG[
      currentLanguage ||
      "zh-TW"
    ] ||
    LANG["zh-TW"];


  let text =
    lang[key] ||
    LANG["zh-TW"][key] ||
    key;


  if(vars){

    Object.keys(
      vars
    ).forEach(
      function(name){

        text =
          text.replace(
            new RegExp(
              "\\{" +
              name +
              "\\}",
              "g"
            ),
            String(
              vars[name]
            )
          );

      }
    );

  }


  return text;

}

/* =================================================
   GET
================================================= */

async function getBackend(
  query
){

  const response =
    await fetch(
      BACKEND_URL +
      query +
      (
        query.indexOf("?") >= 0
          ? "&"
          : "?"
      ) +
      "t=" +
      Date.now(),
      {
        method:
          "GET",

        cache:
          "no-store"
      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "Apps Script 回傳格式錯誤"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "後端錯誤"
    );

  }


  return result;

}

/* =================================================
   大車時間
================================================= */

function formatTruckTime(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  const text =
    String(
      value
    ).trim();


  if(!text){

    return "";

  }


  const simpleMatch =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if(simpleMatch){

    return (
      String(
        simpleMatch[1]
      ).padStart(
        2,
        "0"
      ) +
      ":" +
      simpleMatch[2]
    );

  }


  const date =
    new Date(
      text
    );


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return (
      String(
        date.getHours()
      ).padStart(
        2,
        "0"
      ) +
      ":" +
      String(
        date.getMinutes()
      ).padStart(
        2,
        "0"
      )
    );

  }


  return "";

}


/* =================================================
   大車使用
================================================= */

function getTruckUsage(
  truckName
){

  const data =
    truckLastUsed[
      truckName
    ];


  if(!data){

    return null;

  }


  if(
    typeof data ===
    "string"
  ){

    return {

      time:
        formatTruckTime(
          data
        ),

      staff:
        ""

    };

  }


  return {

    time:
      formatTruckTime(
        data.time
      ),

    staff:
      String(
        data.staff ||
        ""
      ).trim()

  };

}


/* =================================================
   大車排序
================================================= */

function sortedTrucks(){

  return truckData
    .map(
      function(
        truck,
        index
      ){

        return {

          truck:
            truck,

          originalIndex:
            index

        };

      }
    )
    .sort(
      function(a,b){

        const truckA =
          a.truck;

        const truckB =
          b.truck;


        const fixedA =
          truckA.fixed ===
          true;


        const fixedB =
          truckB.fixed ===
          true;


        if(
          fixedA !==
          fixedB
        ){

          return fixedA
            ? -1
            : 1;

        }


        if(
          fixedA &&
          fixedB
        ){

          return (
            a.originalIndex -
            b.originalIndex
          );

        }


        const usageA =
          getTruckUsage(
            truckA.name
          );


        const usageB =
          getTruckUsage(
            truckB.name
          );


        const usedA =
          Boolean(
            usageA &&
            usageA.staff
          );


        const usedB =
          Boolean(
            usageB &&
            usageB.staff
          );


        if(
          usedA !==
          usedB
        ){

          return usedA
            ? 1
            : -1;

        }


        return (
          a.originalIndex -
          b.originalIndex
        );

      }
    )
    .map(
      function(item){

        return item.truck;

      }
    );

}


/* =================================================
   顯示大車
================================================= */

function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  const button =
    document.getElementById(
      "truckSelectButton"
    );


  list.innerHTML =
    "";


  const trucks =
    sortedTrucks();


  if(
    trucks.length ===
    0
  ){

    list.innerHTML =
      `
      <div class="loading">
        ${t("noTruck")}
      </div>
      `;


    button.textContent =
      t("noTruck");


    return;

  }


  trucks.forEach(
    function(truck){

      const usage =
        getTruckUsage(
          truck.name
        );


      const isUsed =
        Boolean(
          usage &&
          usage.staff
        );


      const checked =
        selectedTrucks.has(
          truck.name
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "truck-option" +
        (
          isUsed
            ? " used"
            : ""
        );


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        truck.name;


      checkbox.checked =
        checked;


      checkbox.addEventListener(
        "change",
        function(){

          if(
            checkbox.checked
          ){

            selectedTrucks.add(
              truck.name
            );

          }else{

            selectedTrucks.delete(
              truck.name
            );

          }


          updateTruckButtonText();

        }
      );


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "truck-name";


      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );


      label.appendChild(
        name
      );


      if(
        isUsed &&
        usage.staff
      ){

        const staffTag =
          document.createElement(
            "span"
          );


        staffTag.className =
          "used-staff";


        staffTag.textContent =
          usage.staff;


        label.appendChild(
          staffTag
        );

      }


      list.appendChild(
        label
      );

    }
  );


  updateTruckButtonText();

}

/* =================================================
   LINE 自動對應
================================================= */

function autoMatchLineStaff(){

  const hint =
    document.getElementById(
      "lineMatchHint"
    );


  hint.style.display =
    "none";


  if(
    !userName ||
    userName ===
    "未知使用者"
  ){

    return;

  }


  const currentUser =
    String(
      userName
    )
      .trim()
      .toLowerCase();


  const matched =
    staffData.find(
      function(staff){

        const lineName =
          String(
            staff.lineName ||
            ""
          )
            .trim()
            .toLowerCase();


        return (
          lineName &&
          lineName ===
          currentUser
        );

      }
    );


  if(!matched){

    return;

  }


  const inputs =
    document.querySelectorAll(
      "#staffGrid input[type=checkbox]"
    );


  let target =
    null;


  inputs.forEach(
    function(input){

      if(
        String(
          input.value
        ).trim() ===
        String(
          matched.name
        ).trim()
      ){

        target =
          input;

      }

    }
  );


  if(!target){

    return;

  }


  target.checked =
    true;


  const item =
    target.closest(
      ".staff-item"
    );


  if(item){

    item.classList.add(
      "selected"
    );

  }


  hint.style.display =
    "block";


  hint.textContent =
    t(
      "lineMatched",
      {
        user:
          userName,

        staff:
          matched.name
      }
    );

}

function compressImage(
  file,
  maxW=1200,
  quality=0.72
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const scale =
                Math.min(
                  1,
                  maxW /
                  img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const files =
        [
          ...event.target.files
        ];


      if(
        files.length ===
        0
      ){

        return;

      }


      setStatus(
        t("processingPhoto"),
        ""
      );


      try{

        for(
          const file of files
        ){

          if(
            !file.type.startsWith(
              "image/"
            )
          ){

            continue;

          }


          const dataUrl =
            await compressImage(
              file
            );


          photos.push(
            dataUrl
          );

        }


        renderPhotoGrid();


        setStatus(
          "",
          ""
        );


      }catch(error){

        console.error(
          error
        );


        setStatus(
          t(
            "photoProcessError"
          ),
          "err"
        );

      }


      event.target.value =
        "";

    }
  );

/* =================================================
   POST
================================================= */

async function submitReport(
  payload
){

  const response =
    await fetch(
      BACKEND_URL,
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "Apps Script HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(
        text
      );

  }catch(error){

    throw new Error(
      "Apps Script 沒有回傳正確 JSON"
    );

  }


  if(
    !result.success
  ){

    throw new Error(
      result.error ||
      "Apps Script 儲存失敗"
    );

  }


  return result;

}

  reportData

      function(day){

          );


        dateBox.className =
          "history-date";


        const head =
          document.createElement(
            "div"
          );


        head.className =
          "history-date-head";

          document.createElement(
            "button"
          );

        dateButton.className =
          "history-date-button";


        dateButton.textContent =

            "button"
          );

          "button";


        dayPhotoButton.className =

        dayPhotoButton.addEventListener(

        );


        const body =
          document.createElement(
            "div"
          );


        body.className =
          "history-date-body";


        dateButton.addEventListener(
          "click",
          function(){

            dateBox.classList.toggle(
              "open"
            );

          }
        );


        if(
          day.reports &&
          day.reports.length
        ){

          day.reports.forEach(
            function(report){

              body.appendChild(
                createReportCard(
                  report,
                  day.date
                )
              );

            }
          );

        }else{

          body.innerHTML =
            `
            <div class="loading">
              ${t("noHistoryData")}
            </div>
            `;

        }


        dateBox.appendChild(
          head
        );


        dateBox.appendChild(
          body
        );


        container.appendChild(
          dateBox
        );

      }
    );

}


/* =================================================
   日期顯示
================================================= */

function formatDisplayDate(
  dateText
){

  const match =
    String(
      dateText
    ).match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(!match){

    return dateText;

  }


  if(
    currentLanguage ===
    "vi"
  ){

    return (
      match[3] +
      "/" +
      match[2] +
      "/" +
      match[1]
    );

  }


  return (
    match[1] +
    "年" +
    match[2] +
    "月" +
    match[3] +
    "日"
  );

}

function createReportCard(
  report,
  date
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "report-card";


  const main =
    document.createElement(
      "div"
    );


  main.className =
    "report-main";


  const truck =
    document.createElement(
      "div"
    );


  truck.className =
    "report-truck";


  truck.textContent =
    report.trucks ||
    "—";


  const staff =
    document.createElement(
      "div"
    );


  staff.className =
    "report-staff";


  staff.textContent =
    report.staff ||
    "—";


  const qty =
    document.createElement(
      "div"
    );


  qty.className =
    "report-qty " +
    (
      report.qtyStatus ===
      "正確"
        ? "ok"
        : "bad"
    );


  qty.textContent =
    report.qtyStatus ||
    "—";


  const photoButton =
    document.createElement(
      "button"
    );


  photoButton.type =
    "button";


  photoButton.className =
    "report-photo-button";


  photoButton.textContent =
    "📷";


  photoButton.addEventListener(
    "click",
    function(){

      showReportPhotos(
        report,
        date
      );

    }
  );


  main.appendChild(
    truck
  );


  main.appendChild(
    staff
  );


  main.appendChild(
    qty
  );


  main.appendChild(
    photoButton
  );


  const bottom =
    document.createElement(
      "div"
    );


  bottom.className =
    "report-bottom";


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "report-time";


  time.textContent =
    report.time ||
    "";


  const employee =
    document.createElement(
      "div"
    );


  employee.className =
    "report-employee";


  employee.textContent =
    t(
      "report",
      {
        employee:
          report.employee ||
          "—"
      }
    );


  bottom.appendChild(
    time
  );


  const right =
    document.createElement(
      "div"
    );


  right.style.display =
    "flex";


  right.style.alignItems =
    "center";


  right.style.gap =
    "9px";


  right.appendChild(
    employee
  );


  /*
   * 只有 C 欄員工名稱等於目前 LINE 名稱
   * 才顯示刪除。
   */

  if(
    String(
      report.employee ||
      ""
    ).trim() ===
    String(
      userName ||
      ""
    ).trim()
  ){

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.type =
      "button";


    deleteButton.className =
      "report-delete";


    deleteButton.textContent =
      t("delete");


    deleteButton.addEventListener(
      "click",
      function(){

        deleteReportFromHistory(
          report
        );

      }
    );


    right.appendChild(
      deleteButton
    );

  }


  bottom.appendChild(
    right
  );


  card.appendChild(
    main
  );


  if(
    report.note
  ){

    const note =
      document.createElement(
        "div"
      );


    note.className =
      "report-note";


    note.textContent =
      report.note;


    card.appendChild(
      note
    );

  }


  card.appendChild(
    bottom
  );


  return card;

}

function showDayPhotos(

){

  const allPhotos =

  if(
    day &&
    Array.isArray(
      day.reports
    )
  ){

    day.reports.forEach(
      function(report){

        if(
          Array.isArray(
            report.photos
          )
        ){

          report.photos.forEach(
            function(photo){

              allPhotos.push(

          );

  openPhotoViewer(
    t(
      "photoTitle",
      {

          formatDisplayDate(
            day.date
          )
      }
    ),
    allPhotos
  );

}


/* =================================================
   開啟照片查看器

function openPhotoViewer(
  title,
  photos
){

  const viewer =
    document.getElementById(
      "photoViewer"
    );


  const titleEl =
    document.getElementById(
      "photoViewerTitle"
    );


  const grid =
    document.getElementById(
      "photoViewerGrid"
    );


  titleEl.textContent =
    title;


  grid.innerHTML =
    "";


  if(
    !photos ||
    photos.length ===
    0
  ){

    grid.innerHTML =
      `
      <div class="photo-empty">
        ${t("noPhotos")}
      </div>
      `;

  }else{

    photos.forEach(
      function(photo){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.previewUrl ||
          photo.url;


        img.loading =
          "lazy";


        img.addEventListener(
          "click",
          function(){

            if(
              photo.url
            ){

              window.open(
                photo.url,
                "_blank"
              );

            }

          }
        );


        grid.appendChild(
          img
        );

      }
    );

  }


  viewer.classList.add(
    "open"
  );

}

/* =================================================
   刪除回報
================================================= */

async function deleteReportFromHistory(
  report
){

  if(
    String(
      report.employee ||
      ""
    ).trim() !==
    String(
      userName ||
      ""
    ).trim()
  ){

    return;

  }


  if(
    !confirm(
      t("deleteConfirm")
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        BACKEND_URL,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "deleteReport",

              row:
                report.row,

              user:
                userName

            })

        }
      );


    const text =
      await response.text();


    let result;


    try{

      result =
        JSON.parse(
          text
        );

    }catch(error){

      throw new Error(
        "Apps Script 回傳格式錯誤"
      );

    }


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "刪除失敗"
      );

    }


    setStatus(
      t("deleteSuccess"),
      "ok"
    );


    await openHistory();


  }catch(error){

    console.error(
      error
    );


    setStatus(
      t(
        "deleteFailed",
        {
          error:
            error.message ||
            error
        }
      ),
      "err"
    );

  }

}
