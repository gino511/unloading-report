<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>下貨點收回報</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root{
  --ink:#1c1f1a;
  --paper:#f6f4ee;
  --line:#d8d3c4;
  --accent:#2f6f4f;
  --accent-dim:#e4ede7;
  --warn:#b5452e;
  --muted:#6b6a5f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  max-width:480px;
  margin:0 auto;
  padding:20px 18px 110px;
}

.brand{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}

.brand h1{
  font-size:19px;
  margin:0;
}

.brand .who{
  font-size:12px;
  color:var(--muted);
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

fieldset{
  border:none;
  padding:0;
  margin:0 0 22px;
}

legend{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:8px;
}

/* 大車 */

.truck-select-wrap{
  position:relative;
}

.truck-select-button{
  width:100%;
  padding:13px 42px 13px 13px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  text-align:left;
  font-size:16px;
  font-family:inherit;
  position:relative;
}

.truck-select-button::after{
  content:"⌄";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-55%);
  font-size:20px;
  color:#777;
}

.truck-dropdown{
  display:none;
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  margin-top:6px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  overflow:hidden;
}

.truck-dropdown.open{
  display:block;
}

.truck-list{
  max-height:320px;
  overflow-y:auto;
}

.truck-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.truck-option input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.truck-option.used{
  background:#f5f4ef;
}

.truck-name{
  flex:1;
}

.truck-option.used .truck-name{
  color:#888679;
}

.used-label{
  font-size:11px;
  padding:3px 7px;
  border-radius:20px;
  background:#e9e7df;
  color:#77756b;
  white-space:nowrap;
}

.fixed-tag{
  font-size:11px;
  padding:3px 7px;
  border-radius:20px;
  background:var(--accent-dim);
  color:var(--accent);
  white-space:nowrap;
}

.truck-dropdown-footer{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--line);
  background:#faf9f5;
}

.truck-dropdown-footer button{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-family:inherit;
}

.truck-dropdown-footer .primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* 人員 */

.staff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.staff-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 10px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.staff-item input{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}

.staff-item.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}

/* 件數 */

.seg{
  display:flex;
  gap:8px;
}

.seg button{
  flex:1;
  padding:14px 0;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:15px;
  font-weight:700;
}

.seg button[data-v="ok"].active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.seg button[data-v="bad"].active{
  background:var(--warn);
  border-color:var(--warn);
  color:#fff;
}

/* 照片 */

.photo-upload{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:#fff;
  position:relative;
  color:#8a8879;
}

.photo-upload .icon{
  font-size:30px;
  display:block;
  margin-bottom:6px;
}

.photo-upload input{
  position:absolute;
  inset:0;
  opacity:0;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.thumb{
  position:relative;
  aspect-ratio:1;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumb .rm{
  position:absolute;
  top:3px;
  right:3px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  border:none;
}

.hint{
  font-size:12px;
  color:#9a988c;
  margin-top:6px;
}

/* 備註 */

textarea{
  width:100%;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  font-size:16px;
  background:#fff;
  font-family:inherit;
  min-height:80px;
  resize:vertical;
}

/* 送出 */

.submit-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
}

.submit-bar .inner{
  max-width:480px;
  margin:auto;
}

button.submit{
  width:100%;
  padding:15px 0;
  border:none;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

button.submit:disabled{
  background:#a3a091;
}

.status{
  font-size:13px;
  text-align:center;
  margin-top:8px;
  color:var(--muted);
  min-height:16px;
}

.status.err{
  color:var(--warn);
}

.status.ok{
  color:var(--accent);
}

.loading{
  padding:18px;
  text-align:center;
  color:var(--muted);
}

</style>

</head>


<body>

<div class="wrap">

  <div class="brand">

    <h1>下貨點收回報</h1>

    <span
      class="who"
      id="whoami"
    >
      LINE 載入中…
    </span>

  </div>


  <fieldset>

    <legend>大車</legend>

    <div class="truck-select-wrap">

      <button
        type="button"
        class="truck-select-button"
        id="truckSelectButton"
      >
        請選擇大車…
      </button>


      <div
        class="truck-dropdown"
        id="truckDropdown"
      >

        <div
          class="truck-list"
          id="truckList"
        >
          <div class="loading">
            大車載入中…
          </div>
        </div>


        <div class="truck-dropdown-footer">

          <button
            type="button"
            id="truckClearBtn"
          >
            清除
          </button>

          <button
            type="button"
            class="primary"
            id="truckDoneBtn"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  </fieldset>


  <fieldset>

    <legend>下貨人員</legend>

    <div
      class="staff-grid"
      id="staffGrid"
    >
      <div class="loading">
        下貨人員載入中…
      </div>
    </div>

  </fieldset>


  <fieldset>

    <legend>件數是否正確</legend>

    <div
      class="seg"
      id="qtySeg"
    >

      <button
        type="button"
        data-v="ok"
        class="active"
      >
        ✓ 件數正確
      </button>

      <button
        type="button"
        data-v="bad"
      >
        ✗ 有多有少
      </button>

    </div>

  </fieldset>


  <fieldset>

    <legend>照片</legend>

    <div class="photo-upload">

      <span class="icon">📷</span>

      點此上傳照片（可一次選多張）

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        multiple
      >

    </div>

    <div
      class="photo-grid"
      id="photoGrid"
    ></div>

    <div class="hint">
      至少上傳1張，可拍照或從相簿選取多張
    </div>

  </fieldset>


  <fieldset>

    <legend>備註（選填）</legend>

    <textarea
      id="note"
      placeholder="有多有少的原因、異常說明等"
    ></textarea>

  </fieldset>

</div>


<div class="submit-bar">

  <div class="inner">

    <button
      class="submit"
      id="submitBtn"
    >
      送出回報
    </button>

    <div
      class="status"
      id="statusMsg"
    ></div>

  </div>

</div>


<script>

/* =================================================
   設定
================================================= */

const LIFF_ID =
  "2011084900-xvJIcgzA";

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycby8oksNTRuZEty3SpTCFYi2-QLdmLAVnQql9GxdKazFrg9DBLBTmTjfjFAifrj0gkBH/exec";


/* =================================================
   狀態
================================================= */

let userName =
  "未知使用者";

let photos = [];

let truckData = [];

let staffData = [];

let truckLastUsed = {};

let selectedTrucks =
  new Set();


/* =================================================
   狀態
================================================= */

function setStatus(
  message,
  type = ""
){

  const el =
    document.getElementById(
      "statusMsg"
    );

  el.textContent =
    message;

  el.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );

}


/* =================================================
   LINE LIFF
================================================= */

async function initLIFF(){

  try{

    await liff.init({
      liffId:
        LIFF_ID
    });


    if(
      !liff.isLoggedIn()
    ){

      liff.login();

      return false;

    }


    const profile =
      await liff.getProfile();


    userName =
      profile.displayName ||
      "未知使用者";


    document.getElementById(
      "whoami"
    ).textContent =
      userName;


    return true;

  }catch(error){

    console.error(
      error
    );


    document.getElementById(
      "whoami"
    ).textContent =
      "LINE 登入失敗";


    setStatus(
      "LINE 登入失敗",
      "err"
    );


    return false;

  }

}


/* =================================================
   取得後端
================================================= */

async function loadSystemData(){

  try{

    const response =
      await fetch(
        BACKEND_URL +
        "?t=" +
        Date.now(),
        {
          method:
            "GET",
          cache:
            "no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "後端回傳錯誤"
      );

    }


    truckData =
      result.data.trucks ||
      [];


    staffData =
      result.data.staff ||
      [];


    truckLastUsed =
      result.data.truckLastUsed ||
      {};


    renderTrucks();

    renderStaff();


  }catch(error){

    console.error(
      error
    );


    document.getElementById(
      "truckList"
    ).innerHTML =
      `
      <div class="loading">
        大車資料載入失敗
      </div>
      `;


    document.getElementById(
      "staffGrid"
    ).innerHTML =
      `
      <div class="loading">
        下貨人員資料載入失敗
      </div>
      `;


    setStatus(
      "無法連接系統：" +
      error.message,
      "err"
    );

  }

}


/* =================================================
   大車排序
================================================= */

function sortedTrucks(){

  return [
    ...truckData
  ].sort(
    function(a,b){

      if(
        a.fixed &&
        !b.fixed
      ){

        return -1;

      }


      if(
        !a.fixed &&
        b.fixed
      ){

        return 1;

      }


      if(
        a.fixed &&
        b.fixed
      ){

        return 0;

      }


      const aTime =
        truckLastUsed[
          a.name
        ] || "";


      const bTime =
        truckLastUsed[
          b.name
        ] || "";


      if(
        !aTime &&
        bTime
      ){

        return -1;

      }


      if(
        aTime &&
        !bTime
      ){

        return 1;

      }


      if(
        !aTime &&
        !bTime
      ){

        return 0;

      }


      return aTime.localeCompare(
        bTime
      );

    }
  );

}


/* =================================================
   顯示大車
================================================= */

function renderTrucks(){

  const list =
    document.getElementById(
      "truckList"
    );


  list.innerHTML =
    "";


  const trucks =
    sortedTrucks();


  if(
    trucks.length === 0
  ){

    list.innerHTML =
      `
      <div class="loading">
        目前沒有啟用中的大車
      </div>
      `;

    return;

  }


  trucks.forEach(
    function(truck){

      const lastTime =
        truckLastUsed[
          truck.name
        ] || "";


      const used =
        Boolean(
          lastTime
        );


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "truck-option" +
        (
          used
            ? " used"
            : ""
        );


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        truck.name;


      checkbox.checked =
        selectedTrucks.has(
          truck.name
        );


      checkbox.addEventListener(
        "change",
        function(){

          if(
            checkbox.checked
          ){

            selectedTrucks.add(
              truck.name
            );

          }else{

            selectedTrucks.delete(
              truck.name
            );

          }


          updateTruckButtonText();

        }
      );


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "truck-name";


      name.textContent =
        truck.name;


      label.appendChild(
        checkbox
      );


      label.appendChild(
        name
      );


      if(
        truck.fixed
      ){

        const tag =
          document.createElement(
            "span"
          );


        tag.className =
          "fixed-tag";


        tag.textContent =
          "固定";


        label.appendChild(
          tag
        );

      }


      /*
       * 已下貨：
       * 只顯示「已下」
       * 不再顯示時間
       */

      if(
        used &&
        !truck.fixed
      ){

        const tag =
          document.createElement(
            "span"
          );


        tag.className =
          "used-label";


        tag.textContent =
          "已下";


        label.appendChild(
          tag
        );

      }


      list.appendChild(
        label
      );

    }
  );


  updateTruckButtonText();

}


/* =================================================
   大車按鈕
================================================= */

function updateTruckButtonText(){

  const button =
    document.getElementById(
      "truckSelectButton"
    );


  const names =
    Array.from(
      selectedTrucks
    );


  if(
    names.length === 0
  ){

    button.textContent =
      "請選擇大車…";

    return;

  }


  if(
    names.length === 1
  ){

    button.textContent =
      names[0];

    return;

  }


  button.textContent =
    "已選 " +
    names.length +
    " 台大車";

}


/* =================================================
   下貨人員
================================================= */

function renderStaff(){

  const grid =
    document.getElementById(
      "staffGrid"
    );


  grid.innerHTML =
    "";


  staffData.forEach(
    function(staff){

      const label =
        document.createElement(
          "label"
        );


      label.className =
        "staff-item";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.value =
        staff.name;


      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        staff.name;


      checkbox.addEventListener(
        "change",
        function(){

          label.classList.toggle(
            "selected",
            checkbox.checked
          );

        }
      );


      label.appendChild(
        checkbox
      );


      label.appendChild(
        span
      );


      grid.appendChild(
        label
      );

    }
  );

}


/* =================================================
   大車下拉
================================================= */

document
  .getElementById(
    "truckSelectButton"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "truckDropdown"
        )
        .classList.toggle(
          "open"
        );

    }
  );


document
  .getElementById(
    "truckDoneBtn"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "truckDropdown"
        )
        .classList.remove(
          "open"
        );

    }
  );


document
  .getElementById(
    "truckClearBtn"
  )
  .addEventListener(
    "click",
    function(){

      selectedTrucks.clear();

      renderTrucks();

    }
  );


document.addEventListener(
  "click",
  function(event){

    const wrap =
      document.querySelector(
        ".truck-select-wrap"
      );


    if(
      !wrap.contains(
        event.target
      )
    ){

      document
        .getElementById(
          "truckDropdown"
        )
        .classList.remove(
          "open"
        );

    }

  }
);


/* =================================================
   件數
================================================= */

document
  .getElementById(
    "qtySeg"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target.tagName !==
        "BUTTON"
      ){

        return;

      }


      [
        ...event.currentTarget.children
      ].forEach(
        function(button){

          button.classList.remove(
            "active"
          );

        }
      );


      event.target.classList.add(
        "active"
      );

    }
  );


/* =================================================
   壓縮圖片
================================================= */

function compressImage(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const maxW =
                1200;


              const scale =
                Math.min(
                  1,
                  maxW /
                  img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =================================================
   顯示照片
================================================= */

function renderPhotoGrid(){

  const grid =
    document.getElementById(
      "photoGrid"
    );


  grid.innerHTML =
    "";


  photos.forEach(
    function(photo,index){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "thumb";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        photo;


      const remove =
        document.createElement(
          "button"
        );


      remove.className =
        "rm";


      remove.type =
        "button";


      remove.textContent =
        "×";


      remove.onclick =
        function(){

          photos.splice(
            index,
            1
          );


          renderPhotoGrid();

        };


      div.appendChild(
        img
      );


      div.appendChild(
        remove
      );


      grid.appendChild(
        div
      );

    }
  );

}


/* =================================================
   選照片
================================================= */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async function(event){

      const files =
        Array.from(
          event.target.files
        );


      if(
        files.length === 0
      ){

        return;

      }


      setStatus(
        "照片處理中…"
      );


      try{

        for(
          const file of files
        ){

          if(
            !file.type.startsWith(
              "image/"
            )
          ){

            continue;

          }


          const data =
            await compressImage(
              file
            );


          photos.push(
            data
          );

        }


        renderPhotoGrid();


        setStatus(
          ""
        );

      }catch(error){

        console.error(
          error
        );


        setStatus(
          "照片處理失敗",
          "err"
        );

      }


      event.target.value =
        "";

    }
  );


/* =================================================
   人員
================================================= */

function getSelectedStaff(){

  return Array.from(
    document.querySelectorAll(
      "#staffGrid input:checked"
    )
  ).map(
    function(input){

      return input.value;

    }
  );

}


/* =================================================
   送出
================================================= */

document
  .getElementById(
    "submitBtn"
  )
  .addEventListener(
    "click",
    async function(){

      const trucks =
        Array.from(
          selectedTrucks
        );


      const staff =
        getSelectedStaff();


      const qtyButton =
        document.querySelector(
          "#qtySeg button.active"
        );


      const qtyStatus =
        qtyButton &&
        qtyButton.dataset.v ===
        "bad"
          ? "有多有少"
          : "正確";


      const note =
        document
          .getElementById(
            "note"
          )
          .value
          .trim();


      if(
        trucks.length === 0
      ){

        setStatus(
          "請至少選擇1台大車",
          "err"
        );

        return;

      }


      if(
        staff.length === 0
      ){

        setStatus(
          "請至少選擇1位下貨人員",
          "err"
        );

        return;

      }


      if(
        photos.length === 0
      ){

        setStatus(
          "請至少上傳1張照片",
          "err"
        );

        return;

      }


      const button =
        document.getElementById(
          "submitBtn"
        );


      button.disabled =
        true;


      setStatus(
        "正在送出回報…"
      );


      const payload = {

        user:
          userName,

        trucks:
          trucks,

        staff:
          staff,

        qtyStatus:
          qtyStatus,

        note:
          note,

        photos:
          photos

      };


      try{

        await fetch(
          BACKEND_URL,
          {
            method:
              "POST",

            mode:
              "no-cors",

            headers:{
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


        setStatus(
          "✓ 回報成功",
          "ok"
        );


        /*
         * 立即更新畫面
         */

        trucks.forEach(
          function(name){

            truckLastUsed[
              name
            ] =
              "used";

          }
        );


        selectedTrucks.clear();

        photos = [];


        renderTrucks();

        renderPhotoGrid();


        document.getElementById(
          "note"
        ).value =
          "";


        document
          .querySelectorAll(
            "#staffGrid input"
          )
          .forEach(
            function(input){

              input.checked =
                false;


              input
                .closest(
                  ".staff-item"
                )
                ?.classList
                .remove(
                  "selected"
                );

            }
          );


        button.disabled =
          false;


      }catch(error){

        console.error(
          error
        );


        setStatus(
          "送出失敗：" +
          error.message,
          "err"
        );


        button.disabled =
          false;

      }

    }
  );


/* =================================================
   啟動
================================================= */

async function init(){

  const ok =
    await initLIFF();


  if(!ok){

    return;

  }


  await loadSystemData();

}


init();

</script>
